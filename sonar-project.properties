sonar.organization=drsnuggles8
sonar.projectKey=drsnuggles8_OloEngineBase

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=OloEngineBase
sonar.projectVersion=0.1

# ---------------------------------------------------------------------------
# Analysis scope (issue #411, items 2 & 4).
# ---------------------------------------------------------------------------
# Production-source root. Path is relative to this file; use "/" on Windows.
# Left at the project base dir (the historical default). Files SCM-ignored via
# .gitignore — build/, OloEngine/vendor/* (fetched at build time), the generated
# compile_commands.json — are dropped from indexing automatically, so the tree
# does not need enumerating here.
sonar.sources=.

# Test-source root (item 2). Without this, SonarCloud warned that files under
# OloEngine/tests "look like test code but 'sonar.tests' is not configured; rules
# targeting production code were not executed on these files." Declaring the test
# root makes the classification explicit and silences the warning; production
# rules keep running on OloEngine/src/**, OloEditor/src/**, OloRuntime/src/**,
# OloServer/src/**, the ScriptCore projects and tools/**.
sonar.tests=OloEngine/tests

# Files excluded from the production-source set:
#  (1) The test tree — a file may not be indexed as BOTH source and test ("File
#      can't be indexed twice"). sonar.sources=. spans the whole tree, so the test
#      tree is carved out here and indexed only via sonar.tests above.
#  (2) Non-source trees sonar.sources=. would otherwise index. SonarQube's default
#      SCM-exclusion only drops git-IGNORED paths (build/, OloEngine/vendor/*), which
#      leaves: the CI-injected Vulkan SDK (untracked + not gitignored, so SCM can't
#      catch it), the committed Mono runtime assemblies, and binary asset/icon trees
#      — hundreds of PNG/JPG/TTF/DLL/EXE/glTF files that are not source. Indexing them
#      only adds "invalid character for UTF-8" warnings, scan time, and memory.
#      Verified to contain zero analyzable source (OloEngine/mono is deliberately NOT
#      excluded — it holds 38 real source files). NOTE: this trims *indexing* only;
#      the C-family analyzer still parses SDK headers pulled in as #includes via the
#      compile DB, so the scanner-heap bump in SonarCloud.yml is the actual OOM fix.
sonar.exclusions=OloEngine/tests/**/*,VULKAN_SDK/**,OloEditor/mono/**,OloEditor/assets/**,OloEditor/Resources/**,assets/**

# Coverage scope (item 4). Test files must never count toward coverage of
# production code. No coverage report is imported in CI yet, so this is a no-op
# today — kept as correct hygiene for when one is added.
sonar.coverage.exclusions=OloEngine/tests/**/*

# Pin the analysed Python version. Without it, SonarCloud analysed the repo's
# Python (all of which lives under OloEngine/tests) "as compatible with all
# Python 3 versions", weakening rule precision. CI runs Python 3.10 (see the
# setup-python step and the pinned python-version in .github/workflows/SonarCloud.yml).
sonar.python.version=3.10

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Copy-paste (CPD) exclusions.
# The GoogleTest suite is deliberately scaffold-uniform: every renderer math
# test (e.g. ContactShadowMathTest, ScreenSpaceGIMathTest, ScreenSpaceReflection-
# MathTest) and every visual-evidence test (ContactShadow/SSR/SSGI/PCSS/Ocean/
# Water…VisualEvidenceTest) shares the same RGB/Luma helpers, mean-band sampling,
# framebuffer-capture + golden-PNG comparison harness. That structural sameness
# is the point (docs/testing.md) — it is not copy-paste rot. CPD therefore reports
# pure noise on tests/**, where the engine already special-cases analyzer scope
# (see the tst_* issue exclusions below). Production sources stay under full CPD.
sonar.cpd.exclusions=OloEngine/tests/**/*

# ---------------------------------------------------------------------------
# Issue exclusions — see docs/analysis/sonarqube-rules.md for rationale.
# Two groups:
#   tst_*  — scope mismatches on idiomatic GoogleTest code in tests/** where the
#            concern the rule guards against does not apply. Kept active on
#            production sources (OloEngine/src/**, OloEditor/src/**, ...).
#   fp_*/  — false positives the analyzer cannot see through (constrained
#   ecs_*/   templates, ECS predicate chains, X-macro template-arg pasting),
#   xmacro_* scoped as narrowly as the offending location allows.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=tst_s5443,tst_s3656,tst_s997,tst_s1001,fp_s5000,ecs_s1067,xmacro_s963,cmp_s1244_components,cmp_s1244_rendercmd,env_s990,lever_s963,lever_s958,lever_s960,lever_m23042,lever_s1820,interactivity_s5421

# S5443 "avoid publicly writable directories": GoogleTest fixtures legitimately
# use std::filesystem::temp_directory_path() for isolated, self-cleaning artefacts;
# the multi-user-race attacker model does not apply to CI/dev test runs.
sonar.issue.ignore.multicriteria.tst_s5443.ruleKey=cpp:S5443
sonar.issue.ignore.multicriteria.tst_s5443.resourceKey=OloEngine/tests/**/*

# S3656 "member variables should not be protected": TEST_F fixtures require
# protected (subclass-accessible) members by design; private breaks the macro.
sonar.issue.ignore.multicriteria.tst_s3656.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.tst_s3656.resourceKey=OloEngine/tests/**/*

# S997 "move this declaration into a namespace": GoogleTest fixture classes are
# conventionally file-scoped so the TEST_F-generated subclass can find them.
sonar.issue.ignore.multicriteria.tst_s997.ruleKey=cpp:S997
sonar.issue.ignore.multicriteria.tst_s997.resourceKey=OloEngine/tests/**/*

# S1001 "using-directive shall not be used": `using namespace OloEngine;` is the
# established convention across the test suite (engine types are pervasive there).
sonar.issue.ignore.multicriteria.tst_s1001.ruleKey=cpp:S1001
sonar.issue.ignore.multicriteria.tst_s1001.resourceKey=OloEngine/tests/**/*

# S5000 "use operator== for non-trivially-copyable types": all hits are at the
# single Math::BitwiseEqual helper, which static_asserts std::is_trivially_copyable_v<T>
# — misuse is a compile error. Sonar cannot see through the static_assert +
# template-instantiation chain and flags every callsite. False positive.
sonar.issue.ignore.multicriteria.fp_s5000.ruleKey=cpp:S5000
sonar.issue.ignore.multicriteria.fp_s5000.resourceKey=OloEngine/src/OloEngine/Math/Math.h

# S1067 "reduce conditional operators (max 3)": the ECS layer's per-component
# HasComponent<>() predicate chains and serializer dispatch intrinsically produce
# long boolean expressions; naming each sub-predicate just restates it. Scoped to
# the Scene subsystem where the pattern is inherent rather than a smell.
sonar.issue.ignore.multicriteria.ecs_s1067.ruleKey=cpp:S1067
sonar.issue.ignore.multicriteria.ecs_s1067.resourceKey=OloEngine/src/OloEngine/Scene/**/*

# S963 "parenthesise function-like macro parameters": Prefab.cpp's X-macro pastes
# component types into template-argument lists (<CompType>), where the C++ grammar
# forbids parentheses (<(CompType)> does not parse). Unsatisfiable as written.
sonar.issue.ignore.multicriteria.xmacro_s963.ruleKey=cpp:S963
sonar.issue.ignore.multicriteria.xmacro_s963.resourceKey=OloEngine/src/OloEngine/Scene/Prefab.cpp

# S1244 "floats should not be tested for equality": Components.h's per-component
# `operator==(...) = default` is the documented undo/redo change-detection hook
# (see CLAUDE.md "Editor undo/redo for components"). Defaulted member-wise float
# equality is exactly the bit-exact change-detection semantics intended here;
# rewriting each as a hand-rolled epsilon/BitwiseEqual comparison would defeat the
# `= default` pattern. Scoped to Components.h (real ==/!= float bugs elsewhere in
# Scene/** stay flagged).
sonar.issue.ignore.multicriteria.cmp_s1244_components.ruleKey=cpp:S1244
sonar.issue.ignore.multicriteria.cmp_s1244_components.resourceKey=OloEngine/src/OloEngine/Scene/Components.h

# S1244 in RenderCommand.h: PODMaterialData::operator== is a deliberate field-wise
# exact comparison for render-command change detection / dedup (it intentionally
# avoids memcmp because of struct padding — see the comment there). Exact equality
# is the wanted semantics; an epsilon compare would wrongly merge distinct materials.
sonar.issue.ignore.multicriteria.cmp_s1244_rendercmd.ruleKey=cpp:S1244
sonar.issue.ignore.multicriteria.cmp_s1244_rendercmd.resourceKey=OloEngine/src/OloEngine/Renderer/Commands/RenderCommand.h

# S990 "remove this use of getenv": Environment.cpp is the engine's ONE getenv
# call site (Environment.h's own doc comment explains why — no portable
# thread-safe alternative exists, and the returned pointer is copied into a
# std::string before this function returns, so no caller ever holds it).
# History matters here: an earlier version tried to justify this with an
# inline "NOSONAR cpp:S990" comment instead of a project-level exclusion, and
# it was never a valid suppression syntax (NOSONAR must be a trailing comment
# on the flagged line itself, not prose several lines above it) — the rule
# kept firing and the PR's Reliability Rating stayed D. This entry is the fix.
sonar.issue.ignore.multicriteria.env_s990.ruleKey=cpp:S990
sonar.issue.ignore.multicriteria.env_s990.resourceKey=OloEngine/src/OloEngine/Core/Environment.cpp

# S963/S958/S960/M23_042 on Core/DebugLevers.{h,cpp}: the debug-lever registry
# table (Core/DebugLevers.inl) is an X-macro — OLO_LEVER_TOGGLE/EXACT/TRISTATE/
# INT/NUMBER/TEXT are #define'd, the .inl is #include'd to expand them into six
# different shapes (declarations, two storage structs, the environment seed,
# the accessors/setters, the Snapshot() enumeration), then #undef'd — the same
# pattern already scoped for cpp:S963 on Prefab.cpp above, just with three
# more macro-shaped rules along for the ride because these macros are
# deliberately #define'd and #undef'd inside local (function/namespace) scope
# rather than at file scope, so their names don't leak past the one generation
# site that needs them. "Replace with a C++ function" (S960/M23_042) is not
# available: the whole point is generating six DIFFERENT constructs from one
# table, which no single function signature can do. "Move to global namespace"
# (S958) would leak six macro names for no reader's benefit.
sonar.issue.ignore.multicriteria.lever_s963.ruleKey=cpp:S963
sonar.issue.ignore.multicriteria.lever_s963.resourceKey=OloEngine/src/OloEngine/Core/DebugLevers.*
sonar.issue.ignore.multicriteria.lever_s958.ruleKey=cpp:S958
sonar.issue.ignore.multicriteria.lever_s958.resourceKey=OloEngine/src/OloEngine/Core/DebugLevers.*
sonar.issue.ignore.multicriteria.lever_s960.ruleKey=cpp:S960
sonar.issue.ignore.multicriteria.lever_s960.resourceKey=OloEngine/src/OloEngine/Core/DebugLevers.*
sonar.issue.ignore.multicriteria.lever_m23042.ruleKey=cpp:M23_042
sonar.issue.ignore.multicriteria.lever_m23042.resourceKey=OloEngine/src/OloEngine/Core/DebugLevers.*

# S1820 "no more than 20 fields": DebugLevers.cpp's Storage struct has one
# field per lever (21, at the time this was written) by design — the same
# X-macro table generates the struct AND the accessors that read it, so the
# field count is exactly the lever count, not something a restructure could
# reduce without breaking the 1:1 mapping the whole file exists to keep
# mechanical. (The companion Overridden struct sits at 20 fields — one per
# lever except the read-only TEXT kind, which needs no override flag — so it
# stays under the threshold on its own and needs no exclusion.)
sonar.issue.ignore.multicriteria.lever_s1820.ruleKey=cpp:S1820
sonar.issue.ignore.multicriteria.lever_s1820.resourceKey=OloEngine/src/OloEngine/Core/DebugLevers.cpp

# S5421 "global variables should be const" on Interactivity.cpp's
# s_NonInteractive: a mutable std::atomic<bool> IS the point — SetNonInteractive()
# exists specifically to flip it at runtime (the test harness, and any future
# host that knows it's automated, call it at startup). Same false-positive
# class as the existing S5421 note in sonar-cleanup-deferred-rules.md: the rule
# can't distinguish "global that should never change" from "global whose whole
# job is to be atomically mutable state".
sonar.issue.ignore.multicriteria.interactivity_s5421.ruleKey=cpp:S5421
sonar.issue.ignore.multicriteria.interactivity_s5421.resourceKey=OloEngine/src/OloEngine/Core/Interactivity.cpp
