name: 'Setup vcpkg'
description: >
  Resolve VCPKG_ROOT, make sure the clone contains the baseline commit pinned in
  vcpkg.json, and wire the GitHub Actions binary cache so ports are restored
  instead of rebuilt. Emits `toolchain-args` for the caller to splice into its
  cmake configure line.
inputs:
  triplet:
    description: 'Target triplet (x64-windows-static-md on Windows for BOTH cl.exe and clang-cl jobs, x64-linux on Linux)'
    required: true
  read-only:
    description: 'Restore from the binary cache but do not write to it (use on fork PRs, which cannot write caches)'
    required: false
    default: 'false'
outputs:
  toolchain-args:
    description: 'CMake arguments selecting the vcpkg toolchain, triplet and overlays'
    value: ${{ steps.emit.outputs.toolchain-args }}
  cache-key:
    description: >
      The actions/cache key this run should SAVE the binary cache under, or the empty
      string when there is nothing to save (a self-hosted runner keeps the cache on
      local disk; a fork PR cannot write caches). Feed it to
      .github/actions/save-vcpkg-cache in an `if: always()` step -- see that action.
    value: ${{ steps.cachecfg.outputs.save-key }}
  cache-path:
    description: 'Directory holding the vcpkg binary archives (the path to save).'
    value: ${{ steps.cachecfg.outputs.dir }}
runs:
  using: 'composite'
  steps:
    # Ports that build through autotools need the autotools themselves from the
    # system package manager -- vcpkg does not vendor them. libsodium is the one
    # that bites here (its Linux path is autotools; only its Windows/MSVC path is
    # an msbuild solution), and it fails with an explicit list:
    #
    #   libsodium currently requires the following programs from the system package
    #   manager: autoconf autoconf-archive automake libtoolize
    #
    # `autoconf-archive` in particular is NOT on the GitHub Ubuntu image. pkg-config
    # is included because vcpkg_fixup_pkgconfig and several ports expect it.
    #
    # Detect-first, install-second — and only ever install where that can work.
    # An unconditional `sudo apt-get` here killed the gpu-conformance-amd nightly
    # for days: the self-hosted Rocky runner has neither apt-get nor passwordless
    # sudo, so the step died on "sudo: a terminal is required to read the
    # password" before the suite ever built (#691 Phase 9). Self-hosted runners
    # are provisioned system-wide, ahead of time (docs/ops/self-hosted-gpu-runner.md)
    # — a workflow step must verify, not install. GitHub-hosted Ubuntu images keep
    # the install path: passwordless sudo + apt-get are guaranteed there, and
    # autoconf-archive genuinely is missing from the stock image.
    #
    # curl/zip/unzip/tar are vcpkg's OWN bootstrap prerequisites (scripts/
    # bootstrap.sh checks for them before it will build vcpkg-tool), not port
    # dependencies -- but they belong in the same check for the same reason:
    # every GitHub-hosted image ships them, so a self-hosted host is the only
    # place their absence shows up. Rocky 10 turned out to have neither `zip`
    # nor `unzip`, and because bootstrap.sh reports only the FIRST missing one,
    # installing just the name it printed would have failed again on the next.
    # Hence: check them as a SET here, so one provisioning message names
    # everything at once instead of costing a round trip per package.
    #
    # Checking them here also stops the bootstrap retry loop below from burning
    # three attempts (45s) on a deterministic failure -- that retry exists for
    # transient network drops during the tool download, and it printed vcpkg's
    # 20-line "Could not find zip" help text three times before failing.
    - name: Verify build prerequisites (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for tool in autoconf autoreconf automake libtoolize pkg-config curl zip unzip tar; do
          command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
        done
        # autoconf-archive ships m4 macros, not a binary; probe a canonical
        # macro file in the aclocal search path instead of a command.
        have_archive=false
        for dir in $(aclocal --print-ac-dir 2>/dev/null) /usr/share/aclocal /usr/local/share/aclocal; do
          if [ -f "$dir/ax_check_compile_flag.m4" ]; then have_archive=true; break; fi
        done
        [ "$have_archive" = true ] || missing+=("autoconf-archive")
        if [ ${#missing[@]} -eq 0 ]; then
          echo "autotools + vcpkg bootstrap prerequisites already provisioned; nothing to install"
          exit 0
        fi
        # Gate the install on runner.environment, not merely on "apt-get exists
        # and sudo works". Those two are a PROXY for github-hosted, and the proxy
        # is wrong for a self-hosted Debian/Ubuntu host with passwordless sudo --
        # a common setup -- which would silently take the install path and mutate
        # a machine that is provisioned system-wide, ahead of time. It only held
        # here because the one self-hosted runner is Rocky (no apt-get). Assert
        # the actual condition; keep the apt-get/sudo checks as a fallback so a
        # hosted image that ever lacks them lands on the message, not on a
        # sudo error.
        if [ "${{ runner.environment }}" = "github-hosted" ] \
           && command -v apt-get >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake libtool pkg-config curl zip unzip tar
        else
          echo "::error::build prerequisites missing (${missing[*]}) on a ${{ runner.environment }} runner."
          echo "::error::Self-hosted runners are provisioned system-wide, ahead of time -- this step verifies, never installs."
          echo "::error::Provision the runner system-wide: sudo dnf install -y autoconf autoconf-archive automake libtool pkgconf-pkg-config curl zip unzip tar"
          echo "::error::See docs/ops/self-hosted-gpu-runner.md (Host provisioning)."
          exit 1
        fi

    - name: Resolve vcpkg root
      shell: bash
      run: |
        set -euo pipefail
        # Retry transient network failures. The vcpkg clone/fetch and the bootstrap
        # download hit GitHub's git/download endpoints, which intermittently drop
        # the connection ("socket hang up") — a single blip otherwise fails the
        # whole job, and a partial fetch surfaces later as the misleading
        # "no version database entry for zlib". ~4 tries with exponential backoff
        # clears essentially all of them.
        retry() {
          local n=0 max=4 delay=8
          until "$@"; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::'$*' failed after $max attempts"
              return 1
            fi
            echo "attempt $n/$max of '$*' failed; retrying in ${delay}s..." >&2
            sleep "$delay"
            delay=$((delay * 2))
          done
        }
        # http.lowSpeed* makes a STALLED transfer (<1 KB/s for 60s) fail fast so a
        # hung connection trips the retry above instead of hanging to the job
        # timeout. Applied command-locally (git -c ...) so the runner's persistent
        # git config is left untouched.

        # GitHub-hosted runners ship a bootstrapped vcpkg at VCPKG_INSTALLATION_ROOT.
        # Self-hosted runners may not, so fall back to a clone. Either way VCPKG_ROOT
        # is what the rest of this action and the CMake presets read.
        #
        # WHERE that fallback clone lives differs by runner kind, and it matters. On a
        # hosted runner RUNNER_TEMP is as good as anywhere -- the whole VM is
        # discarded. On a self-hosted runner RUNNER_TEMP is emptied at the start of
        # every job, so a clone there is re-fetched from github.com on every single
        # run: minutes of network per job, forever, for a repository that only
        # changes when the manifest baseline moves. Put it under the runner user's
        # cache instead, where it persists and the checkout below is the only work
        # left to do.
        #
        # PER RUNNER, not per user. Several runner instances share one Unix account
        # on the self-hosted box (olo-ci-1 and olo-ci-2 both run as gh-runner-olo),
        # and the next steps do NOT treat this directory as read-only: they
        # `git checkout --force --detach` it to the manifest baseline and run
        # bootstrap-vcpkg.sh in it. Two concurrent jobs sharing one clone would race
        # on the index lock, on $VCPKG_ROOT/downloads, and -- worst, because it is
        # silent -- on the version database, which one job can swap out from under
        # another job's install. RUNNER_NAME is unique per instance and stable
        # across runs, so each gets its own clone and keeps its own warmth.
        root="${VCPKG_INSTALLATION_ROOT:-}"
        if [ -z "$root" ] || [ ! -d "$root/.git" ]; then
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            root="${RUNNER_TEMP}/vcpkg"
          else
            root="${OLO_VCPKG_PERSISTENT_ROOT:-$HOME/.cache/olo/vcpkg-${RUNNER_NAME:-default}}"
            # Assert the cache root is WRITABLE before handing the path to git.
            # Without this the failure is `fatal: could not create work tree dir
            # ...: Permission denied`, repeated four times by the retry loop above
            # (which exists for network flakes and can do nothing for a permission
            # problem), and it reads as a git or network fault rather than as the
            # provisioning fault it is. That is exactly how the first self-hosted
            # run failed.
            parent="$(dirname "$root")"
            if ! mkdir -p "$parent" 2>/dev/null || [ ! -w "$parent" ]; then
              echo "::error::'$parent' is not writable by $(id -un) on this self-hosted runner."
              echo "::error::Re-run the provisioning script, which creates and chowns it:"
              echo "::error::  sudo bash scripts/setup-olo-ci-runners.sh"
              echo "::error::See docs/ops/self-hosted-gpu-runner.md (Host provisioning, §1c and §6)."
              exit 1
            fi
          fi
          if [ ! -d "$root/.git" ]; then
            retry git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 \
              clone --filter=blob:none https://github.com/microsoft/vcpkg "$root"
          fi
        fi
        echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
        echo "resolved VCPKG_ROOT=$root"

    - name: Make the manifest baseline resolvable
      shell: bash
      run: |
        set -euo pipefail
        # Same transient-network retry as the previous step (each `run:` is its own
        # shell, so the helper is redefined here).
        retry() {
          local n=0 max=4 delay=8
          until "$@"; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::'$*' failed after $max attempts"
              return 1
            fi
            echo "attempt $n/$max of '$*' failed; retrying in ${delay}s..." >&2
            sleep "$delay"
            delay=$((delay * 2))
          done
        }
        baseline=$(python3 -c "import json,sys;print(json.load(open('vcpkg.json'))['builtin-baseline'])" 2>/dev/null \
                || python -c "import json,sys;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
        echo "manifest baseline: $baseline"

        # `core.fsmonitor` makes git spawn a daemon that watches the worktree and holds
        # open handles inside it. vcpkg checks each port version out into
        # buildtrees/versioning_/versions/<port>/<tree>.tmp and then RENAMES it into
        # place — a rename the daemon's handle makes fail on Windows with
        # "The process cannot access the file because it is being used by another
        # process". Turn it off for the registry clone; nothing about a read-only
        # registry benefits from it.
        git -C "$VCPKG_ROOT" config core.fsmonitor false

        # The runner's preinstalled clone sits at whatever commit the image was built
        # at, which is almost never our baseline. It is NOT enough to fetch that
        # commit: vcpkg reads `versions/baseline.json` from git AT the baseline, but
        # reads each port's version database (`versions/<x>-/<port>.json`) from the
        # WORKING TREE. An older tree then cannot resolve what the baseline names:
        #
        #   error: no version database entry for zlib at 1.3.2#2.
        #   Available versions: 1.3.2#1, 1.3.2, 1.3.1, …
        #
        # So the tree has to be checked out at the baseline, not merely aware of it.
        # (This does not reproduce on a dev box whose clone is already AT the
        # baseline — which is exactly how it reached CI unnoticed.)
        # Blobless, NOT --depth 1. A shallow fetch leaves the registry without the
        # git-tree objects that a vcpkg.json "overrides" entry resolves through, so
        # holding a single port back at an older version would fail with an
        # unresolvable version. --filter=blob:none keeps the full commit/tree history
        # (which is what version resolution walks) and defers blobs until read, so it
        # costs little more than a shallow fetch. Matches the clone above, and the
        # "do not clone vcpkg shallow" rule in
        # docs/agent-rules/vcpkg-dependency-management.md.
        if ! git -C "$VCPKG_ROOT" cat-file -e "${baseline}^{commit}" 2>/dev/null; then
          # -c http.lowSpeed*: fail fast on a stalled fetch so the retry engages
          # (command-local — the runner's git config is left untouched).
          retry git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 \
            -C "$VCPKG_ROOT" fetch --filter=blob:none origin "$baseline"
        fi
        # The checkout materialises the working tree; on a blobless clone that
        # lazily fetches the tree's blobs from origin, so it is a network op too —
        # give it the same retry + fail-fast-on-stall treatment as the fetch above.
        retry git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 \
          -C "$VCPKG_ROOT" checkout --force --detach "$baseline"
        git -C "$VCPKG_ROOT" rev-parse HEAD

        # Bootstrap unconditionally: the tool version is pinned per registry commit
        # (scripts/vcpkg-tool-metadata.txt), so the image's prebuilt binary can be
        # older than the baseline expects. The script no-ops when it already matches.
        #
        # Retried with backoff: when the pinned tool version does NOT match, the
        # script downloads vcpkg.exe straight from the vcpkg-tool GitHub release —
        # the one network hop in this action with no cache or retry in front of it,
        # and a hard `throw` on the first failed response. Observed dying a job at
        # the 3-minute mark, before configure:
        #
        #   Downloading https://github.com/microsoft/vcpkg-tool/releases/download/…/vcpkg.exe
        #     -> While calling Windows API function WinHttpReceiveResponse got error
        #        0x00002F78: The server returned an invalid or unrecognized response
        #
        # Bootstrapping is idempotent (it re-checks the version and re-downloads into
        # a temp path before moving it into place), so re-running it after a truncated
        # transfer is safe. Three attempts, 15s then 30s apart; a genuine breakage —
        # a bad baseline, a deleted release — still fails, just 45s later.
        #
        # Each attempt is bounded to 900s so a fully STALLED download (the connection
        # stays open but no bytes flow — retry can't help because the command never
        # returns) is killed and retried instead of burning the whole job. 900s is
        # far above the few-second binary download.
        #   * Linux: scripts/bootstrap.sh downloads via `curl … --retry 3 --fail`;
        #     coreutils `timeout` kills a hung curl.
        #   * Windows: bootstrap-vcpkg.bat -> cmd -> PowerShell -> WinHTTP. coreutils
        #     `timeout` only signals the direct child and cannot take down that whole
        #     process tree, so use a Windows-native bound: run the .bat under a .NET
        #     Process (whose ExitCode propagates the real bootstrap result — the
        #     Start-Process cmdlet silently reports 0 on failure) and `taskkill /T /F`
        #     the tree on the deadline (exit 124, which the retry loop treats as a
        #     failed attempt).
        if [ "$RUNNER_OS" = "Windows" ]; then
          bootstrap="$VCPKG_ROOT/bootstrap-vcpkg.bat"
          run_bootstrap() {
            MSYS2_ARG_CONV_EXCL='*' powershell -NoProfile -ExecutionPolicy Bypass -Command "\$p = New-Object System.Diagnostics.Process; \$p.StartInfo.FileName='cmd.exe'; \$p.StartInfo.Arguments='/c \"\"$bootstrap\" -disableMetrics\"'; \$p.StartInfo.UseShellExecute=\$false; [void]\$p.Start(); if (\$p.WaitForExit(900000)) { exit \$p.ExitCode }; & taskkill /T /F /PID \$p.Id *> \$null; Write-Host '::warning::vcpkg bootstrap exceeded 900s; killed process tree'; exit 124"
          }
        else
          bootstrap="$VCPKG_ROOT/bootstrap-vcpkg.sh"
          run_bootstrap() { timeout 900 "$bootstrap" -disableMetrics; }
        fi
        for attempt in 1 2 3; do
          if run_bootstrap; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "::error::vcpkg bootstrap failed after 3 attempts. See .github/actions/setup-vcpkg."
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::vcpkg bootstrap attempt ${attempt} failed; retrying in ${delay}s"
          sleep "$delay"
        done

    # BINARY CACHING. `x-gha` is NOT usable: vcpkg-tool removed the provider in
    # microsoft/vcpkg-tool#1662 (merged 2025-04-29), and the tool release this
    # manifest's baseline pins (2026-07-27) keeps only a stub that emits
    # `msgGhaBinaryCacheDeprecated` and registers nothing:
    #
    #   else if (segments[0].second == "x-gha")
    #   { add_warning(msg::format(msgGhaBinaryCacheDeprecated, ...)); }
    #
    # It WARNS rather than erroring, so a CI run configured that way looks
    # completely normal while rebuilding every port from source — the exact silent
    # cache failure issue #773 exists to eliminate. Use the plain `files` provider
    # over a workspace directory wrapped in actions/cache instead.
    #
    # A NuGet feed on GitHub Packages is the other supported option and does not
    # consume the repo's Actions-cache quota; it needs `packages: write` on every
    # calling workflow plus the NuGet CLI (and mono on Linux). Worth revisiting if
    # the 10 GB cache cap becomes the binding constraint — see the note on
    # SCCACHE_DIR in Windows.yml.
    - name: Configure the vcpkg binary cache
      id: cachecfg
      shell: bash
      env:
        # Read the workflow expressions through the environment rather than
        # splicing them into the script body. A `${{ }}` interpolated straight
        # into shell source is the githubactions:S7637 injection shape, and
        # `inputs.triplet` is caller-controlled text.
        OLO_VCPKG_READ_ONLY: ${{ inputs.read-only }}
        OLO_VCPKG_TRIPLET: ${{ inputs.triplet }}
        OLO_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        OLO_VCPKG_CACHE_HASH: ${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/overlay-ports/**') }}
        # "true" exactly when this run cannot write the cache service: a
        # pull_request from a fork, whose GITHUB_TOKEN is read-only. Derived from
        # the event here rather than from the `read-only` input, because no caller
        # passes that input and a guard nothing reaches is not a guard.
        OLO_VCPKG_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        set -euo pipefail

        # WHERE THE ARCHIVES LIVE, and it differs by runner kind on purpose.
        #
        # GitHub-hosted: inside the workspace, round-tripped through actions/cache.
        #   The workspace dies with the VM, so the cache service is the only way an
        #   archive outlives the run -- at the cost of an upload, a download, and a
        #   slice of the repo's single 10 GB cache cap.
        #
        # Self-hosted: a directory in the runner user's home that simply persists.
        #   No upload, no download, no cap, and -- the part that matters most --
        #   no post-job save step for a cancellation to skip. 60%+ of this repo's
        #   PR runs are cancelled by cancel-in-progress (#1009), and a cancelled
        #   run banks nothing through actions/cache. On local disk there is nothing
        #   to bank: vcpkg wrote the archive the moment it built the port.
        #
        # The workspace path keeps its backslash->forward-slash normalisation for
        # the same reason as the toolchain args below (this value goes into
        # GITHUB_ENV and is read back by later bash steps).
        if [ "$OLO_RUNNER_ENVIRONMENT" = "github-hosted" ]; then
          dir="${GITHUB_WORKSPACE//\\//}/.vcpkg-binary-cache"
          persistent=false
        else
          dir="${OLO_VCPKG_PERSISTENT_CACHE_DIR:-$HOME/.cache/olo/vcpkg-binary-cache}"
          persistent=true
        fi
        mkdir -p "$dir"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$dir" >> "$GITHUB_ENV"
        if [ "$OLO_VCPKG_READ_ONLY" = "true" ]; then
          echo "VCPKG_BINARY_SOURCES=clear;files,$dir,read" >> "$GITHUB_ENV"
        else
          echo "VCPKG_BINARY_SOURCES=clear;files,$dir,readwrite" >> "$GITHUB_ENV"
        fi
        # Ports build with their own internal parallelism; leave headroom for the
        # runner. The comment here used to say "2 on GitHub-hosted, more on
        # self-hosted" while hard-coding 2 for both -- so the 8C/16T box built its
        # 116 ports two at a time, exactly as slowly as a 2-core hosted VM.
        #
        # 4 on self-hosted, not 8: two runner instances share this machine, so 4
        # each is its 8 physical cores fully committed and no more. Port builds are
        # not sanitizer-instrumented, so this is CPU-bound rather than the
        # memory-bound case the sanitizer build widths are chosen against.
        if [ "$OLO_RUNNER_ENVIRONMENT" = "github-hosted" ]; then
          default_concurrency=2
        else
          default_concurrency=4
        fi
        echo "VCPKG_MAX_CONCURRENCY=${VCPKG_MAX_CONCURRENCY:-$default_concurrency}" >> "$GITHUB_ENV"

        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "persistent=$persistent" >> "$GITHUB_OUTPUT"

        # The key the CALLER saves under. Emitted here, not spelled out at eleven
        # call sites, so a save key can never drift from the restore key it is
        # supposed to pair with.
        #
        # Empty means "there is nothing for a save step to do":
        #   * persistent -- the archives are already durable on local disk;
        #   * a fork PR  -- its GITHUB_TOKEN cannot write the cache service at all,
        #                   so a save step could only ever log a permission error at
        #                   the end of every fork PR;
        #   * read-only  -- the caller asked for restore-only semantics.
        key=""
        if [ "$persistent" = false ] \
           && [ "$OLO_VCPKG_FORK_PR" != "true" ] \
           && [ "$OLO_VCPKG_READ_ONLY" != "true" ]; then
          key="vcpkg-${RUNNER_OS}-${OLO_VCPKG_TRIPLET}-${OLO_VCPKG_CACHE_HASH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        fi
        echo "save-key=$key" >> "$GITHUB_OUTPUT"
        echo "vcpkg binary cache: dir=$dir persistent=$persistent save-key=${key:-<none>}"

    # NOT PRUNED BY DEFAULT, and that is the safe direction.
    #
    # Both self-hosted runners share this one directory, and vcpkg's `files`
    # provider restores an archive as "does <abi>.zip exist?" followed by
    # "decompress <abi>.zip". Deleting between those two steps is not an error
    # anywhere: vcpkg treats the restore as unavailable and rebuilds the port. So a
    # prune running on olo-ci-1 can silently cost olo-ci-2 a from-source build, with
    # no failure and no log line saying why -- the precise shape of #1009 itself.
    # Serialising it properly would need a lock the vcpkg install ALSO takes, and
    # that install happens in the caller's configure step, outside this action.
    #
    # An unsafe bound is worse than no bound, and no bound is not urgent: the cache
    # is ~330 MiB against 233 GiB free on /home. So the eviction is opt-in. Set
    # OLO_VCPKG_CACHE_PRUNE=1 to run it, ideally when no other job is active.
    #
    # Size-capped rather than age-based when it does run. `find -atime +30` is a trap
    # twice over: a `noatime` mount never updates access time, so on the wrong
    # filesystem it deletes the LIVE archive set every 30 days and the next job
    # rebuilds every port with no error; and age is the wrong signal anyway, since an
    # archive for a port that has not changed in a year is old and entirely current.
    - name: Prune the persistent binary cache (self-hosted, opt-in)
      if: steps.cachecfg.outputs.persistent == 'true' && env.OLO_VCPKG_CACHE_PRUNE == '1'
      shell: bash
      env:
        OLO_VCPKG_CACHE_DIR: ${{ steps.cachecfg.outputs.dir }}
      run: |
        set -euo pipefail
        cap_mib="${OLO_VCPKG_CACHE_CAP_MIB:-20480}"
        used_mib=$(du -sm "$OLO_VCPKG_CACHE_DIR" 2>/dev/null | cut -f1 || echo 0)
        echo "persistent vcpkg binary cache: ${used_mib} MiB used, cap ${cap_mib} MiB ($OLO_VCPKG_CACHE_DIR)"
        if [ "$used_mib" -le "$cap_mib" ]; then
          echo "  under cap; nothing evicted"
          exit 0
        fi
        over=$(( (used_mib - cap_mib) * 1048576 ))
        freed=0
        # Space-separated rather than tab: a vcpkg archive path is
        # <two hex chars>/<abi hash>.zip, so it can never contain a space, and
        # avoiding the escape keeps this readable inside a YAML block scalar.
        # %T@ is mtime -- always recorded, unlike atime.
        while read -r _ts size path; do
          [ "$freed" -lt "$over" ] || break
          rm -f -- "$path" && freed=$((freed + size))
        done < <(find "$OLO_VCPKG_CACHE_DIR" -type f -name '*.zip' -printf '%T@ %s %p\n' 2>/dev/null | sort -n)
        find "$OLO_VCPKG_CACHE_DIR" -mindepth 1 -type d -empty -delete 2>/dev/null || true
        echo "  evicted $((freed / 1048576)) MiB (oldest first) to get back under the cap"

    # Report the size unconditionally, so the directory cannot grow unnoticed just
    # because nothing prunes it.
    - name: Report the persistent binary cache size (self-hosted)
      if: steps.cachecfg.outputs.persistent == 'true'
      shell: bash
      env:
        OLO_VCPKG_CACHE_DIR: ${{ steps.cachecfg.outputs.dir }}
      run: |
        set -euo pipefail
        echo "persistent vcpkg binary cache: $(du -sh "$OLO_VCPKG_CACHE_DIR" 2>/dev/null | cut -f1) ($OLO_VCPKG_CACHE_DIR)"

    # Guard against exactly the x-gha class of failure: a provider that this tool
    # build no longer implements is accepted with a warning and silently ignored.
    # `vcpkg help binarycaching` enumerates what the CURRENT binary actually
    # supports, so asserting our provider appears there fails loudly at setup
    # instead of after a 35-minute uncached build.
    - name: Verify the binary-cache provider is supported by this vcpkg
      shell: bash
      run: |
        set -euo pipefail
        vcpkg_exe="$VCPKG_ROOT/vcpkg"
        [ -f "$VCPKG_ROOT/vcpkg.exe" ] && vcpkg_exe="$VCPKG_ROOT/vcpkg.exe"
        if ! "$vcpkg_exe" help binarycaching | grep -qE '^\s*files,<path>'; then
          echo "::error::This vcpkg build does not list the 'files' binary-cache provider."                "VCPKG_BINARY_SOURCES would be accepted and ignored, and every port would be"                "rebuilt from source. See .github/actions/setup-vcpkg."
          exit 1
        fi
        echo "binary-cache provider 'files' supported; VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES"

    # RESTORE ONLY. The combined actions/cache action saves in a POST-JOB step, and
    # post-job steps do not run when a job is CANCELLED -- which is the normal exit
    # for this repo: `cancel-in-progress` killed 17 of 27 Windows PR runs and 15 of
    # 24 Sanitizer PR runs over the 36 h window measured in #1009. Every one of
    # those rebuilt ~113 of 116 ports and then banked nothing, so the next run was
    # exactly as cold. The paired save lives in the CALLER as an
    # `if: always()` step (.github/actions/save-vcpkg-cache), because `always()`
    # does fire on a cancel. asan.yml's tsan job proved the pattern before this
    # change: its restore/save sccache entry was 6 days newer than every
    # combined-action one in the same cache list.
    #
    # Key on the inputs that change the ABI of every package: the manifest, the
    # triplets and the overlay ports. run_id + run_attempt make each attempt save a
    # fresh superset (actions/cache entries are immutable), and restore-keys falls
    # back to the newest prior snapshot.
    #
    # Skipped entirely on self-hosted runners: there the cache directory is durable
    # local disk, so a restore would only overwrite the live cache with an older
    # snapshot of itself.
    - name: Restore vcpkg binary archives
      if: steps.cachecfg.outputs.persistent != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.vcpkg-binary-cache
        key: vcpkg-${{ runner.os }}-${{ inputs.triplet }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/overlay-ports/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ inputs.triplet }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'cmake/overlay-ports/**') }}-
          vcpkg-${{ runner.os }}-${{ inputs.triplet }}-

    - name: Emit toolchain args
      id: emit
      shell: bash
      run: |
        set -euo pipefail
        # Normalise BOTH paths to forward slashes before they go anywhere near a
        # command line. On Windows runners GITHUB_WORKSPACE is
        # `D:\a\OloEngineBase\OloEngineBase` and VCPKG_ROOT is `C:\vcpkg`; these
        # args are consumed unquoted by the caller's `shell: bash` step, where
        # bash eats each backslash as an escape — `\a\O\O` collapses to `aOO`,
        # the result no longer looks absolute, and it gets re-rooted against the
        # CWD. The observed failure was:
        #   Overlay path "D:\a\...\OloEngineBase\aOloEngineBaseOloEngineBase/cmake/overlay-ports"
        #     must be an existing directory.
        # Forward slashes are accepted by CMake on Windows and are not touched by
        # bash or by MSYS path conversion (which only rewrites leading-slash args).
        ws="${GITHUB_WORKSPACE//\\//}"
        vr="${VCPKG_ROOT//\\//}"
        args="-DCMAKE_TOOLCHAIN_FILE=${vr}/scripts/buildsystems/vcpkg.cmake"
        args="$args -DVCPKG_TARGET_TRIPLET=${{ inputs.triplet }}"
        args="$args -DVCPKG_OVERLAY_PORTS=${ws}/cmake/overlay-ports"
        case "${{ inputs.triplet }}" in
          x64-windows-static-md)
            args="$args -DVCPKG_OVERLAY_TRIPLETS=${ws}/cmake/triplets"
            args="$args -DVCPKG_HOST_TRIPLET=x64-windows-static-md"
            ;;
        esac
        echo "toolchain-args=$args" >> "$GITHUB_OUTPUT"
        echo "$args"
