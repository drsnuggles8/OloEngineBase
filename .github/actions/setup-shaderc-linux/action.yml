name: 'Install a pinned shaderc toolchain (Linux)'
description: >
  Build and install the shader toolchain the engine's Vulkan tier REQUIRES, on a
  GitHub-hosted Linux runner, at a prefix that carries shaderc and nothing that
  can collide with the rest of the build.

  WHY IT EXISTS (#1139). Ubuntu 24.04 ships libshaderc-dev 2023.8 and glslang-dev
  15.1.0. `GL_EXT_descriptor_heap` landed in glslang on 2026-01-22, so BOTH are
  below the floor seven production shaders declare (ADR 0011 amendments (95)/(96),
  and (97) for the floor itself). The Sanitizers nightly was red on all three
  Linux jobs for a day and a half because of it, with a diagnostic that named a
  line in an include file and read like a shader bug.

  WHY NOT JUST RUN `setup-vulkan` ON THESE JOBS. That is the trap #1009 already
  sprang, recorded at length in setup-linux-build's `vulkan-sdk` input: the LunarG
  SDK's include tree also carries `spirv_cross/`, it wins the
  <spirv_cross/spirv_cross.hpp> lookup over apt's, and the resulting header /
  library skew SEGVs under TSan inside `spirv_cross::Resource::~Resource`. This
  action cannot reproduce that, by construction rather than by care: shaderc does
  not depend on SPIRV-Cross, so no build of it can contain those headers. The
  install step ASSERTS that anyway, and so does OloEngine/CMakeLists.txt when it
  is handed the prefix.

  WHY FROM SOURCE, AND WHY THIS TAG. shaderc v2026.3's DEPS pins glslang
  168d452a4f460d24b588fed08477a81c44ee27a1 and SPIRV-Tools b707790a — and
  168d452a is glslang's own `vulkan-sdk-1.4.357.0` tag. So this build is not
  "close to" the SDK the dev box, Windows CI and the self-hosted Linux box carry:
  it is the same three revisions. A git tag also holds still in a way a
  continuous-build artifact URL does not, which is the same reason
  setup-llvm-linux takes a release tarball rather than an apt snapshot.

  THE CACHE ENTRY IS DELIBERATELY TINY. The install is pruned to
  `lib/libshaderc_shared.so*`, `bin/glslc` and the headers — under ~20 MB, against
  a repo cache store measured at 7.8 GiB of a 10 GiB cap that turns READ-ONLY when
  breached (docs/agent-rules/actions-cache-budget.md). A 291 MiB LunarG SDK entry
  for a third consumer was not affordable; this is.

  HOSTED ONLY. The self-hosted box takes its whole shader toolchain from
  $VULKAN_SDK (docs/ops/self-hosted-gpu-runner.md §1b) and is already above the
  floor; setup-linux-build's convention is that a self-hosted step VERIFIES and
  never installs.

inputs:
  version:
    description: >
      shaderc git tag to build. Moving it moves glslang and SPIRV-Tools with it,
      because DEPS pins both — that is the point. Keep it in step with
      `.github/actions/setup-vulkan`'s SDK default and with
      `ShaderToolchainFloor.h`'s kMinimumShadercTag: those three name one
      toolchain, and a bump that moves one of them splits the arms silently.
    required: false
    default: 'v2026.3'
  cache:
    description: 'Restore/save the built prefix from the Actions cache.'
    required: false
    default: 'true'

outputs:
  root:
    description: 'Prefix supplying include/shaderc and lib/libshaderc_shared.so — pass as -DOLO_SHADERC_ROOT.'
    value: ${{ steps.prefix.outputs.root }}
  glslc:
    description: 'Absolute path to the matching glslc, for shader checks that need no engine build.'
    value: ${{ steps.prefix.outputs.glslc }}

runs:
  using: 'composite'
  steps:
    # Made and handed over BEFORE the cache step, because actions/cache restores
    # as the runner user and /opt is root-owned: without this the restore fails
    # and, under `set -e` in a later step, takes the job with it.
    - name: Reserve the prefix
      id: prefix
      shell: bash
      env:
        OLO_SHADERC_TAG: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # /opt, matching setup-llvm-linux: an absolute, predictable prefix is what
        # lets a hosted/self-hosted A/B read one path in both logs.
        root="/opt/olo-shaderc-${OLO_SHADERC_TAG}"
        sudo mkdir -p "$root"
        sudo chown "$(id -u):$(id -g)" "$root"
        {
          echo "root=${root}"
          echo "glslc=${root}/bin/glslc"
        } >> "$GITHUB_OUTPUT"
        # BELT AND BRACES FOR THE LOADER. CMake links this shaderc by absolute
        # path, so it puts the directory in the build RPATH and the test binary
        # normally finds it unaided -- including on the shard runners, which
        # execute a binary another job linked. LD_LIBRARY_PATH is here so that a
        # binary CMake did NOT rpath fails at its own first shader compile
        # instead of at `error while loading shared libraries` before main().
        echo "LD_LIBRARY_PATH=${root}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

    # A STABLE, IMMUTABLE KEY — no -<run_id>-<attempt> tail. The content is fully
    # determined by the tag (DEPS pins every dependency), so one entry per tag is
    # correct and the append-only churn `save-cache-pruned` exists to clean up
    # never happens here.
    - name: Restore the pinned shaderc
      id: cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.prefix.outputs.root }}
        key: olo-shaderc-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-v1

    - name: Build and install shaderc ${{ inputs.version }}
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        OLO_SHADERC_TAG: ${{ inputs.version }}
        OLO_SHADERC_ROOT: ${{ steps.prefix.outputs.root }}
      run: |
        set -euo pipefail
        work="${RUNNER_TEMP}/olo-shaderc-src"
        rm -rf "$work"
        git clone --depth 1 --branch "${OLO_SHADERC_TAG}" https://github.com/google/shaderc.git "$work"

        # git-sync-deps reads DEPS and checks out the EXACT pinned revisions of
        # glslang, SPIRV-Tools, SPIRV-Headers and abseil. This is the step that
        # makes "shaderc v2026.3" mean one specific glslang rather than whatever
        # its branch has drifted to.
        python3 "${work}/utils/git-sync-deps"
        grep -E "glslang_revision|spirv_tools_revision" "${work}/DEPS"

        # THE IMAGE'S DEFAULT COMPILER, on purpose, and NOT the pinned clang the
        # sanitizer jobs build with. libshaderc's interface is a C API with a
        # header-only C++ wrapper over it (shaderc.hpp constructs nothing that
        # crosses the boundary), so there is no C++ ABI surface here and no
        # reason to hash a compiler into the cache key — one entry then serves
        # every Linux job. It is also NOT sanitizer-instrumented, exactly as
        # apt's libshaderc was not.
        # No -G: the image's default generator. Ninja is not guaranteed present
        # on a hosted runner and this step runs BEFORE the apt install that could
        # provide one, deliberately — it needs nothing from apt.
        cmake -S "$work" -B "${work}/build" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="${OLO_SHADERC_ROOT}" \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DSHADERC_SKIP_TESTS=ON \
          -DSHADERC_SKIP_EXAMPLES=ON \
          -DSHADERC_SKIP_COPYRIGHT_CHECK=ON \
          -DSPIRV_SKIP_TESTS=ON \
          -DENABLE_CTEST=OFF
        cmake --build "${work}/build" --target install --parallel "$(nproc)"
        rm -rf "$work"

        # Prune to what the engine and the shader checks actually use. The static
        # archives are the bulk of the tree and nothing links them: when
        # OLO_SHADERC_ROOT is set, OloEngine/CMakeLists.txt asks this prefix for
        # shaderc alone and takes SPIRV-Cross from the system.
        find "${OLO_SHADERC_ROOT}/lib" -name '*.a' -delete
        find "${OLO_SHADERC_ROOT}/bin" -type f ! -name 'glslc' -delete
        du -sh "${OLO_SHADERC_ROOT}"

    # VERIFY, always — cache hit or fresh build. A restored entry from a moved tag
    # or a half-written save would otherwise be indistinguishable from a good one
    # until 4,000 tests later, which is the failure mode #1139 IS.
    - name: Prove the prefix meets the floor
      shell: bash
      env:
        OLO_SHADERC_ROOT: ${{ steps.prefix.outputs.root }}
      run: |
        set -euo pipefail
        test -e "${OLO_SHADERC_ROOT}/include/shaderc/shaderc.hpp" \
          || { echo "::error::no shaderc headers under ${OLO_SHADERC_ROOT}"; exit 1; }
        lib=$(find "${OLO_SHADERC_ROOT}/lib" -name 'libshaderc_shared.so*' -print -quit)
        [ -n "$lib" ] || { echo "::error::no libshaderc_shared.so under ${OLO_SHADERC_ROOT}"; exit 1; }
        # The structural half of the #1009 guarantee, asserted where the tree is
        # made rather than only where it is consumed.
        if [ -e "${OLO_SHADERC_ROOT}/include/spirv_cross" ]; then
          echo "::error::${OLO_SHADERC_ROOT} carries spirv_cross headers — see issue #1009"
          exit 1
        fi
        "${OLO_SHADERC_ROOT}/bin/glslc" --version
        # The behavioural check, not a version string: the same qualifiers
        # DescriptorHeapTextures.glsl declares.
        cat > "${RUNNER_TEMP}/olo-floor-probe.frag" <<'GLSL'
        #version 460 core
        #extension GL_EXT_descriptor_heap : require
        #extension GL_EXT_nonuniform_qualifier : require
        layout(descriptor_heap, descriptor_stride = 1) uniform texture2D g_T[];
        layout(descriptor_heap, descriptor_stride = 1) uniform sampler g_S[];
        layout(location = 0) out vec4 o_Color;
        void main()
        {
            o_Color = textureLod(sampler2D(g_T[nonuniformEXT(0)], g_S[nonuniformEXT(0)]), vec2(0.0), 0.0);
        }
        GLSL
        "${OLO_SHADERC_ROOT}/bin/glslc" --target-env=vulkan1.4 --target-spv=spv1.6 \
          -fshader-stage=fragment "${RUNNER_TEMP}/olo-floor-probe.frag" -o /dev/null
        echo "shaderc prefix meets the floor: ${OLO_SHADERC_ROOT}"
