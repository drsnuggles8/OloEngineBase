name: Restore versioned LFS assets
description: Materialize the full model and groom assets, reusing their content-addressed objects across CI runs.
# LFS BANDWIDTH IS A MONTHLY BUDGET, AND THIS ACTION IS WHAT SPENDS IT (#1682).
#
# The account's free Git LFS bandwidth is 10 GiB a month. The current object set is
# 12 objects, ~1.0 GB on the wire (589 MiB as a compressed cache entry), so ONE cold
# `git lfs pull` costs a tenth of the month. On 2026-11-02/03 eight hosted jobs each
# pulled the full set in parallel (two bursts of four) after GitHub evicted the
# master `olo-lfs-v1-*` entry, and the month's quota was gone by 11-12.
#
# So the rules this action enforces:
#   * a hosted job restores the objects from the master cache entry, or from an
#     artifact another job of THIS run already fetched (`restore-artifact`), and
#     fetches from LFS only what neither had;
#   * a workflow with several builds runs ONE job that fetches and publishes, and
#     the builds take its artifact (asan.yml's `lfs-objects`), so a miss costs one
#     pull per run, not one per build;
#   * every job reports the bytes it fetched, and a non-zero fetch is a ::warning::
#     naming the job, so a cold pull can never burn the quota silently again.
# Rules and the eviction story: docs/agent-rules/ci-lfs-bandwidth.md.
inputs:
  artifact-name:
    description: >
      Optional workflow-local object bundle. Without restore-artifact, this job
      publishes the current object set under this name (not on `push`) for the jobs
      that need it later in the run.
    default: ''
  restore-artifact:
    description: Download artifact-name from this workflow instead of the cache (hosted runners only).
    default: 'false'
runs:
  using: composite
  steps:
    - name: Locate this checkout's LFS objects
      id: objects
      shell: bash
      env:
        RUNNER_KIND: ${{ runner.environment }}
      run: |
        set -euo pipefail
        if ! git lfs version; then
          echo "::error::Git LFS is required for the versioned model and fur assets. Provision it on this runner before retrying (Rocky: sudo dnf install git-lfs; Windows: install Git for Windows with Git LFS)."
          exit 1
        fi
        git lfs install --local
        if [ "$RUNNER_KIND" = self-hosted ]; then
          # Persistent disk, shared by this runner account's checkout slots.
          git config --local lfs.storage "$HOME/.cache/oloengine-lfs"
          object_path="$HOME/.cache/oloengine-lfs/objects"
        else
          object_path=$(git rev-parse --git-path lfs/objects)
        fi
        mkdir -p "$object_path"
        echo "path=$object_path" >> "$GITHUB_OUTPUT"
        digest=$(git lfs ls-files --long | awk '{print $1}' | sort | sha256sum | awk '{print $1}')
        echo "key=olo-lfs-v1-$digest" >> "$GITHUB_OUTPUT"
        echo "restore-prefix=olo-lfs-v1-" >> "$GITHUB_OUTPUT"

    - name: Restore cached LFS objects
      id: cache
      if: runner.environment == 'github-hosted' && inputs.restore-artifact != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.objects.outputs.path }}
        key: ${{ steps.objects.outputs.key }}
        restore-keys: ${{ steps.objects.outputs.restore-prefix }}
        enableCrossOsArchive: true

    - name: Restore this workflow's LFS objects
      if: inputs.restore-artifact == 'true' && runner.environment == 'github-hosted'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.objects.outputs.path }}

    # The byte count is the object store's size before and after the pull, not
    # `git lfs pull`'s progress output, which it prints only to a terminal. On a
    # self-hosted runner the store is shared by the account's checkout slots, so a
    # concurrent job's pull can land in this job's window; the count is then an upper
    # bound, and the runner name in the annotation says which box paid.
    - name: Fetch and verify full asset contents
      shell: bash
      env:
        OBJECT_PATH: ${{ steps.objects.outputs.path }}
        CACHE_MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
        RUNNER_KIND: ${{ runner.environment }}
        FROM_ARTIFACT: ${{ inputs.restore-artifact }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        JOB_LABEL: ${{ github.workflow }} / ${{ github.job }}
      run: |
        set -euo pipefail
        # Name where the objects came from, so a non-zero fetch points at the right
        # cause: a missing master entry, an incomplete artifact, or a cold box.
        if [ "$RUNNER_KIND" = self-hosted ]; then
          source="persistent store"
        elif [ "$FROM_ARTIFACT" = true ]; then
          source="artifact ${ARTIFACT_NAME}"
        else
          source="cache match ${CACHE_MATCHED:-none}"
        fi
        store_bytes() { find "$OBJECT_PATH" -type f -printf '%s\n' | awk '{ s += $1 } END { printf "%d", s }'; }
        store_count() { find "$OBJECT_PATH" -type f | wc -l | tr -d ' '; }
        before_bytes=$(store_bytes)
        before_count=$(store_count)
        # A pull that downloads half the set and then fails has still spent the
        # bandwidth, so the failure is held until the bytes are reported.
        status=0
        failed=""
        git lfs pull || { status=$?; failed="git lfs pull"; }
        if [ "$status" -eq 0 ]; then
          git lfs fsck || { status=$?; failed="git lfs fsck"; }
        fi
        fetched_bytes=$(( $(store_bytes) - before_bytes ))
        fetched_count=$(( $(store_count) - before_count ))
        fetched_mib=$(awk -v b="$fetched_bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
        outcome=""
        if [ -n "$failed" ]; then
          outcome=" (${failed} then failed with status ${status})"
        fi
        echo "LFS fetched: ${fetched_count} object(s), ${fetched_bytes} bytes (${fetched_mib} MiB) on ${RUNNER_NAME}; objects from: ${source}${outcome}"
        echo "LFS fetched by \`${JOB_LABEL}\`: ${fetched_count} object(s), ${fetched_mib} MiB (objects from: ${source})${outcome}" >> "$GITHUB_STEP_SUMMARY"
        if [ "$fetched_bytes" -gt 0 ]; then
          echo "::warning title=Git LFS download (${fetched_mib} MiB)::${JOB_LABEL} fetched ${fetched_count} object(s), ${fetched_bytes} bytes, from GitHub LFS on ${RUNNER_NAME} (objects from: ${source})${outcome}. The free LFS bandwidth is 10 GiB/month and a full set is ~1 GB; see docs/agent-rules/ci-lfs-bandwidth.md."
        fi
        exit "$status"

    # No PR-scoped large caches. One job publishes one short-lived artifact for the
    # rest of the run, which would otherwise each charge another full LFS download
    # whenever the master entry is missing.
    - name: Select the current LFS objects for later jobs
      id: bundle
      if: github.event_name != 'push' && inputs.artifact-name != '' && inputs.restore-artifact != 'true'
      shell: bash
      env:
        OBJECT_PATH: ${{ steps.objects.outputs.path }}
      run: |
        set -euo pipefail
        bundle=$(mktemp -d "$RUNNER_TEMP/olo-lfs.XXXXXX")
        while read -r oid; do
          relative="${oid:0:2}/${oid:2:2}/$oid"
          mkdir -p "$bundle/$(dirname "$relative")"
          cp "$OBJECT_PATH/$relative" "$bundle/$relative"
        done < <(git lfs ls-files --long | awk '{print $1}' | sort -u)
        echo "path=$bundle" >> "$GITHUB_OUTPUT"

    - name: Publish LFS objects for this workflow's later jobs
      if: github.event_name != 'push' && inputs.artifact-name != '' && inputs.restore-artifact != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.bundle.outputs.path }}
        # Three days, not one: in asan.yml the builds take this artifact too, and
        # "Re-run failed jobs" does not re-run the job that published it.
        retention-days: 3
        compression-level: 0
        if-no-files-found: error

    # THE MASTER ENTRY HOLDS THE CURRENT SET AND NOTHING ELSE. A save after a
    # restore-keys match used to bank the old entry's objects plus the new ones, so
    # the entry grew with every LFS change on master: the one GitHub evicted on
    # 2026-11-02 was 1402 MiB, and its replacement, saved from a cold pull, is
    # 589 MiB. Nothing reads the old objects: PR runs check out the merge ref, whose
    # LFS set is master's plus the PR's own changes. A hosted object store is
    # ephemeral, so deleting from it here costs nothing.
    - name: Drop objects the current tree does not reference
      if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/master' && inputs.restore-artifact != 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        OBJECT_PATH: ${{ steps.objects.outputs.path }}
      run: |
        set -euo pipefail
        current=$(mktemp)
        git lfs ls-files --long | awk '{print $1}' | sort -u > "$current"
        dropped=0
        while read -r file; do
          if ! grep -qxF "$(basename "$file")" "$current"; then
            rm -f -- "$file"
            dropped=$((dropped + 1))
          fi
        done < <(find "$OBJECT_PATH" -type f)
        echo "dropped ${dropped} object(s) the current tree does not reference; saving $(wc -l < "$current" | tr -d ' ')"

    - name: Save the shared default-branch LFS snapshot
      if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/master' && inputs.restore-artifact != 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.objects.outputs.path }}
        key: ${{ steps.objects.outputs.key }}
        enableCrossOsArchive: true
