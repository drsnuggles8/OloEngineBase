name: 'Setup Linux build environment'
description: >
  Bring a Linux runner -- GitHub-hosted or the self-hosted Rocky box -- to the
  point where the engine can be configured, and report back which compiler,
  Python and extra CMake arguments this particular runner needs.

  It exists because #1009 routed the Linux jobs onto a self-hosted runner, and the
  two runner kinds differ in almost every preparatory step: one has passwordless
  sudo and apt, the other has neither; one gets its shader toolchain from apt
  packages, the other from the LunarG SDK at $VULKAN_SDK; one starts empty every
  run, the other keeps its caches. Rather than fork five jobs into ten, each job
  calls this once and splices the outputs into its configure line.

  THE CONVENTION THIS FOLLOWS: on a self-hosted runner a workflow step VERIFIES,
  it never installs. Self-hosted runners are provisioned system-wide, ahead of
  time (docs/ops/self-hosted-gpu-runner.md); an unconditional `sudo apt-get` once
  killed the nightly for days because the Rocky box has neither apt-get nor
  passwordless sudo. The gate is `runner.environment`, not "does apt exist" --
  that proxy is wrong for a self-hosted Debian host with passwordless sudo, which
  would silently take the install path and mutate a machine nobody meant to touch.

inputs:
  free-disk:
    description: >
      Reclaim ~20 GB of preinstalled toolchains on a GitHub-hosted runner. The
      image ships ~14 GB free, which asan.yml records as enough to hit "No space
      left on device" during the OloEngine-Tests link. Ignored on self-hosted --
      that box has its own disk and none of these paths.
    required: false
    default: 'true'
  vulkan-sdk:
    description: >
      Provision the LunarG Vulkan SDK on a GITHUB-HOSTED runner. Pass 'false' for a
      job that takes its shader toolchain from apt instead.

      This input exists because unifying the five jobs' setup silently changed what
      three of them LINK AGAINST. The sanitizer jobs never ran setup-vulkan: they
      apt-install libspirv-cross-c-shared-dev and find_package picks that up. Adding
      the SDK put $VULKAN_SDK in the environment, CMake preferred it, and the three
      Linux sanitizer jobs started linking the SDK's prebuilt spirv-cross instead --
      which is not sanitizer-instrumented and SEGVs under TSan while destroying its
      own containers:

        ThreadSanitizer: SEGV on unknown address
          #5 spirv_cross::Resource::~Resource()
             …/VULKAN_SDK/include/spirv_cross/spirv_cross.hpp:36
          #10 ShaderReflectionBinding_AllProductionShaderBindingsMatchCppLayout_Test

      Four shader-reflection tests, on a job that had passed on master eleven hours
      earlier. The lesson is narrow and worth keeping: a shared setup action makes
      every job's TOOLCHAIN a shared decision, and "install one more thing" is not a
      no-op when a build prefers what it finds.

      Ignored on self-hosted, where the SDK is the only source of shaderc / glslang /
      SPIRV-Cross -- Rocky packages none of them (docs/ops/self-hosted-gpu-runner.md
      §1b). That is SAFE rather than merely unavoidable, and it was measured rather
      than hoped: a standalone 20-line probe on the box -- reflect a compute shader
      with CompilerGLSL, destroy ShaderResources, built `clang++ -fsanitize=thread`
      against the SDK's libspirv-cross -- prints "destroyed cleanly" and exits 0. So
      the fault is the HOSTED SDK build (1.4.321.0 + clang-19), not the SDK path.
      Worth knowing before anyone "fixes" the self-hosted arm by copying this
      opt-out: the two arms are different for a measured reason.
    required: false
    default: 'true'
  cache-name:
    description: >
      Names this job in the self-hosted compiler-cache log line. Purely diagnostic:
      all self-hosted jobs share one ccache directory, which is correct -- ccache
      hashes the full compile command line, so `-fsanitize=address` and
      `-fsanitize=thread` objects cannot collide, and one shared LRU is strictly
      better than several fixed-size ones.
    required: true

outputs:
  cc:
    description: 'C compiler to pass as -DCMAKE_C_COMPILER.'
    value: ${{ steps.toolchain.outputs.cc }}
  cxx:
    description: 'C++ compiler to pass as -DCMAKE_CXX_COMPILER.'
    value: ${{ steps.toolchain.outputs.cxx }}
  python-exe:
    description: 'Interpreter to pass as -DPython_EXECUTABLE.'
    value: ${{ steps.toolchain.outputs.python-exe }}
  extra-cmake-args:
    description: >
      Runner-specific CMake arguments to splice into the configure line -- on
      self-hosted, the CMAKE_PREFIX_PATH and Vulkan_LIBRARY that point at the
      LunarG SDK. Empty on GitHub-hosted.
    value: ${{ steps.toolchain.outputs.extra-cmake-args }}

runs:
  using: 'composite'
  steps:
    # ---------------------------------------------------------------- hosted
    - name: Free disk space (hosted)
      if: runner.environment == 'github-hosted' && inputs.free-disk == 'true'
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
        sudo docker image prune --all --force 2>/dev/null || true
        df -h /

    - name: Install Python 3.10 (hosted)
      id: py
      if: runner.environment == 'github-hosted'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Python deps (hosted)
      if: runner.environment == 'github-hosted'
      shell: bash
      # jinja2 pinned for githubactions:S8544 (lock resolved versions); bump deliberately.
      # It is used only by the glad2 GL-loader generator.
      run: python3 -m pip install jinja2==3.1.6

    - name: Setup Vulkan SDK (hosted)
      if: runner.environment == 'github-hosted' && inputs.vulkan-sdk == 'true'
      uses: ./.github/actions/setup-vulkan

    - name: Add LLVM apt repository (hosted)
      if: runner.environment == 'github-hosted'
      uses: ./.github/actions/setup-llvm-apt

    - name: Install Linux deps (hosted)
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        # The ubuntu runner image ships Microsoft apt repos (azure-cli, prod) that
        # periodically return 403 Forbidden; we never use them (Clang comes from
        # apt.llvm.org), and `apt-get update` fails hard on any single repo error.
        # Drop any Microsoft source so a Microsoft-side outage cannot break our update.
        sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f || true
        sudo apt-get update
        # One superset list for every Linux job. The jobs' old lists differed only
        # by libvulkan-dev/vulkan-validationlayers, which cost seconds; a single
        # list is worth far more than those seconds, because a per-job list is how
        # one job quietly acquires a dependency the others do not have.
        sudo apt-get install -y \
          clang-23 lld-23 \
          libvulkan-dev vulkan-validationlayers \
          libgl-dev libglu1-mesa-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
          libwayland-dev wayland-protocols libxkbcommon-dev \
          glslang-dev libshaderc-dev libspirv-cross-c-shared-dev spirv-tools

    # ----------------------------------------------------------- self-hosted
    #
    # VERIFY, never install. Everything below either passes or prints a message
    # naming the provisioning step that fixes it -- scripts/setup-olo-ci-runners.sh
    # and docs/ops/self-hosted-gpu-runner.md.
    - name: Preflight — toolchain (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        set -euo pipefail
        missing=0
        for tool in cmake ninja ccache clang clang++ lld python3 nasm; do
          if command -v "$tool" >/dev/null 2>&1; then
            printf '  %-9s %s\n' "$tool" "$(command -v "$tool")"
          else
            echo "::error::$tool not found on the runner's PATH"
            missing=1
          fi
        done
        # Python MODULES count as toolchain too, and checking only binaries is how
        # this was missed once already: all preflights passed and the build died
        # four minutes in on ModuleNotFoundError. glad2's generator imports jinja2.
        if python3 -c 'import jinja2' 2>/dev/null; then
          printf '  %-9s %s\n' jinja2 "$(python3 -c 'import jinja2,os;print(os.path.dirname(jinja2.__file__))')"
        else
          echo "::error::python module 'jinja2' is not importable by $(id -un)"
          missing=1
        fi
        if [ "$missing" -ne 0 ]; then
          echo "::error::Provision the runner: sudo bash scripts/setup-olo-ci-runners.sh"
          echo "::error::Everything must be system-wide — not under a 0700 home, and not a"
          echo "::error::'pip install --user' in someone else's account. See"
          echo "::error::docs/ops/self-hosted-gpu-runner.md (Host provisioning)."
          exit 1
        fi
        echo "clang: $(clang --version | head -1)"

    - name: Preflight — Vulkan SDK (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        set -euo pipefail
        # Rocky packages the loader but none of shaderc / glslang / SPIRV-Tools /
        # SPIRV-Cross, and OloEngine/CMakeLists.txt raises FATAL_ERROR on the first
        # one missing. The LunarG SDK supplies all four under one prefix.
        : "${VULKAN_SDK:?VULKAN_SDK is not set — see docs/ops/self-hosted-gpu-runner.md §1b}"
        test -d "$VULKAN_SDK/include/vulkan"       || { echo "::error::no headers under $VULKAN_SDK"; exit 1; }
        test -e "$VULKAN_SDK/lib/libshaderc_shared.so" || { echo "::error::no shaderc under $VULKAN_SDK"; exit 1; }

        # The SDK does NOT put the loader in lib/ -- it nests it under
        # lib/VulkanLoader/lib/. CMAKE_PREFIX_PATH therefore resolves the headers
        # and the version but not Vulkan_LIBRARY, and configure dies with
        # "Could NOT find Vulkan (missing: Vulkan_LIBRARY) (found version 1.4.350)"
        # -- found-but-not-found, which reads like a version problem and is not one.
        loader=$(find "$VULKAN_SDK" -name 'libvulkan.so' -print -quit 2>/dev/null || true)
        [ -n "$loader" ] || { echo "::error::no libvulkan.so anywhere under $VULKAN_SDK"; exit 1; }
        echo "OLO_VULKAN_LIBRARY=$loader" >> "$GITHUB_ENV"
        echo "Vulkan SDK: $VULKAN_SDK"
        echo "  loader:   $loader"

    - name: Point the compiler cache at persistent disk (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: bash
      env:
        OLO_CACHE_NAME: ${{ inputs.cache-name }}
      run: |
        set -euo pipefail
        # CCACHE HERE, sccache on the hosted runners, and the difference is not a
        # preference -- it is the one that works when two jobs share a machine.
        #
        # sccache is a per-USER DAEMON. The first client to start it fixes the
        # server's environment, and every later client on that account is served by
        # it regardless of what SCCACHE_DIR that client set. Two runner instances
        # here share one Unix account (olo-ci-1 and olo-ci-2 both run as
        # gh-runner-olo), so the second job's cache configuration would be silently
        # ignored -- and "silently ignored cache configuration" is the entire genre
        # of bug #1009 exists to remove.
        #
        # ccache has no daemon. It is a process per compiler invocation that reads
        # CCACHE_DIR itself, and its on-disk format is designed for concurrent
        # writers. One shared directory across all self-hosted jobs is right:
        # ccache hashes the full command line, so -fsanitize=address and
        # -fsanitize=thread objects cannot collide, and a single large LRU beats
        # several fixed-size ones. The GPU nightly already uses ccache on this box
        # for the same reason.
        #
        # SCCACHE_DIR is also unset here: it is defined at workflow level to a
        # WORKSPACE path that actions/checkout wipes every run, and leaving it set
        # would only invite a stray sccache invocation to write somewhere useless.
        ccache_bin="$(command -v ccache)"
        dir="$HOME/.cache/olo/ccache"
        mkdir -p "$dir"
        {
          echo "CCACHE_DIR=$dir"
          # PCH-using compiles are uncacheable without this (ccache manual,
          # "Precompiled headers"); every engine target uses one. See
          # docs/agent-rules/compiler-cache-uncacheable-compiles.md.
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
          echo "OLO_COMPILER_CACHE_TOOL=$ccache_bin"
          echo "CPM_SOURCE_CACHE=$HOME/.cache/olo/cpm"
          # NOT setting CCACHE_NOHASHDIR, deliberately. The compile CWD is part
          # of ccache's hash by default (hash_dir) for a `-g` build, and it
          # differs between the two runner slots' _work trees, so olo-ci-1
          # never reuses olo-ci-2's objects and the cache is colder than it
          # looks. Turning hash_dir off would share them -- and would serve an
          # object whose DWARF still names the OTHER slot's directory, which is
          # exactly the debug info a sanitizer report symbolises. These jobs
          # exist to produce readable ASan/UBSan/TSan stacks, so a warmer cache
          # is not worth a stack that points at a path this job never used.
          # The way to have both is `-ffile-prefix-map` on every compile so the
          # recorded path is slot-independent; do that first, then this is safe.
        } >> "$GITHUB_ENV"
        echo "persistent ccache for '${OLO_CACHE_NAME}': $dir ($ccache_bin)"
        CCACHE_DIR="$dir" ccache --max-size=30G >/dev/null
        CCACHE_DIR="$dir" ccache --show-stats | head -20

    # ------------------------------------------------------------- both ways
    - name: Resolve toolchain for this runner
      id: toolchain
      shell: bash
      env:
        OLO_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        OLO_HOSTED_PYTHON: ${{ steps.py.outputs.python-path }}
      run: |
        set -euo pipefail
        if [ "$OLO_RUNNER_ENVIRONMENT" = "github-hosted" ]; then
          # clang-23 from apt.llvm.org. The engine needs a C++23 STANDARD LIBRARY,
          # not merely a C++23 compiler: Core/Reflection uses std::forward_like,
          # which ubuntu-24.04's default libstdc++ does not provide.
          cc=clang-23; cxx=clang++-23
          python_exe="$OLO_HOSTED_PYTHON"
          extra=""
        else
          # A PINNED clang-23 AT AN ABSOLUTE PATH, with the system clang as a
          # warn-and-carry-on fallback. Both halves are load-bearing.
          #
          # THE PIN (#1036). The hosted arm builds with clang-23 from
          # apt.llvm.org. The box now has the same major, from the official LLVM
          # release tarball unpacked at /opt/llvm-23.1.0 by
          # scripts/setup-olo-ci-host.sh. Rocky 10 packages no clang above 21
          # (EPEL tops out at clang20), so a PACKAGE pin is impossible -- the
          # earlier note here said that made the skew permanent, and it does not:
          # LLVM also publishes prebuilt tarballs. The prefix is versioned and
          # deliberately NOT on the system PATH, so everything else on this host
          # -- including another repository's runners, which share it -- keeps
          # Rocky's clang 21 as its default.
          #
          # Why it is worth a 12 GB install: asan.yml routes every same-repo PR's
          # sanitizer jobs here and the hosted arm is the tiebreaker when one goes
          # red and the other does not. While the two ran different compilers,
          # "or it's the compiler" was a standing explanation for any
          # self-hosted-only failure that nobody could cheaply rule out. This
          # removes that confound. It does NOT fix a known bug: #1010's 215
          # failures were never the compiler's fault, and the evidence for that
          # is kept in docs/ops/self-hosted-linux-toolchain.md.
          #
          # THE FALLBACK. A pin naming a path nothing provisioned is exactly how
          # the previous clang-19 pin failed: /usr/lib64/llvm19 never existed on
          # the box, so every self-hosted sanitizer run silently took the fallback
          # for as long as the pin stood. So this pin is ASSERTED rather than
          # assumed -- present, executable, and reporting the major it claims --
          # and each way of missing prints a ::warning naming the script that
          # fixes it. It must never FAIL: every same-repo PR's sanitizer jobs land
          # here, and a hard failure would block all of them on one maintainer
          # running one script.
          llvm_prefix=/opt/llvm-23.1.0
          llvm_major=23
          cc=clang; cxx=clang++
          if [ ! -x "$llvm_prefix/bin/clang++" ]; then
            echo "::warning title=clang-${llvm_major} pin not provisioned::No executable at ${llvm_prefix}/bin/clang++. Falling back to $(command -v clang++) ($(clang++ --version | head -1)), which is a DIFFERENT major from the hosted arm — a red job here is then not comparable with its hosted twin. Provision with: sudo bash scripts/setup-olo-ci-host.sh — see docs/ops/self-hosted-linux-toolchain.md"
          else
            pinned_version=$("$llvm_prefix/bin/clang++" -dumpversion 2>/dev/null || true)
            case "$pinned_version" in
              "$llvm_major".*)
                # The LINKER beside it has to run too, and asserting the compiler
                # alone would miss the one way this prefix is known to be
                # half-working: the tarball ships an ld.lld that needs ICU 70, so
                # a prefix unpacked without the swap below CONFIGURES fine and
                # then hard-fails every -fuse-ld=lld link on "unable to execute
                # command". That is precisely the outcome this ladder exists to
                # turn into a warning, so check it here rather than discover it
                # forty minutes into the build.
                if "$llvm_prefix/bin/ld.lld" --version >/dev/null 2>&1; then
                  cc="$llvm_prefix/bin/clang"
                  cxx="$llvm_prefix/bin/clang++"
                else
                  echo "::warning title=clang-${llvm_major} pin has an unusable ld.lld::${llvm_prefix}/bin/ld.lld does not run, so every -fuse-ld=lld link through this prefix would fail. The bundled one needs ICU 70 and this box has ICU 74; setup-olo-ci-host.sh points that name at the system /usr/bin/ld.lld. Falling back to $(command -v clang++). Re-provision with: sudo bash scripts/setup-olo-ci-host.sh"
                fi
                ;;
              *)
                echo "::warning title=clang-${llvm_major} pin reports the wrong version::${llvm_prefix}/bin/clang++ reports '${pinned_version:-<none>}', not ${llvm_major}.x. Falling back to $(command -v clang++). Re-provision with: sudo bash scripts/setup-olo-ci-host.sh"
                ;;
            esac
          fi

          # THE LINKER IS PART OF THE PIN, and getting it there took a detour
          # worth knowing about. Every Linux configure line here passes
          # -fuse-ld=lld, and clang resolves ld.lld from its OWN bin directory
          # before PATH -- but the tarball's lld does not start on Rocky 10:
          #     ld.lld: error while loading shared libraries: libicui18n.so.70
          # surfacing as `clang++: error: unable to execute command` at the first
          # LINK, not at configure. libxml2 is static inside lld for lld-link's
          # Windows manifests and drags ICU in; the release is built on an Ubuntu
          # with ICU 70 and this box has ICU 74, whose symbols are suffixed per
          # major, so no soname bridge exists.
          #
          # Pointing ld.lld at the system LLD 21 fixed ELF links and quietly cost
          # LTO -- LLD 21 rejects clang 23 bitcode ("Invalid summary version 14"),
          # so check_ipo_supported() flipped to NO on the box and every configure
          # warned. Nothing in a Debug sanitizer job notices that, which is what
          # made it worth removing rather than documenting. setup-olo-ci-host.sh
          # now builds ICU 70 from source into $prefix/lib, where the tarball's
          # own RUNPATH ('$ORIGIN/../lib') finds it, and ld.lld is the tarball's
          # own again. Nothing system-wide changes; Rocky's ICU 74 is untouched.
          #
          # It still DEGRADES rather than fails: a prefix whose lld will not start
          # keeps the system LLD 21, which links everything except LTO. Hence the
          # ld.lld check in the ladder above -- a pinned clang beside a linker
          # that cannot run is a hard failure at link time, and this action's
          # whole job is to turn that into a warning.

          # VERIFY, never install (the convention at the top of this file). What
          # is checked is the SANITIZER RUNTIMES of whichever compiler the ladder
          # above chose, not its version: a clang without compiler-rt configures
          # fine and fails every sanitizer LINK on "cannot find
          # libclang_rt.asan.a". The runtime dir is asked of the compiler itself,
          # so the check follows the tarball's layout and the distro's alike.
          olo_runtimes_complete() {
            local rt
            rt=$("$1" -print-runtime-dir 2>/dev/null || true)
            [ -n "$rt" ] || return 1
            ls "$rt"/libclang_rt.asan*.a  >/dev/null 2>&1 || return 1
            ls "$rt"/libclang_rt.tsan*.a  >/dev/null 2>&1 || return 1
            ls "$rt"/libclang_rt.ubsan*.a >/dev/null 2>&1 || return 1
          }
          if ! olo_runtimes_complete "$cxx"; then
            # THE PIN IS WORTH NOTHING IF EVERY SANITIZER LINK FAILS, so an
            # incomplete compiler-rt drops one more rung down the same ladder --
            # but only onto a compiler that actually has the runtimes, since
            # falling back to a second broken one would trade version parity for
            # nothing. Version parity is the thing this job is FOR; a build that
            # links is the thing it needs first.
            if [ "$cxx" != "clang++" ] && olo_runtimes_complete clang++; then
              echo "::warning title=pinned clang has no complete compiler-rt::$cxx has no complete asan/tsan/ubsan runtime set at '$("$cxx" -print-runtime-dir 2>/dev/null || echo '<unknown>')', so every sanitizer link through it would fail. Falling back to $(command -v clang++) ($(clang++ --version | head -1)), which does have them -- a DIFFERENT major from the hosted arm. Re-provision with: sudo bash scripts/setup-olo-ci-host.sh -- see docs/ops/self-hosted-linux-toolchain.md"
              cc=clang
              cxx=clang++
            else
              # Nothing left to fall back to. Warn and carry on rather than fail,
              # for the same reason the pin does: asan.yml routes every same-repo
              # PR's sanitizer jobs here, and the linker's own error names the
              # missing archive a few minutes later.
              echo "::warning title=sanitizer runtimes missing::$cxx ($("$cxx" --version | head -1)) has no complete compiler-rt at '$("$cxx" -print-runtime-dir 2>/dev/null || echo '<unknown>')'. Every sanitizer link will fail. Fix with: sudo bash scripts/setup-olo-ci-host.sh (it installs compiler-rt + lld for the system clang and re-checks the pinned one) -- see docs/ops/self-hosted-linux-toolchain.md"
            fi
          fi
          python_exe="$(command -v python3)"
          # OLO_ENABLE_COMPILER_CACHE is added HERE rather than at each call site
          # because it is only correct here: cmake/CompilerCache.cmake reads
          # OLO_COMPILER_CACHE_TOOL from the environment, which the step above set,
          # and no hosted job would find ccache. It is a no-op for the sanitizer
          # jobs, which already pass it -- a repeated -D with the same value is
          # harmless -- and a real win for vulkan-off and steam-stub, which had no
          # compiler cache at all and paid a cold full build every run.
          extra="-DCMAKE_PREFIX_PATH=${VULKAN_SDK} -DVulkan_LIBRARY=${OLO_VULKAN_LIBRARY} -DOLO_ENABLE_COMPILER_CACHE=ON"
        fi
        {
          echo "cc=$cc"
          echo "cxx=$cxx"
          echo "python-exe=$python_exe"
          echo "extra-cmake-args=$extra"
        } >> "$GITHUB_OUTPUT"
        # The one line a same-commit hosted/self-hosted comparison reads first.
        echo "toolchain: $cxx ($("$cxx" --version | head -1)) / $python_exe ${extra:+(+ $extra)}"
