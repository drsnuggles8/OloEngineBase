name: Windows
on:
  # NO `push: [master]` -- deliberately, and replaced by the nightly cron below
  # (#1009 item E). Two things are going on and the second is the easy one to miss.
  #
  # 1. It was mostly a second opinion on identical code. GitHub's `pull_request`
  #    event builds `refs/pull/N/merge` -- the PR merged into master -- so by the
  #    time a merge lands, CI has already tested that exact tree. Re-running the
  #    whole workflow on the push cost ~1,400 runner-min/day across the Windows
  #    and Sanitizers workflows together, for a result we already had.
  #
  #    What it DID still catch is the case where master moved between the PR's
  #    last run and the merge, so the tested merge commit was stale -- a semantic
  #    conflict between two PRs neither one's CI could see. The nightly closes
  #    that within a day instead of at merge time. That is a real, if modest,
  #    reduction in safety and it is the deliberate half of this trade.
  #
  # 2. THE MASTER RUN IS ALSO THE CACHE WARMER, which is why this is a cron and
  #    not simply a deletion. actions/cache entries created on a PR branch are
  #    scoped to that PR's ref and are invisible to every other branch; only
  #    entries created on the DEFAULT branch are readable fleet-wide. All 15
  #    active cache entries on this repo were `ref=refs/heads/master`. Delete the
  #    master trigger outright and no PR could ever restore a warm cache again --
  #    a change that reads as a pure saving and is in fact the opposite.
  #
  # The cron therefore has to run to COMPLETION, which is what the
  # `cancel-in-progress` expression below guarantees by excluding non-PR events.
  #
  # 3. And it was the per-merge producer of the `ShaderPack` artifact (#908). The
  #    newest DEFAULT-BRANCH pack is now up to 24 h old rather than minutes. The
  #    pack is content-hash invalidated, so a stale one is a slow start and never a
  #    wrong one, and each PR run still uploads a pack for its own commit -- which
  #    is the one a packager actually wants. Recorded in
  #    docs/agent-rules/shader-pack-bake.md so it is not rediscovered as a bug.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      # Agent tooling and lint/VCS config — none of it is compiled or analysed, so a
      # change here cannot alter the build or the scan. Without these, a docs-only PR
      # that also touches a slash command or a lint config pays the full ~137 min
      # Windows build / ~201 min SonarCloud scan for nothing (PR #788 did exactly that).
      - '.claude/**'
      - '.markdownlint-cli2.jsonc'
      - '.gitignore'

  schedule:
    - cron: '53 1 * * *' # nightly 01:53 UTC — off the on-the-hour surge, and clear
                         # of the Sanitizers nightly (01:23) and cross-vendor (03:47).

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PULL REQUESTS ONLY. A cancelled run banks no cache -- `actions/cache/save` runs
  # `if: always()`, which survives a cancel, but the run still stops mid-build, so
  # what it banks is a partial snapshot at best. The nightly is this workflow's only
  # default-branch cache producer (see the trigger note above), so it must never be
  # cancellable. Under the old expression a `push` run was cancellable too, which is
  # how the master sccache snapshot came to be six days stale while every PR run
  # restored it and reported a 0% hit rate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release
  # sccache uses a LOCAL-DISK cache (SCCACHE_DIR), persisted across runs as a
  # SINGLE actions/cache entry (see the "Restore/Save sccache storage" steps below).
  # We deliberately do NOT use sccache's GitHub Actions cache backend
  # (SCCACHE_GHA_ENABLED): it stores one cache entry PER OBJECT FILE, which
  # flooded the repo's 10 GB Actions-cache cap with 20k+ tiny entries and made
  # EVERY write fail (observed 0% hit rate, write-errors == misses on every
  # job). One bounded local-disk dir wrapped in actions/cache stays under the
  # cap and actually warms between runs.
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  # Bound the on-disk cache so the saved actions/cache entry stays small — every
  # cache (this, Vulkan, FFmpeg, the sanitizer jobs' sccache dirs) shares the
  # repo's single 10 GB Actions-cache cap.
  #
  # That cap is a HARD WALL, not an eviction threshold (#1073). Past it GitHub does
  # not make room by dropping the oldest entry; it turns the entire store read-only
  # ("Cache reservation failed: You have reached your configured budget, your cache
  # is now read only") and refuses every save in the repository until something is
  # deleted. This job's snapshot is the single largest entry in the store, so it is
  # the first casualty and the last thing to come back — for weeks the entry did not
  # exist AT ALL, which is what a 0.00 % hit rate on 1630 compilations actually meant.
  # The budget arithmetic and the rules that keep it solvent:
  # docs/agent-rules/actions-cache-budget.md.
  SCCACHE_CACHE_SIZE: "2G"

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Ubuntu or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    #
    # PINNED to windows-2025 rather than windows-latest (#1009). `windows-latest`
    # is a rolling alias, and when GitHub rolls it the image's cl.exe changes.
    # sccache hashes the compiler binary into every cache key, so an image roll
    # invalidates the ENTIRE sccache in one step -- silently, because the cache
    # still restores and the build still goes green, just with a 0% hit rate. That
    # is the measured state of this job: run 33502248619 reported 1516 compile
    # requests / 0 hits against a snapshot taken six days earlier. A pinned image
    # makes an image bump a deliberate, reviewable commit that we can pair with the
    # cache-key bump below.
    runs-on: windows-2025

    # `actions: write` is needed by the sccache save (#1073): when the repo's 10 GB
    # cache store is full every save is refused, and the only way to land this job's
    # snapshot is to delete the entry it supersedes first. Scoped to this ref by
    # `save-cache-pruned`. `contents: read` is re-declared because a job-level block
    # REPLACES the default set rather than adding to it.
    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # This job only builds, tests, and uploads artifacts — it makes no
        # authenticated git writes — so don't leave the GITHUB_TOKEN in
        # .git/config where a later step or a compromised dependency could read it.
        persist-credentials: false

    - name: Install Python 3.10
      id: py
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
       python-version: '3.10'

    - name: Install python dependencies
      run: |
        # jinja2 pinned for githubactions:S8544 (lock resolved versions); bump deliberately.
        python -m pip install jinja2==3.1.6
        python -c "import jinja2; print(f'jinja2 {jinja2.__version__} installed at {jinja2.__file__}')"
    
    - name: Setup Vulkan SDK
      uses: ./.github/actions/setup-vulkan

    # We build with the Ninja generator (not the default Visual Studio generator)
    # so CMAKE_<LANG>_COMPILER_LAUNCHER engages — the VS/MSBuild generator ignores
    # it, so sccache would never run there. Ninja needs cl.exe + the Windows SDK
    # include/lib paths on the job env; ilammy/msvc-dev-cmd runs vcvars and exports
    # them to every subsequent step. (Trade-off: the Ninja path does not build the
    # C# OloEngine-ScriptCore project — it is gated on the VS generator — so that
    # one assembly's *compile* is no longer covered by this job. The C# source is
    # still validated by the text-based AssetCSharpScriptValidityTest, and nothing
    # in the test/runtime build links against the assembly.)
    - name: Setup MSVC dev environment
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    # OLO_VIDEO_FFMPEG defaults ON, so the engine build compiles FFmpeg from source
    # (scripts/build-ffmpeg.sh). That needs nasm + a bash + Visual Studio; windows-2025
    # has Git-bash + Strawberry Perl (gmake), and we provision nasm here.
    - name: Install nasm
      run: choco install nasm -y --no-progress

    # Cache the built FFmpeg so only the first (or post-bump) run pays the ~10-15 min build.
    - name: Restore FFmpeg build
      id: ffcache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: OloEngine/vendor/ffmpeg-install
        key: ffmpeg-${{ runner.os }}-n7.1-${{ hashFiles('scripts/build-ffmpeg.sh') }}

    # Provisions sccache and wires it to the GitHub Actions cache backend
    # (SCCACHE_GHA_ENABLED above). Must run before Configure so the launcher
    # resolves on PATH.
    #
    # Action v0.0.10 + sccache >= v0.10.0 are REQUIRED: GitHub decommissioned the
    # legacy Actions cache API on 2025-04-15, and older sccache builds still hit
    # the dead endpoint — the server then fails to start ("cache storage failed to
    # read: ... services aren't available") and, because sccache is the compiler
    # launcher, every compile fails. v0.10.0+ speaks the new cache service (ghac
    # v2, via opendal 0.52); we pin the current stable release for reproducibility.
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.15.0"

    # Persist sccache's local-disk cache (SCCACHE_DIR) as a single actions/cache
    # entry, as an explicit restore + an `if: always()` save further down rather
    # than the combined action (#1009 -- see the save step for why). The key is
    # unique per run attempt so each save writes a fresh, updated snapshot;
    # restore-keys falls back to the most recent prior one, so each run starts
    # warm and banks the superset.
    #
    # The key carries the runner IMAGE (`windows-2025`), not just "windows". A
    # hosted image roll swaps cl.exe underneath us, and sccache hashes the
    # compiler binary -- so every entry taken on the old image becomes a
    # guaranteed miss while still restoring, downloading and occupying quota.
    # That is exactly what run 33502248619 showed: 1516 compile requests, 0 hits,
    # against a snapshot taken six days earlier. `runs-on` is pinned to the same
    # image; when it is bumped, bump this string with it so the dead entries age
    # out instead of being restored forever.
    - name: Restore sccache storage
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-windows-2025-release-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          sccache-windows-2025-release-

    # Third-party dependencies come from the vcpkg manifest (vcpkg.json) since
    # issue #773. Ports are restored from the Actions-backed binary cache; only a
    # baseline bump or a triplet change pays a real port build.
    - name: Setup vcpkg
      id: vcpkg
      uses: ./.github/actions/setup-vcpkg
      with:
        triplet: x64-windows-static-md

    - name: Configure CMake
      # On a cache hit, point CMake at the prebuilt FFmpeg (ffmpeg.cmake's OLO_FFMPEG_PREFIX
      # fast path) so the build step doesn't rebuild it; on a miss it builds from source.
      #
      # -G "Ninja Multi-Config": required for the sccache compiler launcher to
      #   engage (see the MSVC dev-env step above). -C Release still selects the
      #   Release config in the build/ctest steps, exactly as the VS generator did.
      # -DCMAKE_*_COMPILER=cl: force MSVC cl.exe (msvc-dev-cmd put it on PATH) so
      #   Ninja doesn't auto-pick a clang/gcc that may also be on the runner.
      # -DOLO_ENABLE_COMPILER_CACHE=ON: wires sccache as the launcher and switches
      #   MSVC debug info to /Z7 (Embedded) so objects are cacheable (cmake/CompilerCache.cmake).
      # -DOLO_ENABLE_LTO=OFF: CI binaries are for testing, not shipping. Dropping
      #   LTO removes the slow /LTCG link AND the /GL flag that would otherwise make
      #   sccache unable to cache the object files.
      shell: bash
      run: |
        PREFIX_ARG=""
        if [ "${{ steps.ffcache.outputs.cache-hit }}" = "true" ]; then
          PREFIX_ARG="-DOLO_FFMPEG_PREFIX=${GITHUB_WORKSPACE}/OloEngine/vendor/ffmpeg-install"
        fi
        cmake -S . -B "${GITHUB_WORKSPACE}/build" \
          -G "Ninja Multi-Config" \
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
          -DOLO_ENABLE_COMPILER_CACHE=ON \
          -DOLO_ENABLE_LTO=OFF \
          -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}" \
          -DOLO_WITH_USD=OFF -DOLO_WITH_ALEMBIC=OFF -DOLO_WITH_MATERIALX=OFF \
          ${{ steps.vcpkg.outputs.toolchain-args }} \
          $PREFIX_ARG

    # The other half of setup-vcpkg's restore/save split (#1009). `if: always()`
    # is the whole point: the combined actions/cache action saves in a POST-JOB
    # step, which a CANCELLED job skips -- and most PR runs here are cancelled.
    # Placed before the build so a cancellation during the long build/test tail
    # still banks the ports this run just spent ~40 minutes installing.
    - name: Save vcpkg binary cache
      if: always()
      # A cache save must never fail the job it is attached to. `if: always()`
      # means this runs on a CANCEL, where the path it is asked to save may not
      # exist yet -- and actions/cache/save treats a missing path as a validation
      # error, not a no-op. Turning a cancelled run into a FAILED one would be a
      # strictly worse outcome than the cold cache this is fixing.
      continue-on-error: true
      uses: ./.github/actions/save-vcpkg-cache
      with:
        key: ${{ steps.vcpkg.outputs.cache-key }}
        path: ${{ steps.vcpkg.outputs.cache-path }}

    - name: Build with CMake
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    # Issue #858: a compiler-cache launcher that restores the object but not its
    # dependency file leaves ninja with no header dependencies for that object, so the
    # TU is never rebuilt when a header it includes changes -- silently, with the build
    # staying green. This job is the one place in CI where a launcher sits in front of
    # the compiler, so it is where the check belongs. It passes today (cl.exe uses
    # /showIncludes, which sccache replays); the point is that it would stop passing if
    # the dependency scanning were ever switched to a form the launcher cannot see.
    - name: Check ninja recorded header dependencies
      shell: pwsh
      run: >
        & "${{github.workspace}}/scripts/Check-NinjaHeaderDeps.ps1"
        -BuildDir "${{github.workspace}}/build" -Config "${{env.BUILD_TYPE}}"

    # Read the cache hit rate. On a cold cache (first run / after a real source
    # change) this is mostly writes; on a warm cache a high hit rate means the
    # build step did almost no compiling.
    - name: Show sccache stats
      if: always()
      run: sccache --show-stats

    # Paired with the restore above (#1009). `if: always()` is the point: the
    # combined actions/cache action saves in a POST-JOB step, and post-job steps
    # do NOT run when a job is cancelled -- which is how most PR runs in this repo
    # end (`cancel-in-progress`; 17 of 27 Windows and 15 of 24 Sanitizer PR runs
    # over the window measured in #1009). Every one of those recompiled everything
    # and banked nothing, so the next run started just as cold.
    #
    # NOT ON PULL REQUESTS (#1073). A cache entry written by a PR run is scoped to
    # `refs/pull/N/merge` and is readable by that ONE pull request; only default-branch
    # entries are visible fleet-wide, which is exactly why the nightly cron exists (see
    # the trigger note at the top of this file). So a PR's 2 GB snapshot buys a single
    # PR a marginal delta over the master snapshot it already restores -- and charges
    # the whole repository 2 GB of a 10 GB cap for it, for as long as that PR stays
    # open. Six concurrent PRs is a routine day here and 12 GB of PR-private sccache
    # does not fit in a 10 GB store: it holds the store read-only, which stops the
    # NIGHTLY from writing the one snapshot every branch actually restores from. The
    # PR runs were paying for the mechanism that was making them cold. They now
    # restore and never save; `cache-prune` still collects the entries they left
    # behind. The save is kept on workflow_dispatch so a warm/cold A/B can be measured
    # on a branch (that is how the fix for #1073 was verified).
    - name: Save sccache storage
      if: always() && github.event_name != 'pull_request'
      uses: ./.github/actions/save-cache-pruned
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-windows-2025-release-${{ github.run_id }}-${{ github.run_attempt }}
        prefix: sccache-windows-2025-release
        token: ${{ secrets.GITHUB_TOKEN }}

    # Banked here rather than by the combined actions/cache action's post-job
    # step, which a CANCELLED job skips (#1009). FFmpeg is a ~10-15 min from-source
    # build, so a run that built it and was then cancelled during the engine build
    # made the NEXT run pay for it again. Skipped on a hit: the key is content-
    # addressed by build-ffmpeg.sh, so re-saving it would only log 'cache already
    # exists' on every warm run.
    - name: Save FFmpeg build
      if: always() && steps.ffcache.outputs.cache-hit != 'true'
      # A cache save must never fail the job it is attached to. `if: always()`
      # means this runs on a CANCEL, where the path it is asked to save may not
      # exist yet -- and actions/cache/save treats a missing path as a validation
      # error, not a no-op. Turning a cancelled run into a FAILED one would be a
      # strictly worse outcome than the cold cache this is fixing.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: OloEngine/vendor/ffmpeg-install
        key: ffmpeg-${{ runner.os }}-n7.1-${{ hashFiles('scripts/build-ffmpeg.sh') }}

    # App-launch smoke test (issue #303). Run each shipped binary with
    # `--smoke-test`: it performs full startup (runtime-DLL load, subsystem init,
    # network listen for the server) and exits 0 after a few ticks. This catches
    # the "missing runtime DLL" regression class — FFmpeg is a static PE import,
    # so a binary whose avcodec/avformat/... DLLs weren't deployed fails in the
    # OS loader before main(). The GUI apps run window-less under the flag, so the
    # check needs no GL 4.6 context (hosted runners have none). cwd is OloEditor so
    # shaders/assets/Mono resolve as in a real run; DLLs load from beside each .exe.
    # The in-suite AppLaunchSmokeTest covers the same ground via CTest below; this
    # explicit step makes a launch regression obvious in the job log.
    - name: Smoke-test app launches
      shell: pwsh
      working-directory: ${{github.workspace}}/OloEditor
      timeout-minutes: 5
      run: |
        $ErrorActionPreference = 'Stop'
        $bin = Join-Path '${{github.workspace}}' 'bin/${{env.BUILD_TYPE}}'
        $cwd = Join-Path '${{github.workspace}}' 'OloEditor'
        $apps = @(
          @{ Name = 'OloServer';  Path = Join-Path $bin 'OloServer/OloServer.exe';   Args = '--smoke-test --port 28778' },
          @{ Name = 'OloEditor';  Path = Join-Path $bin 'OloEditor/OloEditor.exe';   Args = '--smoke-test' },
          @{ Name = 'OloRuntime'; Path = Join-Path $bin 'OloRuntime/OloRuntime.exe'; Args = '--smoke-test' }
        )
        $failed = $false
        foreach ($a in $apps) {
          if (-not (Test-Path $a.Path)) {
            Write-Error "$($a.Name): binary not found at $($a.Path)"
            $failed = $true
            continue
          }
          Write-Host "::group::$($a.Name) launch smoke"
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $a.Path
          $psi.Arguments = $a.Args
          $psi.WorkingDirectory = $cwd
          $psi.UseShellExecute = $false
          $proc = [System.Diagnostics.Process]::Start($psi)
          if (-not $proc.WaitForExit(60000)) {
            try { $proc.Kill() } catch {}
            Write-Host "::endgroup::"
            Write-Error "$($a.Name): did not exit within 60s — likely hung at startup."
            $failed = $true
            continue
          }
          $code = $proc.ExitCode
          Write-Host "::endgroup::"
          if ($code -ne 0) {
            Write-Error "$($a.Name): exited with code $code — launch smoke FAILED (missing runtime DLL or startup crash)."
            $failed = $true
          } else {
            Write-Host "$($a.Name): launched and exited cleanly (exit 0)."
          }
        }
        if ($failed) { exit 1 }
        Write-Host 'All shipped binaries passed the launch smoke test.'

    - name: Run tests with CTest
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      # `--timeout 120` is a backstop: a stuck test fails its own ctest entry
      # instead of deadlocking the whole job, and the failure still surfaces in
      # the JUnit XML for the test-reporter. `-C ${{env.BUILD_TYPE}}` is required
      # on a multi-config generator (here Ninja Multi-Config) — without it CTest
      # can't locate the per-config test binaries.
      #
      # --exclude-regex skips only one case:
      #   NetworkIntegrationTest        — drives a live Steam (GameNetworkingSockets)
      #     client/server socket; excluded on every sanitizer job too.
      #
      # #1009 item G proposed a PR-only fast subset here (L6/L7/L8 excluded via
      # generate_test_catalogue.py). It was BUILT, RUN, AND MEASURED, and the
      # measurement killed it: the filter names 99 suites, which sounds like a
      # third of the renderer pyramid, and removes 185 of 6,927 ctest entries —
      # 2.7%. Those cases SKIP on a GPU-less runner in ~0.85 s each, so at
      # --parallel 4 the saving is about 40 seconds of a 1,321-second step.
      #
      # The premise was that the perf/golden/visual layers are a large fraction of
      # the suite. They are a large fraction of the suite's FILES and a rounding
      # error in its TEST COUNT. Two extra steps, a 2.5 KB regex built at runtime,
      # and two guards against a green-run-that-tested-nothing are not worth 40
      # seconds — especially in a repo whose dominant failure archetype is exactly
      # that.
      #
      # The real lever, if this step is ever worth attacking: it is ~6,900 PROCESS
      # LAUNCHES, one per test, each paying full engine static-init
      # (gtest_discover_tests). Cutting the test COUNT by a few percent cannot
      # move that; batching tests per process would. Out of scope for #1009.
      #
      # CancellationTokenTest.MultipleTasks was previously also excluded (issue
      # #359): it intermittently DEADLOCKED under `--parallel` oversubscription —
      # not in the test body but in scheduler teardown. FWaitingQueue::StartShutdown
      # drained the standby-worker stack by walking Node->Next in place while
      # triggering each node's event; a woken ConditionalStandby worker could
      # re-push itself onto a head it still owned, forming a Node->Next self-cycle
      # that spun the drain forever. Fixed by draining via an atomic exchange of the
      # whole stack (reading Next before Trigger). The test is RE-ENABLED here.
      #
      # The rest of the Task/Async family (TaskSystemTest, PipeTest, TaskEventTest,
      # NestedTasksTest, TaskDependenciesTest, TaskStressTest, MakeCompletedTaskTest,
      # IsAwaitableTest, WaitAnyTest, AnyTest, DeepRetractionTest, InlineTaskTest,
      # MoveOnlyResultTest, TaskSelfAccessTest, NestedTaskStressTest,
      # ConcurrentEventTriggerTest, TaskConcurrencyLimiterTest, WorkerRestartTest,
      # and CancellationTokenTest.BasicCancellation) was previously excluded
      # wholesale on a "Timeouts + SEGFAULTs" note but is now RE-ENABLED: the
      # concurrency core had had no Windows-CI coverage since dc4c836d (2026-04-21).
      # Each suite was classified under a faithful hosted-runner squeeze (4-core
      # affinity + OLO_TASK_GRAPH_NUM_WORKERS=4 to match the runner's worker fleet
      # + `ctest --parallel 4`) and held up at 30x faithful + 20x a harsher 2-core
      # squeeze with zero failures; the wholesale exclusion was far broader than the
      # single genuine fault. See the "Parallel-safety contract" in
      # docs/agent-rules/testing-architecture.md §6.3.
      #
      # --parallel 4 runs up to 4 test processes at once (windows-2025 has 4
      # vCPUs). Every test is its own ctest entry (gtest_discover_tests → one
      # OloEngine-Tests.exe per test), so serial execution pays full engine
      # static-init ~3,200x back-to-back; a 4-wide run is a large per-PR
      # wall-clock win.
      #
      # The suite is parallel-safe, and the property is ENFORCED rather than
      # asserted (issue #789 — this comment previously claimed "tests key their
      # temp paths by PID / gtest case name", which was true of most sites and had
      # never been measured). Every test scratch path now comes from
      # OloEngine::Tests::TempDir() / TempFile() (OloEngine/tests/TestTempDir.h),
      # rooted in a directory claimed exclusively by THIS process and keyed per
      # gtest case beneath it; a pre-commit hook (test-temp-dir-isolated) fails any
      # direct temp_directory_path() call in the test tree. The one resource that
      # is not test-controlled and cannot be process-keyed — the engine's
      # repo-relative mesh cache — is serialized with a ctest RESOURCE_LOCK
      # (OloEngine/tests/CMakeLists.txt). Functional/Jolt tests oversubscribe cores
      # under -j but run stable (verified to 16x locally). See the "Parallel-safety
      # contract" in docs/agent-rules/testing-architecture.md and
      # docs/agent-rules/shared-temp-dir-test-isolation.md.
      #
      # --output-on-failure replaces -V: full verbosity interleaves illegibly
      # across parallel workers and bloats the runner log. This keeps green runs
      # quiet and prints captured output only for failing tests; the per-test
      # JUnit XML uploaded below keeps the complete record either way.
      #
      # NOTE: the interim `--repeat until-pass:3` flaky-retry for issue #281
      # (PhysicsLayerFilteringTest SEH 0xc0000005) was REMOVED — #281 is fixed at
      # the root (JoltJobSystemAdapter::WaitForOutstandingTasks now blocks instead
      # of busy-spinning, so the game thread stops starving the scheduler worker on
      # a core-starved runner). The fix is in the shared job-system adapter, so it
      # stabilises every physics / Functional test under -j oversubscription, not
      # just this one — which is why the retry can go. Verified: a dedicated
      # `flaky-repro-281.yml` hunt ran the test under the 2-core squeeze for the
      # full step on the hosted runner with zero failures. If a physics test ever
      # flakes here again, reinstate `--repeat until-pass:3` AND reopen #281.
      shell: bash
      run: ctest --parallel 4 --output-on-failure --timeout 120 -C "${BUILD_TYPE}" --exclude-regex '^NetworkIntegrationTest\.'

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: googletest_results_xml
        path: ${{runner.workspace}}/OloEngineBase/test_results/*.xml
        if-no-files-found: 'warn'

    # Issue #908: bake a CI-portable SPIR-V shader pack and publish it as a
    # build artifact for anyone who wants it (a packaged game's build step
    # pulls it in explicitly — see docs/agent-rules/shader-pack-bake.md — a
    # fresh worktree does NOT fetch it automatically). This runs the test
    # binary's own `--olo-bake-shader-pack` mode rather than a full editor
    # launch: no GL context is created anywhere in that path (verified — see
    # ShaderPackBakeTest.cpp), so it needs nothing this hosted, GPU-less
    # runner doesn't already have. `--gtest_filter` isolates the one test
    # this flag drives so the rest of the suite (already run above) doesn't
    # execute a second time.
    - name: Bake shader pack (issue #908)
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        $ErrorActionPreference = 'Stop'
        $testExe = Join-Path '${{github.workspace}}' 'build/OloEngine/tests/${{env.BUILD_TYPE}}/OloEngine-Tests.exe'
        & $testExe --gtest_filter=ShaderPackBakeTest.* --olo-bake-shader-pack="OloEditor/assets/ShaderPack.osp"
        if ($LASTEXITCODE -ne 0) { throw "Shader pack bake failed (exit $LASTEXITCODE)" }

    - name: Upload shader pack artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ShaderPack
        path: ${{github.workspace}}/OloEditor/assets/ShaderPack.osp
        if-no-files-found: error
