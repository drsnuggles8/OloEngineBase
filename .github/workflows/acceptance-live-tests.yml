name: Live acceptance sampler tests

on:
  pull_request:
    paths:
      - 'scripts/perf/**'
      - '.github/workflows/acceptance-live-tests.yml'

permissions:
  contents: read

jobs:
  camera-window:
    name: Verify live camera frame windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - run: python -m pip install PyYAML==6.0.2
      # The acceptance, foliage and streaming drivers share capture helpers with
      # the live sampler. Keep their verdict and contention regression tests in
      # this gate too, including when a shared helper changes.
      - run: python -m unittest discover -s scripts/perf -p 'test_*.py' -v
