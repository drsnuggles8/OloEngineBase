name: Live acceptance sampler tests

on:
  pull_request:
    paths:
      - 'scripts/perf/acceptance-live.py'
      - 'scripts/perf/test_acceptance_live.py'
      - '.github/workflows/acceptance-live-tests.yml'

permissions:
  contents: read

jobs:
  camera-window:
    name: Verify live camera frame windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s scripts/perf -p 'test_acceptance_live.py' -v
