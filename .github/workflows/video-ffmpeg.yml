# Dedicated CI for the FFmpeg video backend: builds with OLO_VIDEO_FFMPEG=ON on both
# Windows and Linux runners and runs the decode path against a real MP4 fixture.
#
# OLO_VIDEO_FFMPEG now defaults to ON, so the regular Windows/Linux builds also compile
# FFmpeg from source (they need nasm + a bash on the runner). This workflow exists to
# (a) give the FFmpeg build a cached, nasm-provisioned home so the slow (~10-15 min cold)
# build is paid once, and (b) exercise the end-to-end decode test with a fixture. The
# built FFmpeg (vendor/ffmpeg-install) is cached and reused via OLO_FFMPEG_PREFIX.
name: Video (FFmpeg backend)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, runner: windows-2025, os: Windows }
          - { name: linux,   runner: ubuntu-24.04,    os: Linux }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build + decode-test only; no authenticated git writes — so don't leave
          # the GITHUB_TOKEN in .git/config for later steps/dependencies to read.
          persist-credentials: false

      - name: Install Python 3.10
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Python deps (OloHeaderTool)
        run: |
          # jinja2 pinned for githubactions:S8544 (lock resolved versions); bump deliberately.
          python -m pip install jinja2==3.1.6

      - name: Setup Vulkan SDK
        uses: ./.github/actions/setup-vulkan

      # FFmpeg's from-source build needs nasm on both platforms (gmake/make + a bash
      # are already present: Strawberry Perl + Git-bash on windows-2025; make + bash
      # on ubuntu). The Linux engine build also needs the usual GL/X/shader dev libs.
      - name: Install nasm (Windows)
        if: matrix.os == 'Windows'
        run: choco install nasm -y --no-progress

      # The hosted image ships ~14 GB free, which asan.yml records as enough to hit
      # "No space left on device" during the OloEngine-Tests link. This leg is heavier
      # than those: on top of the engine + test suite it unpacks a vcpkg tree AND, on a
      # cache miss, a full FFmpeg source checkout and build. Reclaim ~20 GB of
      # preinstalled toolchains this job never uses. `|| true` keeps a missing path from
      # failing the job; the df lines bracket it for diagnostics.
      - name: Free disk space (Linux)
        if: matrix.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      # The engine needs a C++23 STANDARD LIBRARY, not just a C++23 compiler:
      # Core/Reflection/MemberList.h uses std::forward_like, which ubuntu-24.04's default
      # GCC/libstdc++ does not provide ("error: 'forward_like' is not a member of 'std'").
      # Every other Linux job in this repo pins clang-23 from apt.llvm.org for the same
      # reason — see asan.yml and steam-stub.yml. Without this, fixing the OOM below only
      # moves the failure (issue #796, root cause 2).
      - name: Add LLVM apt repository (Linux)
        if: matrix.os == 'Linux'
        uses: ./.github/actions/setup-llvm-apt

      - name: Install Linux deps
        if: matrix.os == 'Linux'
        run: |
          # The ubuntu runner image ships Microsoft apt repos (azure-cli, prod) that
          # periodically return 403 Forbidden; we never use them (Clang comes from
          # apt.llvm.org), and `apt-get update` fails hard on any single repo error.
          # Drop any Microsoft source so a Microsoft-side outage can't break our update.
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            clang-23 lld-23 \
            libgl-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            glslang-dev libshaderc-dev libspirv-cross-c-shared-dev spirv-tools

      # Cache the built FFmpeg so only the first (or post-bump) run pays the build cost.
      - name: Restore FFmpeg build
        id: ffcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: OloEngine/vendor/ffmpeg-install
          key: ffmpeg-${{ runner.os }}-n7.1-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      # On a cache hit, point CMake at the prebuilt tree (skips the ExternalProject
      # rebuild via ffmpeg.cmake's OLO_FFMPEG_PREFIX fast path). On a miss, the
      # ExternalProject builds FFmpeg from source and the cache step saves it.
      # Third-party deps come from the vcpkg manifest (issue #773). The triplet
      # follows the matrix runner; FFmpeg itself deliberately stays on its own
      # ExternalProject + actions/cache (see cmake/ffmpeg.cmake).
      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ runner.os == 'Windows' && 'x64-windows-static-md' || 'x64-linux' }}

      - name: Configure (FFmpeg ON)
        shell: bash
        run: |
          PREFIX_ARG=""
          if [ "${{ steps.ffcache.outputs.cache-hit }}" = "true" ]; then
            PREFIX_ARG="-DOLO_FFMPEG_PREFIX=${GITHUB_WORKSPACE}/OloEngine/vendor/ffmpeg-install"
          fi

          # Linux-only toolchain pins. Windows keeps its defaults: the VS generator is
          # multi-config (build type comes from --config at build time) and MSVC is
          # already the right compiler there.
          #
          # -DCMAKE_{C,CXX}_COMPILER=clang-23/clang++-23: see the LLVM apt step above —
          #   the default GCC/libstdc++ lacks std::forward_like.
          # -DCMAKE_BUILD_TYPE=Release: Unix Makefiles is SINGLE-config, so the build
          #   type must be set here. The build step's `--config Release` was silently
          #   ignored on this leg, which is why the job's stated Release build was a
          #   fiction on Linux (issue #796).
          # -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld: the default GNU BFD ld holds the whole
          #   static-engine link in memory and can exceed a hosted runner's 16 GB — the
          #   OOM reaper then kills the runner agent mid-link. Same pin as asan.yml.
          # -DOLO_ENABLE_LTO=OFF: LTO defaults ON in Release, and CMake's IPO for Clang
          #   is full (not thin) LTO — a single-threaded whole-program link of the entire
          #   static engine, the most memory-hungry step there is, on the leg we are
          #   trying to stop OOM-killing. CI binaries are for testing, not shipping, so
          #   the codegen is irrelevant; Windows.yml, asan.yml, fuzz.yml and
          #   flaky-repro-281.yml all drop LTO for the same reason.
          TOOLCHAIN_ARGS=()
          if [ "${{ matrix.os }}" = "Linux" ]; then
            TOOLCHAIN_ARGS=(
              -DCMAKE_C_COMPILER=clang-23
              -DCMAKE_CXX_COMPILER=clang++-23
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
              -DOLO_ENABLE_LTO=OFF
            )
          fi

          cmake -S . -B build -DOLO_VIDEO_FFMPEG=ON $PREFIX_ARG \
            -DOLO_WITH_USD=OFF -DOLO_WITH_ALEMBIC=OFF -DOLO_WITH_MATERIALX=OFF \
            "${TOOLCHAIN_ARGS[@]}" \
            ${{ steps.vcpkg.outputs.toolchain-args }} \
            -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}"

      # The other half of setup-vcpkg's restore/save split (#1009). `if: always()`
      # is the whole point: the combined actions/cache action saves in a POST-JOB
      # step, which a CANCELLED job skips -- and most PR runs here are cancelled.
      # Placed before the build so a cancellation during the long build/test tail
      # still banks the ports this run just spent ~40 minutes installing.
      - name: Save vcpkg binary cache
        if: always()
        # A cache save must never fail the job it is attached to. `if: always()`
        # means this runs on a CANCEL, where the path it is asked to save may not
        # exist yet -- and actions/cache/save treats a missing path as a validation
        # error, not a no-op. Turning a cancelled run into a FAILED one would be a
        # strictly worse outcome than the cold cache this is fixing.
        continue-on-error: true
        uses: ./.github/actions/save-vcpkg-cache
        with:
          key: ${{ steps.vcpkg.outputs.cache-key }}
          path: ${{ steps.vcpkg.outputs.cache-path }}

      # Both legs build Release, matching the main Windows.yml CI (BUILD_TYPE: Release).
      # The shader libs (shaderc / spirv-cross-{core,glsl}) come from the headless Vulkan
      # SDK installed above, which ships only release (/MD) import libs — no debug (…d.lib)
      # variants. A Debug (/MDd) build of OloEngine-Tests then links release spirv-cross
      # objects and dies with LNK2038 (_ITERATOR_DEBUG_LEVEL 0 vs 2 / MD_DynamicRelease vs
      # MDd_DynamicDebug) → LNK1319. Release keeps the CRT consistent. The FFmpeg decode
      # path under test is config-independent.
      #
      # Split per-OS because the two generators disagree about where the build type lives
      # and about what a bare `--parallel` means. Both are capped explicitly per CLAUDE.md.
      - name: Build tests (builds FFmpeg on cache miss) — Windows
        if: matrix.os == 'Windows'
        # --config Release: the VS generator is multi-config, so the build type is
        # selected here rather than at configure time.
        # --parallel 4: windows-2025 has 4 cores, so this matches what MSBuild's bare
        # `/m` already resolved to — no behaviour change, it just stops the workflow from
        # relying on a tool default, per CLAUDE.md ("never acceptable is a bare
        # --parallel"). This leg is not the broken one and is deliberately left otherwise
        # untouched (issue #796).
        run: cmake --build build --target OloEngine-Tests --config Release --parallel 4

      - name: Build tests (builds FFmpeg on cache miss) — Linux
        if: matrix.os == 'Linux'
        # No --config: this is the single-config Unix Makefiles generator, so the build
        # type came from CMAKE_BUILD_TYPE at configure time and --config is silently
        # ignored here.
        #
        # --parallel 4, NOT a bare --parallel. CMake forwards an argument-less --parallel
        # to the native tool, which for Unix Makefiles becomes `make -j` with no number —
        # UNLIMITED, one job per ready target. That exhausted the 16 GB runner at ~29%,
        # still inside the vendor deps (abseil), before reaching a single engine source
        # file, and the OOM reaper killed the runner agent ("The runner has received a
        # shutdown signal", exit 143). This was root cause 1 of issue #796 and had failed
        # every weekly run for 10+ weeks.
        #
        # Why 4 and not 2: this is the SAME runner, generator and target as steam-stub.yml,
        # which has built OloEngine-Tests at --parallel 4 on every master push since #795
        # without OOM — including the two memory-heavy TUs (LuaScriptGlue.cpp,
        # McpFieldRegistry.cpp). Worth knowing that root CMakeLists.txt's memory job pools
        # (OLO_LINK_JOBS, OLO_HEAVY_COMPILE_JOBS) are both gated on `CMAKE_GENERATOR MATCHES
        # "Ninja"` and are therefore INERT here — but so are they in steam-stub, and this
        # target links exactly one executable, so the link pool has nothing to serialise
        # anyway. If a future run does OOM in engine sources, drop to `--parallel 2` (what
        # asan.yml's Linux jobs use) before reaching for a generator change.
        run: cmake --build build --target OloEngine-Tests --parallel 4

      # Banked here rather than by the combined actions/cache action's post-job
      # step, which a CANCELLED job skips (#1009). FFmpeg is a ~10-15 min from-source
      # build, so a run that built it and was then cancelled during the engine build
      # made the NEXT run pay for it again. Skipped on a hit: the key is content-
      # addressed by build-ffmpeg.sh, so re-saving it would only log 'cache already
      # exists' on every warm run.
      - name: Save FFmpeg build
        if: always() && steps.ffcache.outputs.cache-hit != 'true'
        # A cache save must never fail the job it is attached to. `if: always()`
        # means this runs on a CANCEL, where the path it is asked to save may not
        # exist yet -- and actions/cache/save treats a missing path as a validation
        # error, not a no-op. Turning a cancelled run into a FAILED one would be a
        # strictly worse outcome than the cold cache this is fixing.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: OloEngine/vendor/ffmpeg-install
          key: ffmpeg-${{ runner.os }}-n7.1-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      # Fetch a small H.264 MP4 so the FFmpeg decode path runs end-to-end. -f fails on HTTP
      # errors and --retry rides out transient flakes; the existence check surfaces a genuine
      # download failure instead of silently letting the decode test SKIP.
      - name: Fetch decode fixture
        shell: bash
        run: |
          curl -fSL --retry 3 --retry-delay 5 --max-time 120 \
            -o "${GITHUB_WORKSPACE}/sample.mp4" https://download.samplelib.com/mp4/sample-5s.mp4
          test -s "${GITHUB_WORKSPACE}/sample.mp4"

      - name: Run video tests
        shell: bash
        # Run from the repo root so VideoPlaybackTest's relative fixture candidates resolve, and
        # locate the binary per-OS: Windows (VS multi-config) emits it under Release/ with a .exe
        # suffix; Linux (single-config) emits build/OloEngine/tests/OloEngine-Tests with neither.
        run: |
          BIN=$(find build/OloEngine/tests -type f \( -name OloEngine-Tests -o -name OloEngine-Tests.exe \) | head -1)
          test -n "$BIN" || { echo "OloEngine-Tests binary not found under build/OloEngine/tests"; exit 1; }
          "$BIN" --olo-video="${GITHUB_WORKSPACE}/sample.mp4" --gtest_filter='VideoDecoder*:VideoPlayer*:VideoTexture*:VideoFrameInfo*:VideoDecoderFixture*'
