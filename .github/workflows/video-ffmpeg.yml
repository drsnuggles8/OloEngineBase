# Dedicated CI for the FFmpeg video backend: builds with OLO_VIDEO_FFMPEG=ON on both
# Windows and Linux runners and runs the decode path against a real MP4 fixture.
#
# OLO_VIDEO_FFMPEG now defaults to ON, so the regular Windows/Linux builds also compile
# FFmpeg from source (they need nasm + a bash on the runner). This workflow exists to
# (a) give the FFmpeg build a cached, nasm-provisioned home so the slow (~5 min cold on
# windows-2025, measured) build is paid once, and (b) exercise the end-to-end decode test
# with a fixture. The built FFmpeg is cached at OLO_FFMPEG_CACHE_DIR (see the env block).
name: Video (FFmpeg backend)

on:
  workflow_dispatch:
    inputs:
      # The windows leg takes about four hours and the linux leg well under one, so a
      # dispatch that debugs one leg should not wait on the other. The schedule has no
      # inputs, so it always runs both.
      legs:
        description: 'Which legs to run'
        type: choice
        options: [both, linux, windows]
        default: both
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

# The event is part of the key so a dispatch (one leg, say, to debug it) never
# cancels the scheduled run on the same ref. A cancelled scheduled run reads as
# neutral to the red-streak job, so that week's result would never be alerted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # See Windows.yml's env block for the full story. Short version: the cache steps
  # named `OloEngine/vendor/ffmpeg-install`, which `cmake/ffmpeg.cmake` stopped using
  # when the install tree moved to a per-user shared directory. Every save here logged
  # "Path Validation Error ... hence no cache is being saved" and exited zero, and every
  # restore missed -- so the workflow whose stated purpose is "give the FFmpeg build a
  # cached home so the slow build is paid once" rebuilt it from source every week.
  # Pinning the directory in one place is what makes both sides spell it alike.
  OLO_FFMPEG_CACHE_DIR: ${{ github.workspace }}/.ffmpeg-cache

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `inputs.legs` is empty on a scheduled run, which selects both legs.
        include: ${{ fromJSON(
          inputs.legs == 'linux' && '[{"name":"linux","runner":"ubuntu-24.04","os":"Linux"}]'
          || inputs.legs == 'windows' && '[{"name":"windows","runner":"windows-2025","os":"Windows"}]'
          || '[{"name":"windows","runner":"windows-2025","os":"Windows"},{"name":"linux","runner":"ubuntu-24.04","os":"Linux"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build + decode-test only; no authenticated git writes — so don't leave
          # the GITHUB_TOKEN in .git/config for later steps/dependencies to read.
          persist-credentials: false

      - name: Install Python 3.10 (Windows)
        id: py
        if: matrix.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Python deps (OloHeaderTool) (Windows)
        if: matrix.os == 'Windows'
        run: |
          # jinja2 pinned for githubactions:S8544 (lock resolved versions); bump deliberately.
          python -m pip install jinja2==3.1.6

      - name: Setup Vulkan SDK (Windows)
        if: matrix.os == 'Windows'
        uses: ./.github/actions/setup-vulkan

      # FFmpeg's from-source build needs nasm on both platforms (gmake/make + a bash
      # are already present: Strawberry Perl + Git-bash on windows-2025; make + bash
      # on ubuntu).
      - name: Install nasm (Windows)
        if: matrix.os == 'Windows'
        run: choco install nasm -y --no-progress

      # The Linux leg takes its whole toolchain from the action every other Linux job
      # uses: disk reclaim, Python + jinja2, the pinned shader toolchain, the apt dev
      # libraries and the pinned LLVM 23.1.0. It used to keep a private copy of all of
      # that, which fell two layers behind (no Vulkan loader, then a shader toolchain
      # below the floor) and stopped this leg at configure on every weekly run from
      # 2026-09-14 to 2026-11-16 (#1711).
      #
      # vulkan-sdk 'false': the floor input already supplies shaderc and SPIRV-Cross as a
      # matched pair; the LunarG SDK would only add a second spirv_cross/ include tree
      # ahead of the libraries the build links (#1009). The asan.yml hosted jobs build
      # OloEngine-Tests with the same two inputs.
      - name: Setup Linux build environment
        id: linux
        if: matrix.os == 'Linux'
        uses: ./.github/actions/setup-linux-build
        with:
          cache-name: video-ffmpeg
          vulkan-sdk: 'false'
          shader-toolchain-floor: 'true'

      # The one package this leg needs beyond setup-linux-build: no other Linux job builds
      # FFmpeg (they all configure -DOLO_VIDEO_FFMPEG=OFF), so nasm is not in the shared
      # apt list, and the action has no extra-packages input on purpose ("a per-job list
      # is how one job quietly acquires a dependency the others do not have"). The
      # Microsoft source was already dropped by the action's own apt step.
      - name: Install nasm (Linux)
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get install -y nasm || { sudo apt-get update && sudo apt-get install -y nasm; }
          nasm -v

      # Cache the built FFmpeg so only the first (or post-bump) run pays the build cost.
      - name: Restore FFmpeg build
        id: ffcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OLO_FFMPEG_CACHE_DIR }}/install
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'cmake/ffmpeg.cmake') }}

      # On a cache hit, ffmpeg.cmake's "cache complete" fast path finds every consumed
      # library under OLO_FFMPEG_CACHE_DIR and skips the ExternalProject entirely. On a
      # miss it builds FFmpeg from source into that directory and the save step banks it.
      # Third-party deps come from the vcpkg manifest (issue #773). The triplet
      # follows the matrix runner; FFmpeg itself deliberately stays on its own
      # ExternalProject + actions/cache (see cmake/ffmpeg.cmake).
      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ runner.os == 'Windows' && 'x64-windows-static-md' || 'x64-linux' }}

      - name: Configure (FFmpeg ON)
        shell: bash
        run: |
          # Linux-only toolchain pins. Windows keeps its defaults: the VS generator is
          # multi-config (build type comes from --config at build time) and MSVC is
          # already the right compiler there.
          #
          # -DCMAKE_{C,CXX}_COMPILER, Python_EXECUTABLE and the extra arguments (the
          #   pinned shaderc / SPIRV-Cross roots) all come from setup-linux-build. The
          #   compiler is its pinned clang 23: the default GCC/libstdc++ lacks
          #   std::forward_like.
          # -DCMAKE_BUILD_TYPE=Release: Unix Makefiles is SINGLE-config, so the build
          #   type must be set here. The build step's `--config Release` was silently
          #   ignored on this leg, which is why the job's stated Release build was a
          #   fiction on Linux (issue #796).
          # -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld: the default GNU BFD ld holds the whole
          #   static-engine link in memory and can exceed a hosted runner's 16 GB — the
          #   OOM reaper then kills the runner agent mid-link. Same pin as asan.yml.
          # -DOLO_ENABLE_LTO=OFF: LTO defaults ON in Release, and CMake's IPO for Clang
          #   is full (not thin) LTO — a single-threaded whole-program link of the entire
          #   static engine, the most memory-hungry step there is, on the leg we are
          #   trying to stop OOM-killing. CI binaries are for testing, not shipping, so
          #   the codegen is irrelevant; Windows.yml, asan.yml, fuzz.yml and
          #   flaky-repro-281.yml all drop LTO for the same reason.
          TOOLCHAIN_ARGS=()
          PYTHON_EXE="${{ steps.py.outputs.python-path }}"
          if [ "${{ matrix.os }}" = "Linux" ]; then
            PYTHON_EXE="${{ steps.linux.outputs.python-exe }}"
            TOOLCHAIN_ARGS=(
              -DCMAKE_C_COMPILER="${{ steps.linux.outputs.cc }}"
              -DCMAKE_CXX_COMPILER="${{ steps.linux.outputs.cxx }}"
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
              -DOLO_ENABLE_LTO=OFF
            )
          fi

          # extra-cmake-args is unquoted on purpose: it holds several -D arguments.
          cmake -S . -B build -DOLO_VIDEO_FFMPEG=ON \
            -DOLO_FFMPEG_CACHE_DIR="${OLO_FFMPEG_CACHE_DIR}" \
            -DOLO_WITH_USD=OFF -DOLO_WITH_ALEMBIC=OFF -DOLO_WITH_MATERIALX=OFF \
            "${TOOLCHAIN_ARGS[@]}" \
            ${{ steps.vcpkg.outputs.toolchain-args }} \
            ${{ steps.linux.outputs.extra-cmake-args }} \
            -DPython_EXECUTABLE="${PYTHON_EXE}"

      # The other half of setup-vcpkg's restore/save split (#1009). `if: always()`
      # is the whole point: the combined actions/cache action saves in a POST-JOB
      # step, which a CANCELLED job skips -- and most PR runs here are cancelled.
      # Placed before the build so a cancellation during the long build/test tail
      # still banks the ports this run just spent ~40 minutes installing.
      - name: Save vcpkg binary cache
        if: always()
        # A cache save must never fail the job it is attached to. `if: always()`
        # means this runs on a CANCEL, where the path it is asked to save may not
        # exist yet -- and actions/cache/save treats a missing path as a validation
        # error, not a no-op. Turning a cancelled run into a FAILED one would be a
        # strictly worse outcome than the cold cache this is fixing.
        continue-on-error: true
        uses: ./.github/actions/save-vcpkg-cache
        with:
          key: ${{ steps.vcpkg.outputs.cache-key }}
          path: ${{ steps.vcpkg.outputs.cache-path }}

      # Both legs build Release, matching the main Windows.yml CI (BUILD_TYPE: Release).
      # On Windows the shader libs (shaderc / spirv-cross-{core,glsl}) come from the
      # headless Vulkan SDK installed above (on Linux, from setup-linux-build's pinned
      # OLO_SHADERC_ROOT / OLO_SPIRV_CROSS_ROOT), and it ships only release (/MD) import libs — no debug (…d.lib)
      # variants. A Debug (/MDd) build of OloEngine-Tests then links release spirv-cross
      # objects and dies with LNK2038 (_ITERATOR_DEBUG_LEVEL 0 vs 2 / MD_DynamicRelease vs
      # MDd_DynamicDebug) → LNK1319. Release keeps the CRT consistent. The FFmpeg decode
      # path under test is config-independent.
      #
      # Split per-OS because the two generators disagree about where the build type lives
      # and about what a bare `--parallel` means. Both are capped explicitly per CLAUDE.md.
      - name: Build tests (builds FFmpeg on cache miss) — Windows
        if: matrix.os == 'Windows'
        # --config Release: the VS generator is multi-config, so the build type is
        # selected here rather than at configure time.
        # --parallel 4: windows-2025 has 4 cores, so this matches what MSBuild's bare
        # `/m` already resolved to — no behaviour change, it just stops the workflow from
        # relying on a tool default, per CLAUDE.md ("never acceptable is a bare
        # --parallel"). This leg is not the broken one and is deliberately left otherwise
        # untouched (issue #796).
        run: cmake --build build --target OloEngine-Tests --config Release --parallel 4

      - name: Build tests (builds FFmpeg on cache miss) — Linux
        if: matrix.os == 'Linux'
        # No --config: this is the single-config Unix Makefiles generator, so the build
        # type came from CMAKE_BUILD_TYPE at configure time and --config is silently
        # ignored here.
        #
        # --parallel 4, NOT a bare --parallel. CMake forwards an argument-less --parallel
        # to the native tool, which for Unix Makefiles becomes `make -j` with no number —
        # UNLIMITED, one job per ready target. That exhausted the 16 GB runner at ~29%,
        # still inside the vendor deps (abseil), before reaching a single engine source
        # file, and the OOM reaper killed the runner agent ("The runner has received a
        # shutdown signal", exit 143). This was root cause 1 of issue #796 and had failed
        # every weekly run for 10+ weeks.
        #
        # Why 4 and not 2: this is the SAME runner, generator and target as steam-stub.yml,
        # which has built OloEngine-Tests at --parallel 4 on every master push since #795
        # without OOM — including the two memory-heavy TUs (LuaScriptGlue.cpp,
        # McpFieldRegistry.cpp). Worth knowing that root CMakeLists.txt's memory job pools
        # (OLO_LINK_JOBS, OLO_HEAVY_COMPILE_JOBS) are both gated on `CMAKE_GENERATOR MATCHES
        # "Ninja"` and are therefore INERT here — but so are they in steam-stub, and this
        # target links exactly one executable, so the link pool has nothing to serialise
        # anyway. If a future run does OOM in engine sources, drop to `--parallel 2` (what
        # asan.yml's Linux jobs use) before reaching for a generator change.
        run: cmake --build build --target OloEngine-Tests --parallel 4

      # Banked here rather than by the combined actions/cache action's post-job
      # step, which a CANCELLED job skips (#1009). FFmpeg is a ~10-15 min from-source
      # build, so a run that built it and was then cancelled during the engine build
      # made the NEXT run pay for it again. Skipped on a hit: the key is content-
      # addressed by build-ffmpeg.sh, so re-saving it would only log 'cache already
      # exists' on every warm run.
      # The save above runs `if: always()`, so it also runs on a CANCEL -- and now that the
      # cached path is the one CMake really installs into, a cancel mid-build would bank a
      # HALF-INSTALLED tree. Actions cache entries are immutable, so that entry would then
      # be restored by every later run, fail ffmpeg.cmake's completeness check, get rebuilt,
      # and never be replaced -- the save is skipped on a key hit. Permanent, and silent.
      # `scripts/build-ffmpeg.sh` writes this marker as its very last action, so it exists
      # only for a tree that finished installing.
      - name: Check the FFmpeg tree is complete
        id: ffcomplete
        if: always()
        shell: bash
        run: |
          if [ -f "${OLO_FFMPEG_CACHE_DIR}/install/.olo-ffmpeg-complete" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "FFmpeg install tree has no completion marker - not caching it."
          fi

      - name: Save FFmpeg build
        if: always() && steps.ffcache.outputs.cache-hit != 'true' && steps.ffcomplete.outputs.complete == 'true'
        # A cache save must never fail the job it is attached to. `if: always()`
        # means this runs on a CANCEL, where the path it is asked to save may not
        # exist yet -- and actions/cache/save treats a missing path as a validation
        # error, not a no-op. Turning a cancelled run into a FAILED one would be a
        # strictly worse outcome than the cold cache this is fixing.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OLO_FFMPEG_CACHE_DIR }}/install
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'cmake/ffmpeg.cmake') }}

      # Fetch a small H.264 MP4 so the FFmpeg decode path runs end-to-end. -f fails on HTTP
      # errors and --retry with --retry-all-errors repeats a failed transfer, a connection
      # reset included (--retry alone repeats only a timeout or an HTTP 408/429/5xx); the
      # existence check surfaces a genuine download failure instead of silently letting the
      # decode test SKIP.
      - name: Fetch decode fixture
        shell: bash
        run: |
          curl -fSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 120 \
            -o "${GITHUB_WORKSPACE}/sample.mp4" https://download.samplelib.com/mp4/sample-5s.mp4
          test -s "${GITHUB_WORKSPACE}/sample.mp4"

      - name: Run video tests
        shell: bash
        # Run from the repo root so VideoPlaybackTest's relative fixture candidates resolve, and
        # locate the binary per-OS: Windows (VS multi-config) emits it under Release/ with a .exe
        # suffix; Linux (single-config) emits build/OloEngine/tests/OloEngine-Tests with neither.
        run: |
          BIN=$(find build/OloEngine/tests -type f \( -name OloEngine-Tests -o -name OloEngine-Tests.exe \) | head -1)
          test -n "$BIN" || { echo "OloEngine-Tests binary not found under build/OloEngine/tests"; exit 1; }
          "$BIN" --olo-video="${GITHUB_WORKSPACE}/sample.mp4" --gtest_filter='VideoDecoder*:VideoPlayer*:VideoTexture*:VideoFrameInfo*:VideoDecoderFixture*'

  # -------------------------------------------------------------------------
  # Make a red weekly run visible without anyone opening the Actions tab. The
  # linux leg was red on every weekly run from June to 2026-11-16 before anyone
  # noticed (#1711). The same action as the AMD nightly's alert
  # (.github/actions/red-streak-alert, #1473): one issue labelled
  # ci-nightly-red, retitled and commented on each further red run, closed by
  # the first green scheduled run.
  #
  # Threshold 1: this is a weekly, so a threshold of 2 would leave a regression
  # unreported for a fortnight. A run is red when either leg is red.
  #
  # A workflow_dispatch runs it with --dry-run: it prints what it would do and
  # writes nothing, so the mechanism can be exercised from a branch. A dispatch
  # that ran one leg is judged on that leg only.
  # -------------------------------------------------------------------------
  red-streak:
    name: Red-streak alert
    needs: build
    if: always() && github.repository == 'drsnuggles8/OloEngineBase'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/nightly_red_streak.py
            .github/actions/red-streak-alert
          sparse-checkout-cone-mode: false

      # The build job sets no timeout-minutes, so it has GitHub's default of 360.
      # A dispatch that ran one leg is judged on that leg; an empty line is skipped.
      - name: Open, update or close the red-streak issue
        uses: ./.github/actions/red-streak-alert
        with:
          workflow: video-ffmpeg.yml
          jobs: |
            ${{ inputs.legs != 'linux' && 'windows' || '' }}
            ${{ inputs.legs != 'windows' && 'linux' || '' }}
          result: ${{ needs.build.result }}
          timeout-minutes: 360
          threshold: 1
