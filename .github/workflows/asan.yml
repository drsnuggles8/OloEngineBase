name: Sanitizers
on:
  # NO `push: [master]` -- deliberately, and replaced by the nightly cron below
  # (#1009 item E). Two things are going on and the second is the easy one to miss.
  #
  # 1. It was mostly a second opinion on identical code. GitHub's `pull_request`
  #    event builds `refs/pull/N/merge` -- the PR merged into master -- so by the
  #    time a merge lands, CI has already tested that exact tree. Re-running the
  #    whole workflow on the push cost ~1,400 runner-min/day across the Windows
  #    and Sanitizers workflows together, for a result we already had.
  #
  #    What it DID still catch is the case where master moved between the PR's
  #    last run and the merge, so the tested merge commit was stale -- a semantic
  #    conflict between two PRs neither one's CI could see. The nightly closes
  #    that within a day instead of at merge time. That is a real, if modest,
  #    reduction in safety and it is the deliberate half of this trade.
  #
  # 2. THE MASTER RUN IS ALSO THE CACHE WARMER, which is why this is a cron and
  #    not simply a deletion. actions/cache entries created on a PR branch are
  #    scoped to that PR's ref and are invisible to every other branch; only
  #    entries created on the DEFAULT branch are readable fleet-wide. All 15
  #    active cache entries on this repo were `ref=refs/heads/master`. Delete the
  #    master trigger outright and no PR could ever restore a warm cache again --
  #    a change that reads as a pure saving and is in fact the opposite.
  #
  # The cron therefore has to run to COMPLETION, which is what the
  # `cancel-in-progress` expression below guarantees by excluding non-PR events.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  schedule:
    - cron: '23 1 * * *' # nightly 01:23 UTC — off the on-the-hour surge, and clear
                         # of gpu-conformance (00:47) and cross-vendor (03:47).
  workflow_dispatch:
    inputs:
      force_hosted:
        # The parity A/B for the self-hosted routing (#1015): dispatch twice on
        # one commit, once each way, and diff the two runs' pass/fail sets. Only
        # the three Linux sanitizer jobs read it; it can only move a job OFF the
        # box, so it is safe to leave exposed.
        description: 'Run the Linux sanitizer jobs on GitHub-hosted ubuntu-24.04 even when the self-hosted box is enabled'
        type: boolean
        default: false
      only:
        # ONE SANITIZER PER DISPATCH, for a diagnosis loop. Every other job is
        # skipped at its gate, so a TSan-only run on a warm cache is ~20 min and
        # banks one sccache entry on the dispatching ref instead of four -- which
        # matters on a branch, where nothing prunes those entries until the branch
        # dies (#1111 was diagnosed this way). Default runs everything.
        description: 'Run only this sanitizer job (and its shards)'
        type: choice
        options: [all, asan-lsan, ubsan, tsan, asan-windows]
        default: all

concurrency:
  # The `force_hosted` input is PART OF THE KEY, not decoration. The parity A/B
  # dispatches this workflow TWICE on one commit, once each way, and a group that
  # ignores the input puts both arms in the same bucket -- where GitHub keeps at
  # most one PENDING run and silently cancels the other. The first attempt at the
  # A/B lost its routed arm exactly this way and looked like an infrastructure
  # flake. Keyed on the input, the two arms are independent runs.
  # `only` is in the key for the same reason `force_hosted` is (below): a TSan-only
  # dispatch fired beside a full one on the same ref must not cancel it.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.force_hosted || 'default' }}-${{ github.event.inputs.only || 'all' }}
  # PULL REQUESTS ONLY. A cancelled run banks no cache -- `actions/cache/save` runs
  # `if: always()`, which survives a cancel, but the run still stops mid-build, so
  # what it banks is a partial snapshot at best. The nightly is this workflow's only
  # default-branch cache producer (see the trigger note above), so it must never be
  # cancellable. Under the old expression a `push` run was cancellable too, which is
  # how the master sccache snapshot came to be six days stale while every PR run
  # restored it and reported a 0% hit rate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # sccache uses a LOCAL-DISK cache (SCCACHE_DIR), persisted across runs as a
  # SINGLE actions/cache entry PER JOB (see each job's "Restore/Save sccache
  # storage" steps). We deliberately do NOT use sccache's GitHub Actions cache backend
  # (SCCACHE_GHA_ENABLED): it stores one cache entry PER OBJECT FILE, which
  # flooded the repo's 10 GB Actions-cache cap with 20k+ tiny entries and made
  # EVERY write fail (observed write-errors == misses on all four jobs, hit rate
  # then frozen/decaying). One bounded local-disk dir per job stays under the
  # cap. The -fsanitize=address|undefined|thread flag is part of each compile
  # command line (and so part of sccache's hash), so the per-sanitizer object
  # sets stay distinct; the actions/cache KEY below is also per-sanitizer so the
  # four jobs never clobber each other's snapshot.
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  # Bound the on-disk cache so each saved actions/cache entry stays small — all
  # caches (the four sccache dirs here, Windows.yml's, Vulkan, FFmpeg) share the
  # repo's single 10 GB Actions-cache cap.
  SCCACHE_CACHE_SIZE: "1500M"
  # NEVER let the sccache server time out. This is the whole of #1082's crash, and it
  # is not what the crash was believed to be for two months.
  #
  # sccache's server exits after SCCACHE_IDLE_TIMEOUT seconds without a client request
  # (`DEFAULT_IDLE_TIMEOUT: u64 = 600` in its src/server.rs). LINK STEPS DO NOT GO
  # THROUGH SCCACHE, so a link longer than ten minutes is ten minutes of silence, and
  # the server shuts down in the middle of a running build. The next compile then
  # connects to the socket the exiting server still holds and is dropped mid-handshake:
  #
  #     sccache: error: failed to execute compile
  #     caused by: error reading compile response from server
  #     caused by: Failed to read response header
  #     caused by: An existing connection was forcibly closed by the remote host.
  #                (os error 10054)
  #
  # sccache recovers from "no server running" by starting one. It does not recover from
  # "server accepted my connection and then closed it", so this kills the build.
  #
  # MEASURED ON RUN 34048670103, which reproduced it exactly:
  #
  #     [1593/1596] Linking CXX static library ...   19:41:05
  #     [1594/1596] Building CXX ...                 19:54:18   <- 13m 13s later, dead
  #
  # 793 s of link against a 600 s timeout. `sccache --show-stats` immediately afterwards
  # reported "Compile requests 0" -- not 1593 -- because it had started a BRAND NEW
  # server; that zero is the proof the original one was gone rather than merely unhappy.
  #
  # This retires the folklore in d93b5af5b, which blamed "an extra in-memory consumer
  # that tips the huge instrumented TUs over" and named GameNetworkingSockets. The TU
  # that died here is OloEditor/src/MCP/McpFieldRegistry.cpp: 100 lines, 5 KB, entirely
  # unremarkable. It was not big. It was merely THE FIRST COMPILE AFTER A LONG LINK.
  # That also explains the observation that made the memory theory convincing -- three
  # retries each dying on a different TU. Every retry resumes near the end of the build,
  # which is where the long links are, so each one hit the same race at whatever TU
  # happened to follow the next >10-minute link.
  #
  # Set for all four sanitizer jobs, not just the Windows one. The race needs only a
  # slow link, and every job here links sanitizer-instrumented binaries.
  SCCACHE_IDLE_TIMEOUT: "0"

  # ONE DEFINITION OF WHAT THE WINDOWS ASan RUN EXCLUDES (#1083). It is read in three
  # places -- the `ctest -N` total in the build job, each shard's `ctest -N` count,
  # and each shard's actual run -- and the coverage proof compares the first against
  # the sum of the second. A shard filtering differently from the total would present
  # as an arithmetic failure with no obvious cause, so the regex cannot be allowed to
  # exist in three copies. The reasoning for each exclusion is on the run step.
  # THE LLVM VERSION THE THREE LINUX sccache KEYS CARRY (#1095), in ONE place.
  # sccache hashes the compiler binary into every key, so an entry taken with a
  # different clang is a guaranteed miss that still restores, still downloads 1.2 GB
  # and still holds quota -- the exact 0.00 % this issue is about. Putting the version
  # in the key makes a toolchain bump a deliberate, reviewable commit instead of a run
  # that quietly returns nothing.
  #
  # It was NINE literals (a restore key, a restore-keys prefix and a save key for each
  # of the three jobs) and is now one, because a bump that moves setup-linux-build and
  # forgets these keys reintroduces the bug it fixes. Move it WITH the version/sha256
  # inputs in .github/actions/setup-linux-build; the full bump checklist is in
  # docs/ops/self-hosted-linux-toolchain.md.
  OLO_LINUX_LLVM_VERSION: "23.1.0"
  OLO_ASAN_WINDOWS_CTEST_EXCLUDE: '^NetworkIntegrationTest\.|^WorkerRestartTest\.'

permissions:
  contents: read
  # dorny/paths-filter@v4 falls back to the GitHub REST API for PR-base
  # detection on forks / when the git shallow-clone lacks the base commit,
  # which needs pull-requests: read. Granting it here keeps the detect-changes
  # job working even when the default GITHUB_TOKEN has PR scope stripped.
  pull-requests: read

jobs:
  detect-changes:
    name: Detect sanitizer-relevant changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      # THE ONE PLACE THE LINUX ROUTING DECISION IS MADE (#1083 for Linux).
      #
      # The three Linux sanitizer jobs each carry a byte-identical `runs-on`
      # expression, with a comment on two of them begging the next editor to keep
      # them in step. Sharding needs the SAME predicate a fourth and fifth time --
      # once to size the matrix, once to decide whether to stage an artifact at all --
      # so it is computed once here and read as an output instead.
      linux-self-hosted: ${{ steps.linuxplan.outputs.self-hosted }}
      linux-shards: ${{ steps.linuxplan.outputs.shards }}
      linux-shard-matrix: ${{ steps.linuxplan.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    # PULL REQUESTS ONLY. paths-filter derives its comparison base from the event
    # payload; a `schedule` run has neither a PR base nor a push before/after pair,
    # so it has nothing to diff against. The build jobs' `if` below reads
    # "not a pull_request OR the filter said native", so a nightly runs everything
    # unconditionally, which is what a nightly is for.
    - name: Detect changed paths
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: |
          native:
            - '**/*.c'
            - '**/*.cc'
            - '**/*.cpp'
            - '**/*.cxx'
            - '**/*.h'
            - '**/*.hpp'
            - '**/*.hh'
            - '**/*.hxx'
            - '**/*.ixx'
            - '**/*.cppm'
            - '**/*.glsl'
            - '**/CMakeLists.txt'
            - 'cmake/**'
            - '.github/actions/**'
            - '.github/workflows/asan.yml'
            # The shard coverage proof and the artifact's DLL staging are part of this
            # gate (#1083); a change to either has to run the jobs it guards.
            - 'scripts/verify_test_shards.py'
            - 'scripts/Copy-ImportedDlls.ps1'
            - '.github/sanitizer-suppressions/**'

    # SHARD ONLY WHERE THERE ARE RUNNERS TO ABSORB IT.
    #
    # Sharding is not free parallelism -- it is parallelism IF a runner slot exists
    # per shard. The hosted arm has effectively unbounded slots, so 4 shards run
    # four-wide. The self-hosted box does not: the `olo-ci` label was served by TWO
    # runners and, measured 2026-09-07, by ONE (olo-ci-2 offline). Three sanitizer
    # jobs already serialise there; splitting each into four would serialise TWELVE
    # and hand the whole win back, plus an artifact round-trip per shard.
    #
    # So the box keeps the monolithic build-and-test job it has today, byte for byte,
    # and only the hosted arm shards. `shards == 1` is the signal for that: the build
    # job runs ctest itself and stages nothing.
    #
    # WHY 4 ON HOSTED. Measured on run 34108719319 (ASan + LSan, hosted): build 63 min,
    # tests 48 min. Four shards take the test half to ~12 min against an artifact
    # round-trip measured at 0.1 min each way on the Windows shards -- so the fixed
    # cost is noise and the ceiling is the 63-minute build, which is #1095's problem,
    # not this one's.
    - name: Plan the Linux sanitizer sharding
      id: linuxplan
      shell: bash
      env:
        # Byte-identical to the `runs-on` expression on the three Linux jobs. It is
        # written here ONCE and those jobs still carry their own copy, because
        # `runs-on` cannot read a `needs` output on the job that produces it without
        # making every sanitizer job wait on this one -- which they already do.
        SELF_HOSTED: ${{ vars.OLO_LINUX_SELF_HOSTED == 'true'
                         && github.event.inputs.force_hosted != 'true'
                         && github.event_name != 'schedule'
                         && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      run: |
        set -euo pipefail
        if [ "${SELF_HOSTED}" = "true" ]; then
          shards=1
          matrix='[1]'
        else
          shards=4
          matrix='[1,2,3,4]'
        fi
        {
          echo "self-hosted=${SELF_HOSTED}"
          echo "shards=${shards}"
          echo "matrix=${matrix}"
        } >> "$GITHUB_OUTPUT"
        echo "Linux sanitizer plan: self-hosted=${SELF_HOSTED}, ${shards} shard(s), matrix=${matrix}"

  asan-windows:
    # " build" since #1083: this job no longer runs the suite, it builds the tree the
    # `ASan (Windows) tests N/4` jobs execute. The name says so, because a check named
    # for a sanitizer run that only compiles is exactly the kind of green nobody reads
    # twice.
    name: ASan (Windows/clang-cl) build
    needs: detect-changes
    if: ${{ (github.event_name != 'pull_request' || needs.detect-changes.outputs.native == 'true')
        && (github.event.inputs.only == '' || github.event.inputs.only == 'all' || github.event.inputs.only == 'asan-windows') }}
    # SELF-HOSTED WHEN THE CODE IS OURS AND THE SWITCH IS ON (#1076) -- the same
    # expression, the same kill switch and the same fork boundary as Windows.yml's
    # `build` job, whose comment owns the reasoning. DEFAULT OFF: the variable is
    # unset and no Windows runner is registered, so every run today lands on
    # windows-2025 exactly as before.
    #
    # windows-2025 is PINNED rather than windows-latest on the hosted arm: sccache
    # hashes the compiler binary into every cache key, so an image roll invalidates
    # the entire cache in one step -- silently, because it still restores and the
    # build still goes green. The key below carries the image string for the same
    # reason; when `runs-on` is bumped, bump it with it.
    runs-on: ${{ vars.OLO_WINDOWS_SELF_HOSTED == 'true'
                 && github.event_name != 'schedule'
                 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                 && fromJSON('["self-hosted","windows","x64","olo-ci-win"]') || 'windows-2025' }}

    # The unsharded case count, measured after the build and consumed by
    # `asan-windows-tests-verify` (#1083). It is a JOB OUTPUT rather than a file in
    # the test-tree artifact so that the coverage proof reads it from the job that
    # measured it, not from the same artifact the shards were fed -- a number that
    # travels with the thing it is meant to check is not a check.
    outputs:
      ctest-total: ${{ steps.ctest-total.outputs.total }}

    permissions:
      # Job-level permissions replace the workflow-level block entirely, so
      # contents: read is re-declared here. Without it actions/checkout would fail on
      # fork PRs.
      #
      # NO `checks: write` any more (#1083). It was here for dorny/test-reporter, and
      # the reporter moved to `asan-windows-tests-verify` with the test run. A
      # permission kept past the step that needed it is a permission nobody will ever
      # remove.
      contents: read
      # Needed by the sccache save (#1082, same reason as Windows.yml and the Linux
      # sanitizer jobs): when the repo's Actions cache store is full every save is
      # refused, and the only way to land this job's snapshot is to delete the entry
      # it supersedes first. Scoped to this ref by `save-cache-pruned`.
      actions: write

    env:
      # OVERRIDES the workflow-level 1500M (#1082). This job's objects are the
      # largest in the fleet: ASan instrumentation plus /Z7 (the compiler cache
      # switches MSVC debug info from a shared PDB to embedded — see
      # cmake/CompilerCache.cmake) makes every .obj carry its own debug info.
      # MEASURED, not guessed. The provisional value was 3G, chosen so the first
      # successful run could report this job's real footprint instead of being
      # capped at whatever was reserved. Run 34061407329 answered it:
      #
      #     Cache size    656 MiB       (du -sm agreed: 660)
      #     Max cache size  3 GiB       -- nowhere near the cap, so nothing evicted
      #
      # Far smaller than the sibling `Windows / build` entry (1825 MiB at a 2G cap,
      # i.e. capped), because this job builds ONLY the OloEngine-Tests target while
      # that one also builds the editor, runtime and server.
      #
      # 1500M leaves ~2.3x headroom for the tree to grow without reserving budget
      # this job does not use. Do not raise it to "be safe": measured entries here
      # land at 82-91 % of their cap when they hit it, so the cap is the bill
      # (docs/agent-rules/actions-cache-budget.md).
      SCCACHE_CACHE_SIZE: "1500M"
      # Disable ASan's ODR-violation checker for every instrumented binary run in
      # this job. Vendored protobuf trips a known false positive — its narrow and
      # wide "." string-literal globals (`"."` vs `L"."`, io_win32.cc vs
      # command_line_interface.cc) get flagged as an odr-violation — which aborts
      # protoc.exe when it runs during the build to generate GNS's .pb.cc, and would
      # likewise abort the instrumented test exe (and its gtest_discover_tests probe)
      # at startup. clang-cl's ASan runtime enforces this check more strictly than
      # MSVC's did, so it only surfaced after #490 switched this job to clang-cl. All
      # other ASan checks (use-after-free, overflow, …) stay on. Steps that set their
      # own ASAN_OPTIONS must re-include detect_odr_violation=0 (step env overrides,
      # it does not merge).
      ASAN_OPTIONS: detect_odr_violation=0

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Python 3.10
      id: py
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Install python dependencies
      run: |
        # jinja2 pinned for githubactions:S8544 (lock resolved versions); bump deliberately.
        python -m pip install jinja2==3.1.6

    - name: Setup Vulkan SDK
      id: vulkan
      uses: ./.github/actions/setup-vulkan

    # This job builds with clang-cl (Clang front-end, MSVC ABI) via the
    # cmake/ClangCLToolchain.cmake toolchain — the same one the local
    # `clangcl-asan` preset uses. clang-cl gives the genuinely Windows-specific
    # coverage that justifies a Windows ASan job (MSVC ABI + MSVC STL + the
    # Windows-only Platform/* code) but runs Clang's more complete ASan runtime
    # instead of MSVC's, and its /Z7 objects cache under sccache (MSVC cl.exe ASan
    # objects did not — see issue #304). clang-cl still needs the MSVC headers,
    # libs, and Windows SDK on the env; ilammy/msvc-dev-cmd runs vcvars and
    # exports them, and also puts the VS-bundled LLVM (clang-cl, lld-link) on PATH.
    # We build with Ninja (not the VS generator) so the sccache compiler launcher
    # engages — the VS/MSBuild generator IGNORES CMAKE_<LANG>_COMPILER_LAUNCHER.
    # (Trade-off, same as Windows.yml: the Ninja path does not build the C#
    # OloEngine-ScriptCore project, but OloEngine-Tests never links that
    # assembly, so ASan coverage is intact.)
    - name: Setup MSVC dev environment
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    # PIN THE LLVM TOOLCHAIN. Without this the job compiled with whatever clang-cl
    # the windows-2025 image happened to ship, via the VS-bundled LLVM that
    # msvc-dev-cmd puts on PATH -- so the sanitizer gate's compiler moved silently
    # whenever GitHub refreshed the image.
    #
    # 23.1.0 specifically, because it FIXES the clang-cl + ASan C++ exception-handling
    # miscompile that cost this job ten test cases (issue #497). ASan put redzones on
    # the compiler-emitted EH metadata globals (_ThrowInfo / _CatchableTypeArray /
    # type descriptors) and the MSVC EH runtime read across them, so any throw that
    # unwound into a catch died. Measured with the three-line repro from #497
    # (`try { throw std::runtime_error{}; } catch (...) {}`, /EHsc /fsanitize=address):
    #
    #   clang 21.1.8 -> AddressSanitizer: access-violation in
    #                   __FrameHandler3::CxxCallCatchBlock, exit 1
    #   clang 23.1.0 -> caught, exit 0
    #
    # (Which major first fixed it was not bisected; 22.x is untested.)
    #
    # Same action and pinning approach as fuzz.yml. It exports LLVM_PATH at the
    # install root, with the binaries under $LLVM_PATH/bin, and caches the download.
    #
    # PATH ORDER IS NOT ENOUGH, and the first attempt at this proved it. That
    # version relied on the action prepending its bin to PATH after msvc-dev-cmd,
    # and asserted "ordering is what makes the pin win". The step went green
    # ("Using cached LLVM and Clang 23.1.0..."), and CMake then reported
    #
    #   -- The CXX compiler identification is Clang 20.1.8 with MSVC-like command-line
    #   -- Check for working CXX compiler: C:/Program Files/LLVM/bin/clang-cl.exe
    #
    # i.e. the windows-2025 image's preinstalled LLVM, not the pin. The nine
    # exception-handling tests then failed exactly as they do on clang 20, which
    # read as "23.1.0 does not fix #497" and was really "the pin was never used".
    #
    # So the pin is bound by ABSOLUTE PATH below, not by PATH order, and the next
    # step FAILS THE JOB if the resolved clang-cl is not the pinned major. Without
    # that assertion this failure mode is invisible: a green install step, a
    # successful build, and a wrong compiler.
    # Installed and VERIFIED by a shared composite action rather than inline or
    # via KyleMayes/install-llvm-action -- see
    # .github/actions/setup-llvm-windows/action.yml for why that action cannot do
    # this (its Windows asset table stops at 21.1.8) and for the two green-but-wrong
    # attempts that preceded it. fuzz.yml uses the same action, so the two Windows
    # clang-cl jobs cannot drift apart.
    #
    # It exports LLVM_PATH plus OLO_CLANG_CL / OLO_LLD_LINK / OLO_LLVM_RC as
    # absolute paths for the configure line below, and FAILS THE JOB if the
    # resolved clang-cl is not the requested major.
    - name: Install LLVM (pinned)
      uses: ./.github/actions/setup-llvm-windows
      with:
        version: "23.1.0"
        sha256: "1aebf024b959b3835c3bd936da2fa58cd002c61ccf47fce1714447b900bd9837"

    # RE-ADDED BY #1082, after d93b5af5b removed it on 2026-07-02. The removal was
    # sound about the symptom and wrong about the cause, and the cause is now known:
    # the sccache server was idling out during long link steps. The mechanism, the
    # measurement and the fix all live on SCCACHE_IDLE_TIMEOUT in the workflow `env`
    # block at the top of this file. Read that before touching anything here.
    #
    # Two beliefs died with it, both worth naming so they are not rediscovered:
    #
    #   "A NEWER SCCACHE MIGHT FIX IT." There was never a version delta to test.
    #   d93b5af5b was ALREADY pinned to v0.15.0, which is still the fleet pin --
    #   the issue's premise that "the removal predates several releases" is simply
    #   not what the diff says. v0.17.0's client-side mode (SCCACHE_CLIENT_SIDE) was
    #   the planned second arm on the theory that the server was running out of
    #   memory. It is not needed: the server was not out of memory, it was gone.
    #
    #   "IT IS THE HUGE INSTRUMENTED GNS TUs." The TU that died on the reproduce run
    #   was OloEditor/src/MCP/McpFieldRegistry.cpp -- 100 lines, 5 KB. Size had
    #   nothing to do with it.
    #
    # A RETRY WRAPPER IS STILL THE WRONG ANSWER, for a new reason. d93b5af5b's retry
    # failed because each attempt resumed near the end of the build and met the next
    # long link, so it re-armed the same race every time. With the timeout disabled
    # there is nothing left to retry.
    # SCCACHE_DIR is a WORKSPACE path and actions/checkout wipes the workspace, so on
    # a persistent runner it has to move out of the way or the cache is discarded on
    # every checkout while looking perfectly healthy. Same step, same reasoning, as
    # Windows.yml's -- read the longer note there, including the per-user-daemon
    # constraint it puts on provisioning.
    - name: Point sccache at persistent disk (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $dir = Join-Path $env:USERPROFILE '.cache\olo\sccache-asan'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        "SCCACHE_DIR=$dir" >> $env:GITHUB_ENV
        Write-Host "persistent sccache: $dir"

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.15.0"

    # Explicit restore + an `if: always()` save after the build, not the combined
    # action — same reasoning as every other job here (#1009; see the save step).
    # The key carries the runner IMAGE and the SANITIZER: sccache hashes the
    # compiler binary, so a windows-2025 image roll invalidates every entry while
    # still restoring it, and `-fsanitize=address` is part of the command line, so
    # this job's objects can never collide with `sccache-windows-2025-release-`.
    # When `runs-on` is bumped, bump this string with it.
    #
    # AND IT CARRIES THE VULKAN SDK VERSION, for the same reason the Linux keys carry
    # `llvm-<version>`: PIN WHATEVER THE KEY IS HASHED OVER. sccache hashes the
    # preprocessed output, so every TU that reaches a Vulkan header changes when the
    # SDK does. Measured on PR #1112 (run 34166829499), which bumps the SDK: the entry
    # restored cleanly and the build still took 2 h 06 at 42.17 % -- 923 misses of 1588,
    # about the share of this target that reaches a Vulkan header. Its log has the tell,
    # `Found Vulkan ... found version "1.4.357"` under a `-1.4.321.0` cache key.
    #
    # THAT RUN LOOKED LIKE A CAPACITY PROBLEM AND WAS NOT. Its stats read "Cache size
    # 1 GiB / Max cache size 1 GiB", which is the whole reason to distrust that pair:
    # sccache ROUNDS, and this job's set measures 1241 MiB by `du -sm` against a 1500M
    # cap. Two dispatches on identical source, one at 1500M and one at 3G, both returned
    # 99.87 % and 12-13 min (runs 34206210094 / 34203502889). The cap has 259 MiB spare
    # and raising it buys nothing.
    #
    # `restore-keys` carries the version too, deliberately. A bare
    # `sccache-asan-windows-2025-` fallback would keep finding the pre-bump entry and
    # reproduce exactly the half-stale restore above. The cost is ONE cold build per SDK
    # bump, taken visibly instead of as a mystery 42 % -- and cache-prune.yml strips the
    # `-vk<version>` segment when it groups, so the bump supersedes the old entry rather
    # than orphaning 1230 MiB of it for thirty days.
    - name: Restore sccache storage
      # HOSTED ONLY (#1076): a persistent runner keeps SCCACHE_DIR on local disk, with
      # no upload, no download, no slice of the shared cap and no post-job save for a
      # cancellation to skip.
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-asan-windows-2025-vk${{ steps.vulkan.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          sccache-asan-windows-2025-vk${{ steps.vulkan.outputs.version }}-

    - name: Setup vcpkg
      id: vcpkg
      uses: ./.github/actions/setup-vcpkg
      with:
        triplet: x64-windows-static-md

    - name: Configure CMake (ASan enabled)
      # --toolchain cmake/ClangCLToolchain.cmake: build with clang-cl + lld-link
      #   (Clang front-end, MSVC ABI) — same toolchain as the local clangcl-asan
      #   preset. CMake reports clang-cl as MSVC, so cmake/Sanitizers.cmake takes
      #   the /fsanitize=address + /MD + /INCREMENTAL:NO path automatically.
      # -G "Ninja Multi-Config": the build/ctest steps select Release via --config / -C.
      #   (Also avoids the VS/MSBuild generator, which would drag in the C# ScriptCore
      #   project; OloEngine-Tests never links it, so ASan coverage is intact.)
      # -DOLO_ENABLE_COMPILER_CACHE=ON (#1082): wires sccache as the launcher. Read the
      #   header on the Setup sccache step above for why this was off, and what changed.
      #   Two side effects come with it, both from cmake/CompilerCache.cmake, and the
      #   first makes a COLD build here SLOWER than the uncached one it replaces:
      #     - PCH is forced off (sccache reports a /Yu compile non-cacheable), so a cold
      #       run pays full per-TU header re-parsing that the 87.2 min baseline did not.
      #       (Unity builds are forced off too, but OLO_ENABLE_UNITY_BUILD already
      #       defaults OFF, so that one is a no-op for this job.)
      #     - MSVC debug info switches /Zi -> /Z7, so each .obj carries its own debug
      #       info and is self-contained enough to cache. That is what makes this
      #       job's objects the largest in the fleet — see SCCACHE_CACHE_SIZE above.
      #   The trade is deliberate and is the same one Windows.yml already took: the
      #   cache optimizes the WARM case, which is every run after the nightly has
      #   banked a master snapshot. Judge it on the warm hit rate, never on one run.
      # -DOLO_ENABLE_LTO=OFF: Release defaults LTO on; /GL + ASan is unsupported. CI binaries
      #   are for testing, not shipping, so dropping LTO is free here. It also keeps /GL
      #   away from sccache, which cannot cache an object compiled with it.
      run: >
        cmake -S . -B build
        -G "Ninja Multi-Config"
        ${{ steps.vcpkg.outputs.toolchain-args }}
        "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/ClangCLToolchain.cmake"
        "-DCMAKE_C_COMPILER=${{ env.OLO_CLANG_CL }}"
        "-DCMAKE_CXX_COMPILER=${{ env.OLO_CLANG_CL }}"
        "-DCMAKE_LINKER=${{ env.OLO_LLD_LINK }}"
        "-DCMAKE_RC_COMPILER=${{ env.OLO_LLVM_RC }}"
        -DOLO_VIDEO_FFMPEG=OFF
        -DOLO_WITH_USD=OFF -DOLO_WITH_ALEMBIC=OFF -DOLO_WITH_MATERIALX=OFF
        -DOLO_ENABLE_LTO=OFF
        -DOLO_ENABLE_COMPILER_CACHE=ON
        -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}"
        -DOLO_ENABLE_ASAN=ON
        -DBUILD_TESTS=ON

    - name: Add clang-cl ASan runtime to PATH
      shell: pwsh
      # clang-cl links the dynamic ASan runtime, so anything built with ASan needs
      # clang_rt.asan_dynamic-x86_64.dll on PATH when it RUNS — including instrumented
      # vendored host tools that execute during the build itself (e.g. protobuf's
      # protoc.exe, run to generate .pb.cc). GITHUB_PATH only affects later steps, so
      # this must run BEFORE Build, not just before the tests. The DLL ships next to
      # the clang-cl used for the build; `clang-cl -print-runtime-dir` (LLVM >= 16)
      # reports that directory. Use the same clang-cl that PATH resolves to (the one
      # CMake built with) so the DLL version matches the instrumented objects.
      run: |
        $dll = 'clang_rt.asan_dynamic-x86_64.dll'
        # -print-runtime-dir is the intended query, but newer LLVM reports a
        # per-target dir (lib/<triple>) that may not exist, while older LLVM
        # reports lib/windows. Probe both and use whichever actually holds the DLL
        # (mirrors the same resolution in cmake/Sanitizers.cmake).
        $candidates = @(
          (& clang-cl -print-runtime-dir).Trim(),
          (Join-Path (& clang-cl -print-resource-dir).Trim() 'lib/windows')
        )
        $rtDir = $candidates | Where-Object { $_ -and (Test-Path (Join-Path $_ $dll)) } | Select-Object -First 1
        if (-not $rtDir) {
          Write-Error "ASan runtime DLL '$dll' not found. Checked: $($candidates -join '; ')"
          exit 1
        }
        Write-Host "clang-cl ASan runtime dir: $rtDir"
        echo "$rtDir" >> $env:GITHUB_PATH
        # Also exported as a variable because the test SHARDS (#1083) run in
        # separate jobs that never install LLVM: the packaging step below copies
        # this DLL next to the instrumented exe so a shard needs nothing but the
        # artifact. GITHUB_PATH would not survive the job boundary; a DLL beside
        # the exe does, and Windows resolves it from there first.
        echo "OLO_ASAN_RUNTIME_DIR=$rtDir" >> $env:GITHUB_ENV

    # The other half of setup-vcpkg's restore/save split (#1009). `if: always()`
    # is the whole point: the combined actions/cache action saves in a POST-JOB
    # step, which a CANCELLED job skips -- and most PR runs here are cancelled.
    # Placed before the build so a cancellation during the long build/test tail
    # still banks the ports this run just spent ~40 minutes installing.
    - name: Save vcpkg binary cache
      if: always()
      # A cache save must never fail the job it is attached to. `if: always()`
      # means this runs on a CANCEL, where the path it is asked to save may not
      # exist yet -- and actions/cache/save treats a missing path as a validation
      # error, not a no-op. Turning a cancelled run into a FAILED one would be a
      # strictly worse outcome than the cold cache this is fixing.
      continue-on-error: true
      uses: ./.github/actions/save-vcpkg-cache
      with:
        key: ${{ steps.vcpkg.outputs.cache-key }}
        path: ${{ steps.vcpkg.outputs.cache-path }}

    - name: Build (Release)
      # --parallel 2 matches the Linux sanitizer jobs: clang-cl under ASan uses several GB per
      # translation unit, and full concurrency exhausts runner memory on the largest instrumented
      # TUs (GameNetworkingSockets' steamnetworkingsockets_*.cpp).
      #
      # NO RETRY WRAPPER, deliberately (#1082). d93b5af5b removed one that retried on the
      # "os error 10054" sccache-server-drop signature, having measured that it hit the
      # crash on all three attempts. Re-adding it here would convert the reproduce arm's
      # answer from "it crashed, on this TU" into "it went red after 3× the runner
      # minutes", which is strictly less information for strictly more cost. If the crash
      # does come back, the fix is the client-side mode named on the Setup sccache step,
      # not a retry that was already measured not to work.
      run: cmake --build build --config Release --target OloEngine-Tests --parallel 2

    # THE NUMBER THIS CHANGE IS JUDGED ON, and it is printed unconditionally because a
    # cache that restores and hits on nothing looks exactly like a working one — that is
    # the whole of docs/agent-rules/ci-cache-that-looks-alive.md. Two lines matter beyond
    # the hit rate on this job specifically:
    #   "Non-cacheable compilations" — whether clang-cl's ASan flags are cacheable at all;
    #   "Cache size" vs "Max cache size" — whether SCCACHE_CACHE_SIZE above is evicting,
    #     which silently caps the achievable hit rate no matter how warm the restore was.
    # `if: always()` so a build that DID crash still reports where it got to.
    - name: Show sccache stats
      if: always()
      run: sccache --show-stats

    # THE SIZE THIS ENTRY WILL COST THE STORE, measured off the directory rather than
    # asked of sccache. `--show-stats` cannot answer it reliably: if the server has
    # exited, the client silently STARTS A NEW ONE and reports its zeros instead --
    # which is exactly what happened on run 34048670103 ("Compile requests 0" after
    # 1593 successful compiles). The directory is on disk either way.
    #
    # Needed because SCCACHE_CACHE_SIZE above is provisional (#1082): this job's
    # objects carry embedded /Z7 debug info on top of ASan instrumentation, and the
    # compressed actions/cache entry lands at 82-91 % of the cap, so the cap has to be
    # set from a real footprint before this is charged to a shared ~9.3 GiB store.
    - name: Measure the sccache directory
      if: always()
      shell: bash
      run: |
        du -sm "${SCCACHE_DIR}" 2>/dev/null || echo "SCCACHE_DIR not present"

    # Paired with the restore above. `if: always()` because the combined actions/cache
    # action saves in a POST-JOB step, which a CANCELLED job skips — and most PR runs in
    # this repo are cancelled (`cancel-in-progress`), so every one of them recompiled
    # everything and banked nothing.
    #
    # NOT ON PULL REQUESTS (#1073's rule, and this job is the reason it is now load-
    # bearing). A PR-run entry is scoped to `refs/pull/N/merge`, readable by that one PR,
    # and charged to the whole repository for as long as the PR stays open. This is the
    # FOURTH large Windows entry in a store with a ~9.3 GiB wall; see the arithmetic in
    # docs/agent-rules/actions-cache-budget.md, which this change had to re-do before
    # turning the cache on. The save is kept on `workflow_dispatch` so the cold/warm A/B
    # can be measured on a branch — that is how #1073 was verified and how this was.
    - name: Save sccache storage
      if: always() && runner.environment == 'github-hosted' && github.event_name != 'pull_request'
      # `save-cache-pruned` swallows its own failures: a cache save must never fail the
      # job it is attached to. `if: always()` means it also runs on a CANCEL, where the
      # path may not exist yet, and actions/cache/save treats a missing path as a
      # validation error rather than a no-op. What it adds over a bare save is noticing
      # that the store REFUSED the write (which `actions/cache/save` reports as a warning
      # and exits zero for), deleting this ref's superseded entries, and retrying.
      uses: ./.github/actions/save-cache-pruned
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-asan-windows-2025-vk${{ steps.vulkan.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # ---------------------------------------------------------------- #1083
    #
    # THE TEST RUN LEFT THIS JOB. It used to be a `Run tests under ASan` step here
    # that took 89.0 MINUTES of a 236-minute job (measured, #1084's table). It is now
    # the `asan-windows-tests` matrix below: this job builds and hands the
    # instrumented tree over, and N separate runners each execute a stride of it.
    #
    # WHY SHARDING RATHER THAN BATCHING. gtest_discover_tests registers every gtest
    # case as its own ctest entry, so the suite is ~7,600 PROCESS LAUNCHES, each
    # paying full engine static-init. Batching many cases into one process is the
    # bigger win and it REMOVES the isolation that currently hides cross-test state
    # corruption -- that is #1074's territory and must not be done from here.
    # Sharding splits the same one-process-per-case run across more runners and
    # changes the semantics not at all.
    #
    # WHAT IT COSTS. Each shard is a whole runner: it pays job startup, a checkout
    # and an artifact download before it runs a single case. This TRADES
    # RUNNER-MINUTES FOR WALL-CLOCK and the exchange rate is stated on the PR.
    # ---------------------------------------------------------------------------

    # THE NUMBER THE SHARDS HAVE TO ADD UP TO. Measured here, in the job that owns
    # the build, with the same --exclude-regex every shard uses -- so the coverage
    # proof in `asan-windows-tests-verify` compares like with like. `ctest -N` only
    # LISTS: discovery already happened at build time (gtest_discover_tests'
    # POST_BUILD mode writes the entries into the generated *_tests.cmake), so this
    # launches no test process and costs seconds.
    - name: Measure the unsharded case count
      id: ctest-total
      shell: bash
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      run: |
        set -euo pipefail
        listing=$(ctest -N -C Release --exclude-regex "${OLO_ASAN_WINDOWS_CTEST_EXCLUDE}")
        total=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p' | tail -1)
        # A ctest that lists nothing is the same failure archetype the shards guard
        # against, one level up: it would make each shard's "count > 0" check the only
        # thing between a broken discovery and a green matrix.
        #
        # DIGITS-ONLY BEFORE THE NUMERIC COMPARISON, and the order is the whole point:
        # `[ "$x" -le 0 ]` on a non-numeric $x ERRORS rather than returning false, and
        # a command that errors inside an `if` condition is exempt from `set -e` -- so
        # anything that is not a number fell straight through this guard and got
        # published as the total. A guard that exists for the case where discovery
        # printed something unexpected must not be the thing that trusts its output.
        case "${total}" in
          ''|*[!0-9]*) valid=no ;;
          *) if [ "${total}" -gt 0 ]; then valid=yes; else valid=no; fi ;;
        esac
        if [ "${valid}" != yes ]; then
          echo "::error::ctest -N did not report a positive test count (got '${total}'). Discovery did not produce a usable test list, so nothing below can be trusted."
          printf '%s\n' "$listing" | tail -20
          exit 1
        fi
        echo "unsharded ctest entries: ${total}"
        echo "total=${total}" >> "$GITHUB_OUTPUT"

    # THE SHARDS INSTALL NO TOOLCHAIN, so everything they need to RUN the suite has
    # to be inside the artifact. Two things are not there by default:
    #
    #   * clang_rt.asan_dynamic-x86_64.dll. clang-cl links the DYNAMIC ASan runtime,
    #     so the instrumented exe does not start without it. This job has it on PATH
    #     from the LLVM install; a shard job does not, and re-installing a 2 GB LLVM
    #     four times to obtain one DLL would eat the saving. Windows resolves a DLL
    #     from the executable's own directory first, so copying it beside the exe is
    #     both sufficient and version-correct -- it is the runtime of the very
    #     clang-cl that instrumented these objects.
    #   * the workspace path this tree was built at. gtest_discover_tests bakes
    #     ABSOLUTE paths into the generated *_tests.cmake (the exe, and the
    #     WORKING_DIRECTORY that makes assets/shaders resolvable). Both runners are
    #     `windows-2025` checking out the same repository, so the path is identical
    #     in practice -- but "in practice" is exactly the kind of assumption that
    #     turns into a silent 100 %-skip later, so the shard asserts it.
    - name: Package the instrumented test tree
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $outDir = Join-Path '${{github.workspace}}' 'build/OloEngine/tests/Release'
        $dll = Join-Path "$env:OLO_ASAN_RUNTIME_DIR" 'clang_rt.asan_dynamic-x86_64.dll'
        if (-not (Test-Path $dll)) { Write-Error "ASan runtime DLL not at $dll"; exit 1 }
        Copy-Item $dll -Destination $outDir -Force
        Write-Host "copied $(Split-Path -Leaf $dll) next to the test exe"
        & "${{github.workspace}}/scripts/Copy-ImportedDlls.ps1" `
            -Exe (Join-Path $outDir 'OloEngine-Tests.exe') -Destination $outDir
        if ($LASTEXITCODE -ne 0) { throw "could not stage the exe's imported DLLs" }
        # Recorded, not asserted here -- the shard is where a mismatch matters.
        $wsFile = Join-Path '${{github.workspace}}' 'build/OloEngine/tests/olo-build-workspace.txt'
        Set-Content -Path $wsFile -Value '${{github.workspace}}' -NoNewline
        Get-ChildItem $outDir | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.Name }

    # ONLY WHAT CTEST READS. The PDB is deliberately absent: the ASan Release tree's
    # OloEngine-Tests.pdb is the largest single file in the build (the local Debug
    # tree measures ~1.9 GB) and ctest never opens it. The ASan runtime symbolises
    # from it when present, so a failing shard's stack is less readable than the
    # unsharded step's was -- the one real regression in this change, named on the
    # PR. `*.lib` and `CMakeFiles/` are dropped for the same reason.
    #
    # compression-level 1: the exe is a few hundred MB and this transfer happens once
    # up and once per shard down, so it sits directly on the wall-clock this issue is
    # about. Level 1 on an already-packed PE gives up little and is several times
    # faster than the default 6.
    #
    # retention-days 1: this is scratch, not a deliverable. A multi-hundred-MB
    # artifact per run held for 90 days is a storage bill for nothing.
    - name: Upload the instrumented test tree
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: asan-windows-test-tree
        path: |
          build/OloEngine/tests/*.cmake
          build/OloEngine/tests/olo-build-workspace.txt
          build/OloEngine/tests/Release/*.exe
          build/OloEngine/tests/Release/*.dll
        if-no-files-found: error
        retention-days: 1
        compression-level: 1

  # ---------------------------------------------------------------------------
  # #1083: the ASan test run, spread across runners.
  #
  # The stride count lives in TWO places that must agree -- `matrix.shard` below and
  # OLO_CTEST_SHARDS -- because GitHub offers no way to derive one from the other in
  # an expression. That is a real hazard, so it is not defended by a comment: every
  # shard reports the count it believed it was part of, and
  # `asan-windows-tests-verify` fails if they disagree or if 1..N is not exactly
  # covered. Edit one without the other and the matrix goes red, not green.
  #
  # WHY 4. The unsharded step measured 89.0 min. Four shards keeps the per-shard
  # fixed cost (job startup + checkout + artifact download, a few minutes) small
  # against the per-shard test time. The right number is re-measurable from the shard
  # durations in any run; it was NOT tuned by a sweep, because a sweep here costs a
  # full CI round each.
  # ---------------------------------------------------------------------------
  asan-windows-tests:
    name: ASan (Windows) tests ${{ matrix.shard }}/4
    needs: asan-windows
    # THE SHARDS FOLLOW THE BUILD JOB (#1076 x #1083). gtest_discover_tests bakes the
    # absolute exe and WORKING_DIRECTORY paths into the generated test list, so a
    # shard on a different runner kind would be pointing at a path that is not there.
    # The `Assert this runner matches the build job's layout` step turns that into one
    # line; the routing is what prevents it. Four shards want four runner SLOTS -- on
    # a box with fewer they queue and the sharding win is handed back. See the ADR.
    runs-on: ${{ vars.OLO_WINDOWS_SELF_HOSTED == 'true'
                 && github.event_name != 'schedule'
                 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                 && fromJSON('["self-hosted","windows","x64","olo-ci-win"]') || 'windows-2025' }}
    strategy:
      # A red shard must not cancel its siblings. Four shards are four independent
      # samples of the same suite, and cancelling three of them to react to the
      # first failure is how a run comes back knowing about one bug instead of four
      # -- the same reasoning as docs/process/task-loop.md's "do not act on the
      # first red".
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # ONE stride, read by the `ctest -N` count AND by the run below. Keeping them in
      # separate literals is how a shard comes to COUNT one partition and RUN another
      # -- the counts would still add up and a quarter of the suite would never
      # execute. The matrix list is the other half of the pair; `asan-windows-tests-verify`
      # catches a drift between the two.
      OLO_CTEST_SHARDS: 4
      # detect_odr_violation=0 for the same reason as the build job: vendored
      # protobuf trips a known ASan false positive on its narrow/wide "." literals,
      # which aborts the instrumented exe at startup. Repeated on the run step below,
      # because a step-level ASAN_OPTIONS REPLACES this rather than merging.
      ASAN_OPTIONS: detect_odr_violation=0
    steps:
    # The checkout is not optional and it is not for the build: every test's
    # WORKING_DIRECTORY is <workspace>/OloEditor, and the suite loads shaders,
    # scenes and models from the source tree by repo-relative path.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the instrumented test tree
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: asan-windows-test-tree
        path: build/OloEngine/tests

    # THE ASSERTION THE BAKED ABSOLUTE PATHS DESERVE. If the build job's workspace
    # differed from this one's, every add_test() would name an exe that is not there
    # and ctest would fail loudly -- but it would fail thousands of times with a
    # confusing message, and a future runner-image or path change would land as "the
    # ASan tests are all broken" rather than as this one line.
    - name: Assert this runner matches the build job's layout
      shell: bash
      run: |
        set -euo pipefail
        built_at=$(cat build/OloEngine/tests/olo-build-workspace.txt)
        here="${GITHUB_WORKSPACE}"
        # Compare with both separators normalised: GITHUB_WORKSPACE reaches bash as a
        # Windows path here, and the recorded one was written by pwsh.
        if [ "${built_at//\\//}" != "${here//\\//}" ]; then
          echo "::error::This tree was built at '${built_at}' but this runner checked out at '${here}'. gtest_discover_tests bakes absolute paths into the generated test list, so the tree cannot be moved. Run the shards on the same runner image and path as the build job, or re-run discovery here."
          exit 1
        fi
        exe=build/OloEngine/tests/Release/OloEngine-Tests.exe
        test -f "$exe" || { echo "::error::$exe missing from the artifact"; exit 1; }
        test -f build/OloEngine/tests/Release/clang_rt.asan_dynamic-x86_64.dll \
          || { echo "::error::ASan runtime DLL missing from the artifact; the instrumented exe will not start"; exit 1; }
        echo "workspace matches: ${here}"

        # AND PROVE IT STARTS. A missing runtime DLL fails in the OS loader before
        # main(), so it would arrive as ~1,900 identical ctest failures with no
        # message worth reading. One launch, seconds, and the failure names itself.
        # `--gtest_list_tests` pays the same static-init the real cases do and runs
        # no test body.
        if ! "$exe" --gtest_list_tests > /dev/null; then
          echo "::error::$exe does not start on this runner. Either the artifact is missing something it needs at load time (a runtime DLL), or the tree does not match this runner."
          exit 1
        fi
        echo "the instrumented test binary starts here"

    - name: Create test results directory
      run: New-Item -ItemType Directory -Force -Path "${{github.workspace}}/test_results"
      shell: pwsh

    # GUARD 1 OF 2: A SHARD THAT MATCHED NOTHING MUST FAIL. `ctest -I` selects by
    # index, so a stride that does not line up with the list silently produces an
    # empty run -- which passes in about a second and is indistinguishable in the
    # check list from a shard that ran 1,900 cases. The count is also written out
    # for guard 2, the union check in `asan-windows-tests-verify`.
    - name: Select this shard's cases
      id: select
      shell: bash
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      run: |
        set -euo pipefail
        listing=$(ctest -N -C Release \
                    -I "${OLO_CTEST_SHARD},,${OLO_CTEST_SHARDS}" \
                    --exclude-regex "${OLO_ASAN_WINDOWS_CTEST_EXCLUDE}")
        count=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p' | tail -1)
        # Digits-only before the numeric comparison -- see the same guard on the build
        # job's total. `[ "$x" -le 0 ]` errors on a non-number and an erroring `if`
        # condition is exempt from `set -e`, so garbage would pass this check and then
        # be written into the shard count the coverage proof adds up.
        case "${count}" in
          ''|*[!0-9]*) valid=no ;;
          *) if [ "${count}" -gt 0 ]; then valid=yes; else valid=no; fi ;;
        esac
        if [ "${valid}" != yes ]; then
          echo "::error::shard ${OLO_CTEST_SHARD}/${OLO_CTEST_SHARDS} did not match a positive number of ctest entries (got '${count}')."
          printf '%s\n' "$listing" | tail -20
          exit 1
        fi
        echo "shard ${OLO_CTEST_SHARD}/${OLO_CTEST_SHARDS}: ${count} ctest entries"
        mkdir -p "${GITHUB_WORKSPACE}/shard_counts"
        {
          echo "shard=${OLO_CTEST_SHARD}"
          echo "shards=${OLO_CTEST_SHARDS}"
          echo "count=${count}"
        } > "${GITHUB_WORKSPACE}/shard_counts/shard-${OLO_CTEST_SHARD}.txt"
      env:
        OLO_CTEST_SHARD: ${{ matrix.shard }}

    - name: Run tests under ASan
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      # The SteamNetworkingSockets service thread used to trip a stack-buffer-overflow
      # under ASan during thread bootstrap (a 48-byte read from a 24-byte `info`
      # stack object inside vendored GNS code on the GNS-spawned thread; Release ICF
      # folding misreported the frames as `SteamNetworkingSockets_*` /
      # `pugi::xpath_*`). It was worked around by skipping the live
      # GameNetworkingSockets_Init under OLO_ASAN_ENABLED, which bought a green job
      # at the cost of never sanitizing the transport.
      #
      # FIXED UPSTREAM: ValveSoftware/GameNetworkingSockets#418, by PR #420 (merged
      # to master 2026-08-24). The overlay port now pins a post-1.6.0 master
      # snapshot carrying it (cmake/overlay-ports/gamenetworkingsockets/portfile.cmake
      # -- v1.6.0 is still the newest tag and predates the fix), and both the
      # NetworkManager::Init gate and ServerAuthoritativeLoopTest's GTEST_SKIP are
      # gone, so the live init runs here and ServerAuthoritativeLoopTest's 17 cases
      # execute instead of skipping.
      #
      # BE PRECISE ABOUT WHAT THAT COVERS. GNS is a vcpkg port built with cl.exe and
      # no sanitizer flags -- see the triplet note on the vcpkg step in the build job,
      # "vcpkg ports are NOT sanitizer-instrumented", which is deliberate. So ASan
      # instruments the engine and the test process, NOT GNS internals: allocations
      # and interceptors crossing the boundary are covered, stack and global redzones
      # inside GNS are not. What this change buys is sanitizer coverage of OloEngine's
      # own networking code against a LIVE transport -- NetworkManager init/shutdown,
      # NetworkThread, dispatch, replication -- all of which previously never executed
      # under ASan at all. It does not re-arm detection of #418-class faults inside
      # GNS; that would need an instrumented GNS build, which this job explicitly does
      # not want. If these tests regress, the fix is to move the pin, not to bring the
      # gate back.
      #
      # The Task* and Shader* suites were excluded here on a since-disproven "the
      # task system starts the Steam service thread" theory -- they never touched
      # GNS (the ICF-folded stacks just looked like it) and all pass under MSVC
      # ASan, so they are no longer excluded. See issue #317.
      #
      # Remaining exclusions live in OLO_ASAN_WINDOWS_CTEST_EXCLUDE at the top of this
      # file -- ONE definition, read by this step and by the `ctest -N` total the
      # coverage proof compares against, because a shard filtering differently from
      # the total is a coverage hole that presents as an arithmetic bug. They match
      # the Linux ASan job exactly:
      #   NetworkIntegrationTest -- needs real client/server socket plumbing that CI
      #     environments do not provide; excluded on EVERY job in this repo, the
      #     non-sanitizer ones included (Windows.yml, gpu-conformance-amd.yml). Not
      #     related to the removed ASan gate, and not something the GNS pin changes.
      #   WorkerRestartTest -- a tight 100-iteration worker-pool teardown/recreate
      #     stress test that exceeds the 120 s timeout under sanitizer
      #     instrumentation; excluded on every sanitizer job.
      #
      # --parallel 4, RAISED FROM 2 ON A MEASUREMENT (#1083), not on the theory that
      # made 2 look conservative. Every gtest case is its own ctest entry
      # (gtest_discover_tests), so the suite is ~7,600 process launches each paying
      # full engine static init, and the standing hypothesis was that a workload that
      # startup-bound would scale well past the runner's 4 vCPUs. IT DOES NOT.
      #
      # Six timed passes over the same 380-case sample in ONE job on run 34061407329,
      # in palindrome order (2,3,4,4,3,2) so the cold-start warm-up is shared equally
      # rather than credited to the last width tried:
      #
      #     width 2   254.0 / 255.6 s     --
      #     width 3   236.5 / 237.1 s     -7.1 %
      #     width 4   216.4 / 218.5 s    -14.7 %
      #
      # Doubling the width buys ~15 %, not the ~2x "startup-bound" predicted. So this
      # is much closer to CPU/memory-bandwidth bound than to launch-latency bound, and
      # anyone tempted to go wider again should re-measure rather than reason. THAT
      # MEASUREMENT IS ALSO WHY SHARDING IS THE REMAINING LEVER: a step that is
      # CPU-bound on a 4-vCPU runner does not get much faster by asking that runner
      # for more, it gets faster by adding runners.
      # 100 % passed at every width -- 380 of 380, six passes, zero flakes -- so the
      # raise costs no stability at this width.
      #
      # THE OLD CAP WAS AN ASSUMPTION. It read "capped at 2 (not 4) because ASan shadow
      # memory inflates each test process's resident footprint; 2-wide stays comfortably
      # inside the windows-2025 ~16 GB budget" -- plausible, and never measured. 4-wide
      # ran 380 instrumented cases for 216 s without incident. If a future run does
      # start OOMing or timing out, 3 is the measured fallback and buys 7.1 %.
      #
      # The suite is parallel-safe by construction: tests key their temp paths by
      # PID / gtest case name, and the handful that share the engine's repo-relative
      # mesh cache are serialized against each other with a ctest RESOURCE_LOCK
      # (OloEngine/tests/CMakeLists.txt). SHARDING DOES NOT WEAKEN THAT LOCK and in
      # one respect strengthens it: each shard is a separate runner with its own
      # checkout, so two shards cannot contend over one mesh cache at all, and within
      # a shard ctest serializes the locked cases exactly as before.
      #
      # TEN EH cases used to be excluded here and are not any more (issue #497).
      # They are the tests that trigger a real C++ throw+catch (malformed-input
      # robustness + MCP error handling), and clang-cl + ASan miscompiled MSVC-style
      # exception handling: ASan put redzones on the compiler-emitted EH metadata
      # globals (_ThrowInfo / _CatchableTypeArray / type descriptors) and the MSVC EH
      # runtime read across them, so any throw that unwound into a catch crashed
      # (global-buffer-overflow / 0xC0000005). It was an LLVM toolchain bug, not an
      # engine defect -- no compile/link/runtime flag worked around it (tried:
      # -asan-globals=0, -fno-strict-aliasing, /Od, detect_stack_use_after_return=0,
      # driver-vs-lld-link), and the old MSVC-cl.exe ASan job passed all of them.
      #
      # FIXED by the LLVM 23.1.0 pin in the build job -- see that step for the measured
      # before/after on #497's own three-line repro. If these cases start failing
      # again, the question is which clang the build job resolved, not whether the
      # engine regressed.
      run: >
        ctest --parallel 4 -C Release --output-on-failure --timeout 120
        -I ${{ matrix.shard }},,${OLO_CTEST_SHARDS}
        --exclude-regex "${OLO_ASAN_WINDOWS_CTEST_EXCLUDE}"
      shell: bash
      env:
        # detect_odr_violation=0 must be repeated here -- a step-level ASAN_OPTIONS
        # replaces the job-level one rather than merging (see the job `env` above).
        ASAN_OPTIONS: halt_on_error=1:detect_odr_violation=0
        GTEST_OUTPUT: xml:${{github.workspace}}/test_results/

    # `if: always()` on both uploads: a shard that FAILED is the one whose XML the
    # reporter most needs, and its count is what proves the failure was not simply an
    # empty run.
    - name: Upload this shard's test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: asan-windows-test-results-shard-${{ matrix.shard }}
        path: ${{github.workspace}}/test_results/*.xml
        if-no-files-found: 'warn'

    - name: Upload this shard's case count
      if: always() && steps.select.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: asan-windows-shard-count-${{ matrix.shard }}
        path: ${{github.workspace}}/shard_counts/shard-${{ matrix.shard }}.txt
        if-no-files-found: error

  # ---------------------------------------------------------------------------
  # #1083 GUARD 2 OF 2, and the report.
  #
  # `ctest -I <shard>,,<N>` partitions the list by construction -- on paper. What
  # this job checks is that the run that actually happened WAS that partition: every
  # shard reported, all agreeing on N, none empty, and the counts summing to the
  # unsharded `ctest -N` total the build job measured. Without it, sharding
  # introduces a way for the suite to shrink silently, which is the failure this
  # repository has the most history with.
  #
  # `if: always()` so a RED shard still gets reported and still gets its coverage
  # checked. It cannot launder a failure: the shard job itself stays red.
  # ---------------------------------------------------------------------------
  asan-windows-tests-verify:
    name: ASan (Windows) shard coverage
    needs: [asan-windows, asan-windows-tests]
    # `!cancelled()` rather than `always()`: a cancelled run (cancel-in-progress on
    # the next push) can leave asan-windows already 'success' while the shards were
    # killed mid-flight, and `always()` would then run this job and post a red
    # "a shard did not complete" on a run nobody abandoned for a reason worth
    # reading. Braced because a bare leading `!` is a YAML tag indicator.
    if: ${{ !cancelled() && needs.asan-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the shard case counts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: asan-windows-shard-count-*
        path: shard_counts
      # A shard that died before writing its count uploads nothing, and this step
      # would then fail on "no artifacts found" -- a worse message than the script's.
      # Let it through and let the union check name the missing shard.
      continue-on-error: true

    - name: Prove the shards covered the whole suite
      run: >
        python3 scripts/verify_test_shards.py
        --dir shard_counts
        --label "ASan (Windows)"
        --expected-total ${{ needs.asan-windows.outputs.ctest-total }}

    # NO `merge-multiple`, deliberately. GTEST_OUTPUT writes into a directory and
    # gtest names the files itself -- OloEngine-Tests.xml, then _1, _2, ... per
    # process -- so all four shards produce the SAME filenames. Merging them into one
    # directory would have shards silently overwrite each other and the report would
    # be missing real failures while looking complete. One directory per artifact,
    # and a `**` glob below.
    - name: Download the shard test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: asan-windows-test-results-shard-*
        path: test_results
      continue-on-error: true

    - name: Test report
      # Fork PRs can't write checks (job-level `checks: write` is downgraded
      # to read for forks). Skip the reporter there; same-repo PRs and
      # push/workflow_dispatch runs retain full permissions.
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: ASan (Windows)
        path: test_results/**/*.xml
        reporter: java-junit
        fail-on-error: false
        list-tests: 'failed'

    # THE COUNTS ARE RECORDED BEFORE THE RUN, so the check above proves the shards'
    # SELECTIONS partition the suite -- not that every selected case executed. A shard
    # whose ctest died a third of the way through still uploaded a full count. The
    # shard job is red in that case and so is the run, but this check must not read
    # green beside it, because "shard coverage" going green is precisely the sentence
    # someone will trust later. Last step, so the report above still gets posted.
    - name: Fail if any shard did not complete
      if: needs.asan-windows-tests.result != 'success'
      run: |
        echo "::error::A test shard did not complete (matrix result: ${{ needs.asan-windows-tests.result }}). The counts prove the selection partitioned the suite; they cannot prove every selected case ran."
        exit 1

  asan-lsan-linux:
    name: ASan + LSan (Linux/Clang)
    outputs:
      # Read by the shard coverage proof. It comes from THIS job rather than
      # from the artifact the shards were fed: a number that travels with the
      # thing it is meant to check is not a check.
      ctest-total: ${{ steps.ctest-total.outputs.total }}
    needs: detect-changes
    if: ${{ (github.event_name != 'pull_request' || needs.detect-changes.outputs.native == 'true')
        && (github.event.inputs.only == '' || github.event.inputs.only == 'all' || github.event.inputs.only == 'asan-lsan') }}
    # SELF-HOSTED WHEN THE CODE IS OURS, hosted Ubuntu when it is not -- the same
    # expression as vulkan-off.yml, whose comment owns the security reasoning:
    # the fork boundary is `head.repo.full_name`, never a `pull_request_target`
    # that checks out the PR head, and `vars.OLO_LINUX_SELF_HOSTED` is the kill
    # switch that comes FIRST so it can only ever move a job off the box.
    #
    # #1010 measured these three jobs on the box and sent them back hosted: 215
    # failed of 6,909 there against 1 of 6,940 hosted, same commit (run
    # 33561256256). Not because the box was slow -- because routing them CHANGED
    # WHAT THEY TESTED, and #1015 fixes both halves by contract:
    #
    #   1. The box has a GPU. Every test gated on a GL 4.6 context skips on a
    #      hosted runner and RAN there, ~200 visual/golden tests under a sanitizer
    #      for the first time. Now every ctest-launched test process gets
    #      `--olo-gl-backend=none` (OLO_TESTS_CTEST_ARGS on the configure line),
    #      which attempts no context at all, so the gate skips exactly as it does
    #      hosted. It is passed on BOTH arms: this job's contract is "no GPU
    #      tests", stated on its own command line, not inherited from whatever
    #      hardware the runner happens to have. GPU coverage under a sanitizer is
    #      a separate scheduled job with its own baseline (gpu-sanitizers-amd.yml).
    #   2. The box's compiler was clang 21 against gcc-toolset-15's libstdc++,
    #      not the hosted arm's clang, and UBSan reported inside the standard
    #      library. Both arms now build with THE SAME clang -- the official LLVM
    #      23.1.0 release tarball at /opt/llvm-23.1.0, on the box since #1036 and
    #      on the hosted runner since #1095. Rocky 10's EPEL tops out at clang20,
    #      so no package pin was ever possible on the box; and apt.llvm.org, which
    #      the hosted arm used to install from, publishes only the newest SNAPSHOT
    #      of a branch, so no package pin was possible there either. The tarball is
    #      what both can hold still.
    #
    #      setup-linux-build ASSERTS that pin on the box -- present, executable,
    #      reporting major 23 -- and warns down to the system clang rather than
    #      failing when it is not, because a hard failure would block every
    #      same-repo PR's sanitizer jobs. It also verifies compiler-rt for
    #      whichever compiler it chose: an incomplete asan/tsan/ubsan set WARNS
    #      too. The hosted arm has no ladder: the prefix is installed in the same
    #      run and its absence is a hard error. Read the "toolchain:" line of a
    #      self-hosted job before comparing it with a hosted one -- it names the
    #      absolute path when the pin is in effect, and a bare clang++ when it fell
    #      back. Since #1095 the two lines should be identical on a green run.
    #
    # The acceptance test for this routing is a same-commit A/B: dispatch the
    # workflow once normally and once with `force_hosted: true`, then compare
    # the pass/fail sets and the wall-clock. #1015's PR records the pair.
    #
    # THE SCHEDULED RUN STAYS HOSTED. It is the hosted arm's only cache warmer
    # (the trigger note at the top of this file: only default-branch runs write
    # a cache entry other branches can read), and the box needs no warmer -- its
    # ccache is a persistent directory every PR run feeds. Routing the nightly
    # to the box would leave every fork PR and every `force_hosted` A/B cold,
    # and would put three sanitizer jobs on the two CI slots at 01:23 UTC, an
    # hour before gpu-sanitizers-amd.yml needs them.
    #
    # `olo-ci`, not `gpu-amd`: the GPU nightly owns its runner exclusively.
    # The hosted arm is pinned to ubuntu-24.04 (noble) because the LLVM apt repo
    # URL hardcodes the distro codename; if ubuntu-latest jumped release the apt
    # source would 404.
    runs-on: ${{ vars.OLO_LINUX_SELF_HOSTED == 'true'
                 && github.event.inputs.force_hosted != 'true'
                 && github.event_name != 'schedule'
                 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                 && fromJSON('["self-hosted","linux","x64","olo-ci"]') || 'ubuntu-24.04' }}
    permissions:
      # Job-level permissions replace the workflow-level block entirely,
      # so re-declare contents: read alongside checks: write. Without it
      # actions/checkout@v6 would fail on fork PRs.
      contents: read
      checks: write
      # `actions: write` is BACK (#1095), with the sccache save it belongs to.
      # #1082 removed both when the entries were measured returning 0.00 %; the
      # compiler underneath them is pinned now, so the save is worth having again
      # and `save-cache-pruned` needs the permission to delete the entry it
      # supersedes when the store is full.
      actions: write

    env:
      # ONE definition of the exclusion, read by the unsharded run, by the
      # `ctest -N` total and by every shard's selection. Three literals that
      # must agree is how a shard comes to COUNT one partition and RUN another.
      OLO_ASAN_LSAN_LINUX_CTEST_EXCLUDE: '^NetworkIntegrationTest\.|^WorkerRestartTest\.'
      # THE ARGUMENT THIS COMMENT USED TO DEMAND, MEASURED. It said the case to make
      # later was "which existing entry gives way -- not that this one should quietly
      # grow". Both halves are now numbers, and the answer is that nothing gives way.
      # Keep the three Linux values identical; the measurement is not repeated on the
      # other two jobs.
      #
      # The object sets, `du -sm` on the sccache dir at a 3G probe cap, identical
      # source, hosted, saves disabled (runs 34202164224 / 34202166194 / 34202168014):
      #
      #     TSan 945 MiB    ASan+LSan 994 MiB    UBSan 1084 MiB
      #
      # So 900M was UNDER all three -- by 5 / 10 / 20 %. That small shortfall was not a
      # small cost. Same branch, same day, same restored master entries, only the cap
      # different (900M control runs 34201686909 / 34201689187 / 34201691565):
      #
      #                         at 900M                 at 3G
      #     TSan       93.88 %  /  4.0 min     99.94 %  /  1.7 min
      #     ASan+LSan  69.89 %  / 17.1 min     99.94 %  /  1.5 min
      #     UBSan      30.62 %  / 36.7 min     99.94 %  /  1.4 min
      #
      # The control is not a formality: master's entries are re-banked nightly, so "a
      # fresher entry" explains a hit-rate jump exactly as well as the cap does until
      # you re-run the old cap on the same commit. At 900M all three reported
      # "Cache size 900 MiB / Max cache size 900 MiB" -- pinned at the cap, evicting.
      #
      # sccache evicts LRU while a build reads its objects in a broadly stable order,
      # so a set that does not fit evicts entries this run is about to need, each miss
      # writes an object and evicts another, and the shortfall compounds. Being 20 %
      # over the cap cost 69 points of hit rate and 35 minutes, not 20 %.
      #
      # WHAT IT COSTS TO FIX. The bill is the compressed entry, not the cap, and a
      # cache that does not fill its cap costs what it holds: these three cost
      # 686 / 727 / 818 MiB at a 900 MiB dir (~0.74 of it), so ~1000 MiB dirs land near
      # 2400 MiB for the set against 2231 MiB now -- roughly +200 MiB on a store
      # measured at 7062 MiB against a ~9537 MiB wall.
      #
      # WHY NOTHING GIVES WAY. The competing claim was `sccache-asan-windows-2025`, on
      # the PR critical path, which rule 5 of docs/agent-rules/actions-cache-budget.md
      # says is what the store exists for -- and which looked full at 1230 MiB against
      # its 1500M cap. It is not: its object set measures 1241 MiB by `du -sm`, and two
      # dispatches on identical source, at 1500M and at 3G, both returned 99.87 % and
      # 12-13 min. Its 42 % run was an SDK bump landing under a key that did not carry
      # the SDK version; see the note on that key. So it needs no room, and this is the
      # only claimant.
      #
      # 1300M rather than the workflow-level 1500M, and the STORE picks that, not the
      # build. It clears the largest measured set by 20 %, and it bounds the worst case:
      # if a set ever grows to fill the cap, entries land at 82-91 % of it, so three of
      # them are ~3550 MiB and the fleet lands at ~8380 MiB -- under cache-prune.yml's
      # 8800 MiB failure threshold. At 1500M the same worst case is ~4100 MiB and
      # ~8930 MiB, which is OVER it.
      #
      # BE HONEST ABOUT WHO BENEFITS. Not the per-PR critical path: same-repo PRs route
      # these three jobs to the box and its local ccache, so only the nightly and fork
      # PRs read these entries. Rule 5 is why they get 1300M and not room to spare. It
      # is not a reason to leave them below their own object set, which saves ~200 MiB
      # and costs 36 minutes on the arm that finds UB.
      #
      # The line to watch is "Cache size" against "Max cache size" in the stats step,
      # and the `du -sm` step beside it, which is there because --show-stats ROUNDS: it
      # printed "1 GiB" for the arm that measured 1084 MiB.
      SCCACHE_CACHE_SIZE: "1300M"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Disk reclamation, Python + jinja2, the Vulkan/shader toolchain and the
    # compiler, resolved for whichever runner kind this job landed on. The apt
    # installs only ever run on a GitHub-hosted runner; on the self-hosted box the
    # action VERIFIES a system-wide provisioning instead, because that box has
    # neither passwordless sudo nor apt-get and an unconditional `sudo apt-get`
    # once kept the nightly red for days.
    - name: Setup Linux build environment
      id: linux
      uses: ./.github/actions/setup-linux-build
      with:
        # No LunarG SDK on the hosted arm: these jobs take spirv-cross, glslang and
        # shaderc from apt, and the SDK's PREBUILT spirv-cross SEGVs under sanitizer
        # instrumentation. See the input's own comment for the stack.
        vulkan-sdk: 'false'
        cache-name: asan-lsan

    # Provisions sccache and wires it to the GitHub Actions cache backend
    # (SCCACHE_GHA_ENABLED above). Must run before Configure so the launcher
    # resolves on PATH. This job passes no -G, so CMake uses the Unix Makefiles
    # generator, which honors CMAKE_<LANG>_COMPILER_LAUNCHER — sccache engages
    # with no generator switch (unlike the Windows job, which had to move to
    # Ninja for the launcher to take effect).
    #
    # Action v0.0.10 + sccache >= v0.10.0 are REQUIRED: GitHub decommissioned
    # the legacy Actions cache API on 2025-04-15, and older sccache builds hit
    # the dead endpoint and fail to start (and, as the compiler launcher, would
    # break every compile). v0.15.0 is the current stable pin — matches Windows.yml.
    # Hosted only. The self-hosted runner uses ccache instead -- see
    # .github/actions/setup-linux-build for why a per-user DAEMON is the wrong
    # shape when two runner instances share one Unix account.
    - name: Setup sccache
      if: runner.environment == 'github-hosted'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.15.0"

    # THE ACTIONS-CACHE ENTRY IS BACK, AND THE REASON IT WAS GONE IS FIXED (#1095).
    #
    # #1082 deleted the restore and the save here after measuring what they returned
    # on nightly 34004436875 -- all three Linux sanitizer jobs, the only runs that read
    # them:
    #
    #     Compile requests   1558      Cache hits          0
    #     Cache misses       1558      Cache hits rate     0.00 %
    #
    # The restore was healthy: 1232 MB at 180 MB/s, "Cache restored from key: ...".
    # It restored perfectly and hit NOTHING, three jobs out of three. THE COMPILER WAS
    # ROLLING UNDERNEATH THE KEY -- sccache hashes the compiler binary into every key
    # and the hosted arm built with apt.llvm.org's SNAPSHOT clang-23, whose build id
    # moves every few days.
    #
    # WHAT CHANGED: setup-linux-build now installs the official LLVM 23.1.0 release
    # tarball at /opt/llvm-23.1.0 on the hosted arm -- the same build, at the same
    # path, as the self-hosted box. Re-adding these steps WITHOUT that would reproduce
    # the 0.00 % exactly, which is why #1082's note said not to.
    #
    # THE LLVM VERSION IS IN THE KEY, on the same rule Windows.yml applies to the
    # runner image: put whatever the key is hashed over into the key, so a bump is a
    # deliberate, reviewable commit and not a silent 0 % run. Bumping it starts a new
    # prefix and orphans the old entry; cache-prune.yml's 30-day unread age-out
    # collects that.
    #
    # HOSTED ONLY. On the self-hosted box this job caches to a persistent local ccache
    # directory with no save step, no ref scoping and no cap -- and a self-hosted
    # runner still talks to the REMOTE Actions cache service, so an actions/cache step
    # there would spend the shared ~9.3 GiB cap for nothing.
    #
    # NOT ON PULL REQUESTS: a PR-run entry is scoped to refs/pull/N/merge, readable by
    # that one PR, and charged to the repository for as long as the PR stays open.
    # These jobs route to the box for same-repo PRs anyway; the writer is the nightly.
    - name: Restore sccache storage
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-asan-lsan-linux-llvm-${{ env.OLO_LINUX_LLVM_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          sccache-asan-lsan-linux-llvm-${{ env.OLO_LINUX_LLVM_VERSION }}-


    # Third-party deps come from the vcpkg manifest (issue #773). Ports are not
    # sanitizer-instrumented, which is what these jobs want — see the note in the
    # asan-windows job.
    - name: Setup vcpkg
      id: vcpkg
      uses: ./.github/actions/setup-vcpkg
      with:
        triplet: x64-linux

    - name: Configure CMake (ASan + LSan)
      # -fuse-ld=lld: the default GNU BFD ld holds the entire Debug +
      # sanitizer-instrumented link (engine, vendored static libs, DWARF) in
      # memory at once and can exceed the 16 GB on hosted runners — the OOM
      # reaper then kills the runner agent mid-link ("The runner has received
      # a shutdown signal", gmake "Terminated", partial output deleted). lld
      # links the same binary in a fraction of the memory and time, and is
      # version-matched via clang's own bin dir on BOTH arms -- on the box that
      # took an ICU 70 build beside the pinned prefix, because the tarball's lld
      # is linked against an ICU this distro does not have
      # (docs/ops/self-hosted-linux-toolchain.md).
      run: >
        cmake -S . -B build
        ${{ steps.vcpkg.outputs.toolchain-args }}
        ${{ steps.linux.outputs.extra-cmake-args }}
        -DPython_EXECUTABLE=${{ steps.linux.outputs.python-exe }}
        -DOLO_VIDEO_FFMPEG=OFF
        -DOLO_WITH_USD=OFF -DOLO_WITH_ALEMBIC=OFF -DOLO_WITH_MATERIALX=OFF
        -DCMAKE_CXX_COMPILER=${{ steps.linux.outputs.cxx }}
        -DCMAKE_C_COMPILER=${{ steps.linux.outputs.cc }}
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
        -DOLO_ENABLE_COMPILER_CACHE=ON
        -DOLO_ENABLE_ASAN=ON
        -DBUILD_TESTS=ON
        -DOLO_TESTS_CTEST_ARGS=--olo-gl-backend=none

    # The other half of setup-vcpkg's restore/save split (#1009). `if: always()`
    # is the whole point: the combined actions/cache action saves in a POST-JOB
    # step, which a CANCELLED job skips -- and most PR runs here are cancelled.
    # Placed before the build so a cancellation during the long build/test tail
    # still banks the ports this run just spent ~40 minutes installing.
    - name: Save vcpkg binary cache
      if: always()
      # A cache save must never fail the job it is attached to. `if: always()`
      # means this runs on a CANCEL, where the path it is asked to save may not
      # exist yet -- and actions/cache/save treats a missing path as a validation
      # error, not a no-op. Turning a cancelled run into a FAILED one would be a
      # strictly worse outcome than the cold cache this is fixing.
      continue-on-error: true
      uses: ./.github/actions/save-vcpkg-cache
      with:
        key: ${{ steps.vcpkg.outputs.cache-key }}
        path: ${{ steps.vcpkg.outputs.cache-path }}

    - name: Build tests
      # Pinned to --parallel 2 on both arms: higher concurrency exhausts runner
      # memory, which on the hosted arm surfaces as `The hosted runner lost
      # communication with the server`. The self-hosted box is the tighter of
      # the two constraints despite being the larger machine, because two of
      # these jobs run on it at once.
      #
      # This was 4 on self-hosted until 2026-09-09, justified as "16 threads,
      # 31 GiB, a persistent ccache ... 4 + 4 compiles is ~24 GB peak". Both
      # halves of that were wrong. The ~3 GB per translation unit it assumed is
      # 9.0 GB measured, with a single TU observed at 13.9 GB; and the runner
      # account is capped by cgroup at MemoryMax=19G, so a 24 GB budget was
      # never satisfiable. What actually happened was five OOM kills in 36
      # hours and a 2 h 13 min outage of all three self-hosted runners, when
      # systemd-oomd resolved the pressure by killing their systemd user
      # manager.
      #
      # So 2 here is the affordable width, not a conservative one: 2 + 2
      # concurrent instrumented compiles against a 19 G cap. Raising it again
      # means raising that cap first (the host's
      # /etc/systemd/system/user-1004.slice.d/50-resource-caps.conf) and
      # measuring per-TU RSS rather than assuming it. The same width is used
      # for ctest below, which bounds test RSS rather than compiler RSS.
      run: cmake --build build --target OloEngine-Tests --parallel 2

    # Read the cache hit rate. A cold cache (first run / after a real source
    # change) is mostly misses + writes; a warm cache shows a high hit rate,
    # meaning the build step recompiled almost nothing. The delta between a
    # cold and a warm run is the proof this change works.
    # The number this whole change is judged on. A cache that restores and hits on
    # nothing looks exactly like a working one; the hit rate is the only thing that
    # can tell them apart, so it is printed unconditionally -- see
    # docs/agent-rules/ci-cache-that-looks-alive.md.
    - name: Show compiler cache stats
      if: always()
      shell: bash
      run: |
        if [ "${{ runner.environment }}" = "github-hosted" ]; then
          sccache --show-stats
        else
          ccache --show-stats
        fi

    # THE LOCAL FOOTPRINT, measured off the directory rather than asked of sccache --
    # the step the asan-windows job has had since #1082, here for the same two reasons
    # plus a third. `--show-stats` ROUNDS: it printed "1 GiB" for this job while the
    # sibling arms printed "973 MiB" and "923 MiB", and "1 GiB" covers everything from
    # 1024 to 2047 MiB, which is the difference between a cap that clears the object
    # set and one that does not. It also reports a FRESH server's zeros if the old one
    # exited (run 34048670103). The directory is on disk either way.
    #
    # THIS IS NOT WHAT THE STORE IS CHARGED. `du` measures the UNCOMPRESSED directory;
    # the actions/cache entry is a compressed tarball of it, and on these three arms
    # that measured ~0.74x -- 923 and 994 MiB dirs banked 686 and 727 MiB entries. So
    # read this as the local footprint, and as a CONSERVATIVE upper bound on the entry.
    # What it measures exactly is the object set, which is what SCCACHE_CACHE_SIZE has
    # to clear; for the store bill, see the budget doc's table of measured entry sizes.
    - name: Measure the sccache directory
      if: always() && runner.environment == 'github-hosted'
      shell: bash
      run: |
        du -sm "${SCCACHE_DIR}" 2>/dev/null || echo "SCCACHE_DIR not present"

    # THE NUMBER THIS CHANGE IS JUDGED ON is the "Cache hits rate" line printed
    # immediately above, on the SECOND nightly after this lands -- not on a green
    # check. #1095's whole subject is an entry that restored perfectly, went green
    # every run and returned zero; see docs/agent-rules/ci-cache-that-looks-alive.md.
    #
    # `save-cache-pruned` rather than a bare save: actions/cache/save reports a
    # REFUSED write (the store past its cap goes read-only) as a warning and exits
    # zero, so the step's own status cannot tell you. This one asks the API whether
    # the save landed and, if it did not, deletes this ref's superseded entries under
    # the same prefix and retries.
    #
    # `if: always()` because most PR runs here are cancelled and a post-job step is
    # skipped on a cancel -- though on this gate that mostly matters for the
    # workflow_dispatch A/B, since pull_request runs do not save at all.
    - name: Save sccache storage
      if: always() && runner.environment == 'github-hosted' && github.event_name != 'pull_request'
      uses: ./.github/actions/save-cache-pruned
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-asan-lsan-linux-llvm-${{ env.OLO_LINUX_LLVM_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create test results directory
      run: mkdir -p "${GITHUB_WORKSPACE}/test_results"

    # ---- sharded plan: measure, stamp and stage, then let the shards run -----
    #
    # All three steps are skipped when `linux-shards == 1` (the self-hosted arm),
    # where this job runs the suite itself exactly as before.

    # The unsharded total the coverage proof checks the shards against. `ctest -N`
    # only LISTS -- discovery already happened at build time -- so this costs
    # seconds and launches no test process. It reads the SAME exclude regex the
    # shards do, from the job-level env var, because a total measured with a
    # different filter than the shards ran with would prove nothing.
    - name: Measure the unsharded case count
      id: ctest-total
      if: needs.detect-changes.outputs.linux-shards != '1'
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      run: |
        set -euo pipefail
        listing=$(ctest -N --exclude-regex "${OLO_ASAN_LSAN_LINUX_CTEST_EXCLUDE}")
        total=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p' | tail -1)
        # Digits-only BEFORE the numeric comparison: `[ "$x" -le 0 ]` on a
        # non-numeric $x errors rather than returning false, and a command that
        # errors inside an `if` is exempt from `set -e` -- so anything that is not
        # a number would fall straight through and get published as the total.
        case "${total}" in
          ''|*[!0-9]*)
            echo "::error::ctest -N did not report a numeric total (got '${total:-<empty>}'); discovery is broken."
            exit 1 ;;
        esac
        if [ "${total}" -le 0 ]; then
          echo "::error::ctest -N reported ${total} tests; discovery is broken."
          exit 1
        fi
        echo "total=${total}" >> "$GITHUB_OUTPUT"
        echo "unsharded ctest entries: ${total}"

    # THE EXECUTABLE BIT DOES NOT SURVIVE THE ARTIFACT. actions/upload-artifact
    # stores POSIX modes as 0644, so the downloaded OloEngine-Tests is not
    # executable and every one of ~7600 ctest entries would fail to launch. The
    # Windows shards never hit this because a .exe needs no mode bit; the shard
    # job below restores it explicitly and asserts the binary starts.
    - name: Stamp the build workspace
      if: needs.detect-changes.outputs.linux-shards != '1'
      run: |
        set -euo pipefail
        printf '%s' '${{github.workspace}}' > build/OloEngine/tests/olo-build-workspace.txt
        ls -l build/OloEngine/tests/OloEngine-Tests

    # ONLY WHAT CTEST READS: the generated *_tests.cmake entries, the workspace
    # stamp and the instrumented binary. The Linux sanitizer runtimes are linked
    # statically into the executable, so nothing else has to travel with it.
    - name: Upload the instrumented test tree
      if: needs.detect-changes.outputs.linux-shards != '1'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: asan-lsan-linux-test-tree
        path: |
          build/OloEngine/tests/*.cmake
          build/OloEngine/tests/olo-build-workspace.txt
          build/OloEngine/tests/OloEngine-Tests
        if-no-files-found: error
        retention-days: 1
        compression-level: 1

    - name: Run tests under ASan + LSan
      # SHARDED PLAN RUNS THIS ELSEWHERE. `linux-shards` is 1 only on the
      # self-hosted arm, where one runner cannot absorb a matrix; there this
      # job stays exactly what it was. On the hosted arm the shards below run
      # the suite instead and this step is skipped.
      if: needs.detect-changes.outputs.linux-shards == '1'
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      # WorkerRestartTest.RestartWorkersAndOversubscription is a tight-loop
      # stress test of FScheduler::RestartWorkers that the Windows ASan job
      # (asan.yml above) and the Linux TSan job (tsan.yml) already exclude
      # as too slow under sanitizer instrumentation — hits the 120 s timeout
      # in CI. Pre-existing flakiness, unrelated to PR contents.
      #
      # --timeout 600: ShaderReflectionBinding.AllProductionShaderBindingsMatchCppLayout
      # walks every production .glsl (~100 files × ~3 stages), invoking
      # shaderc to compile each to SPIR-V and spirv-cross to reflect the
      # bindings. Under ASan instrumentation shaderc is 3-5× slower per
      # compile, and the cumulative work blows past the default 120 s.
      # 600 s gives reasonable headroom without masking actual hangs.
      #
      # --parallel 2: gtest_discover_tests registers every gtest case as its own
      # ctest entry (one OloEngine-Tests process per case), so serial execution pays
      # the engine's full static-init cost ~3,600× back-to-back — a large chunk of
      # this job's wall-clock. Windows.yml already banks this win with
      # `ctest --parallel 4`.
      #
      # The suite is parallel-safe, and the property is ENFORCED rather than asserted
      # (issue #789 — this comment previously claimed "tests key their temp paths by
      # PID / gtest case name", which was true of most sites and had never been
      # measured). Every test scratch path now comes from OloEngine::Tests::TempDir()
      # / TempFile() (OloEngine/tests/TestTempDir.h), rooted in a directory claimed
      # exclusively by THIS process and keyed per gtest case beneath it; a pre-commit
      # hook (test-temp-dir-isolated) fails any direct temp_directory_path() call in
      # the test tree, so it cannot silently lapse. The one resource that is not
      # test-controlled and cannot be process-keyed — the engine's repo-relative mesh
      # cache — is serialized against itself with a ctest RESOURCE_LOCK
      # (OloEngine/tests/CMakeLists.txt). See
      # docs/agent-rules/shared-temp-dir-test-isolation.md.
      #
      # Why 2 here, not Windows' 4: these are SANITIZER-instrumented test processes
      # with a much larger *resident* footprint (ASan shadow memory; TSan
      # happens-before metadata), and the ubuntu runners have only ~16 GB / 4 vCPU.
      # Two concurrent instrumented processes stay comfortably inside that budget;
      # 4-wide risks the OOM reaper killing the runner mid-test.
      #
      # NOTE: this is unrelated to the build step's `--parallel 2` above. That pin is
      # a *compile-time* constraint (~9 GB per TU under clang+sanitizer, measured) and
      # does NOT transfer to the test phase — don't "reconcile" the two numbers; they
      # bound different resources (peak compiler RSS vs. peak instrumented-test RSS).
      run: ctest --parallel 2 --output-on-failure --timeout 600 --exclude-regex "${OLO_ASAN_LSAN_LINUX_CTEST_EXCLUDE}"
      env:
        # THE SYMBOLIZER IS NAMED IN *_OPTIONS, NOT ONLY IN ASAN_SYMBOLIZER_PATH.
        #
        # The sanitizer runtime resolves `llvm-symbolizer` from PATH, and the pinned
        # LLVM prefix is deliberately kept OFF the system PATH (see setup-linux-build).
        # Finding nothing, it does NOT print bare hex and move on -- it falls back to
        # binutils `addr2line`, one process per test process, and addr2line reads the
        # ENTIRE DWARF of the binary. For a Debug sanitizer build of OloEngine-Tests
        # that is ~7.5 GB each. MEASURED on run 34160911722 (#1111): two of them at
        # 7.2-8.0 GB with MemAvailable at 41 MiB, then `The runner has received a
        # shutdown signal`. The test processes were at ~0.2 GB. Every hosted TSan run
        # since the pin died this way, at the physics block, because that is where
        # tsan.txt's suppressed Jolt races make TSan symbolize during PASSING tests.
        #
        # ASAN_SYMBOLIZER_PATH alone did not prevent it: the same run had it set to
        # the right path and still spawned addr2line -- the TSan runtime does not read
        # that variable. `external_symbolizer_path` is the common-runtime flag every
        # sanitizer honours, so it goes into each *_OPTIONS; the env var stays for
        # ASan, which does read it.
        #
        # AN EMPTY VALUE DISABLES SYMBOLIZATION rather than falling back to addr2line
        # ("External symbolizer is explicitly disabled"). That is the failure mode
        # wanted here: a job whose toolchain cannot symbolize should print hex, not
        # eat the VM. setup-linux-build already warns when it resolves nothing.
        ASAN_SYMBOLIZER_PATH: ${{ steps.linux.outputs.symbolizer }}
        ASAN_OPTIONS: external_symbolizer_path=${{ steps.linux.outputs.symbolizer }}:halt_on_error=1:detect_leaks=1:symbolize=1
        LSAN_OPTIONS: suppressions=${{github.workspace}}/.github/sanitizer-suppressions/lsan.txt:symbolize=1
        GTEST_OUTPUT: xml:${{github.workspace}}/test_results/

    - name: Test report
      # Fork PRs can't write checks (job-level `checks: write` is downgraded
      # to read for forks). Skip the reporter there; same-repo PRs and
      # push/workflow_dispatch runs retain full permissions.
      if: always() && needs.detect-changes.outputs.linux-shards == '1'
        && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: ASan + LSan (Linux)
        path: test_results/*.xml
        reporter: java-junit
        fail-on-error: false
        list-tests: 'failed'

  ubsan-linux:
    name: UBSan (Linux/Clang)
    outputs:
      # Read by the shard coverage proof. It comes from THIS job rather than
      # from the artifact the shards were fed: a number that travels with the
      # thing it is meant to check is not a check.
      ctest-total: ${{ steps.ctest-total.outputs.total }}
    needs: detect-changes
    if: ${{ (github.event_name != 'pull_request' || needs.detect-changes.outputs.native == 'true')
        && (github.event.inputs.only == '' || github.event.inputs.only == 'all' || github.event.inputs.only == 'ubsan') }}
    # Routed exactly like asan-lsan-linux -- the reasoning, the security boundary
    # and the `force_hosted` A/B live on that job. Keep the three expressions
    # byte-identical: a job that drifts onto a label set nobody serves does not
    # fail, it queues for 24 hours.
    runs-on: ${{ vars.OLO_LINUX_SELF_HOSTED == 'true'
                 && github.event.inputs.force_hosted != 'true'
                 && github.event_name != 'schedule'
                 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                 && fromJSON('["self-hosted","linux","x64","olo-ci"]') || 'ubuntu-24.04' }}
    permissions:
      # Job-level permissions replace the workflow-level block entirely,
      # so re-declare contents: read alongside checks: write. Without it
      # actions/checkout@v6 would fail on fork PRs.
      contents: read
      checks: write
      # `actions: write` is BACK (#1095), with the sccache save it belongs to.
      # #1082 removed both when the entries were measured returning 0.00 %; the
      # compiler underneath them is pinned now, so the save is worth having again
      # and `save-cache-pruned` needs the permission to delete the entry it
      # supersedes when the store is full.
      actions: write

    env:
      # ONE definition of the exclusion, read by the unsharded run, by the
      # `ctest -N` total and by every shard's selection. Three literals that
      # must agree is how a shard comes to COUNT one partition and RUN another.
      # A FOURTH copy is gpu-sanitizers-amd.yml's `ubsan` arm, which says in its
      # own comment that it is copied from here -- change it in the same commit.
      #
      # TaskConcurrencyLimiterTest and LowLevelTaskUserDataTest came OFF this
      # list. They arrived in the #317 era, when the whole Task/Async family was
      # excluded wholesale on a "Timeouts + SEGFAULTs" note, and were never
      # re-tried; Windows.yml has since re-enabled that same family after
      # classifying each suite (see the note above its `--parallel 6`), and the
      # asan-lsan-linux and tsan-linux jobs here have been running both cases
      # green all along -- neither one is in their exclusion. Nothing UBSan-
      # specific was ever recorded about them. Measured green on the hosted
      # 4-shard arm before this landed; if either ever trips UBSan, the finding
      # is a scored issue, not a re-exclusion.
      OLO_UBSAN_LINUX_CTEST_EXCLUDE: '^NetworkIntegrationTest\.|^NetworkManagerTest\.|^NetworkThreadDispatchTest\.|^ServerAuthoritativeLoopTest\.|^WorkerRestartTest\.'
      # Keep this byte-identical to asan-lsan-linux's, where the measurement that picks
      # 1300M is written down. Raised from 900M, which measured UNDER all three object
      # sets (945 / 994 / 1084 MiB) and cost 93.88 / 69.89 / 30.62 % hit rates.
      SCCACHE_CACHE_SIZE: "1300M"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Disk reclamation, Python + jinja2, the Vulkan/shader toolchain and the
    # compiler, resolved for whichever runner kind this job landed on. The apt
    # installs only ever run on a GitHub-hosted runner; on the self-hosted box the
    # action VERIFIES a system-wide provisioning instead, because that box has
    # neither passwordless sudo nor apt-get and an unconditional `sudo apt-get`
    # once kept the nightly red for days.
    - name: Setup Linux build environment
      id: linux
      uses: ./.github/actions/setup-linux-build
      with:
        # No LunarG SDK on the hosted arm: these jobs take spirv-cross, glslang and
        # shaderc from apt, and the SDK's PREBUILT spirv-cross SEGVs under sanitizer
        # instrumentation. See the input's own comment for the stack.
        vulkan-sdk: 'false'
        cache-name: ubsan

    # Provisions sccache before Configure (see asan-lsan-linux for the version-
    # pin rationale and why no generator switch is needed on Linux).
    # Hosted only. The self-hosted runner uses ccache instead -- see
    # .github/actions/setup-linux-build for why a per-user DAEMON is the wrong
    # shape when two runner instances share one Unix account.
    - name: Setup sccache
      if: runner.environment == 'github-hosted'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.15.0"

    # THE ACTIONS-CACHE ENTRY IS BACK, AND THE REASON IT WAS GONE IS FIXED (#1095).
    #
    # #1082 deleted the restore and the save here after measuring what they returned
    # on nightly 34004436875 -- all three Linux sanitizer jobs, the only runs that read
    # them:
    #
    #     Compile requests   1558      Cache hits          0
    #     Cache misses       1558      Cache hits rate     0.00 %
    #
    # The restore was healthy: 1232 MB at 180 MB/s, "Cache restored from key: ...".
    # It restored perfectly and hit NOTHING, three jobs out of three. THE COMPILER WAS
    # ROLLING UNDERNEATH THE KEY -- sccache hashes the compiler binary into every key
    # and the hosted arm built with apt.llvm.org's SNAPSHOT clang-23, whose build id
    # moves every few days.
    #
    # WHAT CHANGED: setup-linux-build now installs the official LLVM 23.1.0 release
    # tarball at /opt/llvm-23.1.0 on the hosted arm -- the same build, at the same
    # path, as the self-hosted box. Re-adding these steps WITHOUT that would reproduce
    # the 0.00 % exactly, which is why #1082's note said not to.
    #
    # THE LLVM VERSION IS IN THE KEY, on the same rule Windows.yml applies to the
    # runner image: put whatever the key is hashed over into the key, so a bump is a
    # deliberate, reviewable commit and not a silent 0 % run. Bumping it starts a new
    # prefix and orphans the old entry; cache-prune.yml's 30-day unread age-out
    # collects that.
    #
    # HOSTED ONLY. On the self-hosted box this job caches to a persistent local ccache
    # directory with no save step, no ref scoping and no cap -- and a self-hosted
    # runner still talks to the REMOTE Actions cache service, so an actions/cache step
    # there would spend the shared ~9.3 GiB cap for nothing.
    #
    # NOT ON PULL REQUESTS: a PR-run entry is scoped to refs/pull/N/merge, readable by
    # that one PR, and charged to the repository for as long as the PR stays open.
    # These jobs route to the box for same-repo PRs anyway; the writer is the nightly.
    - name: Restore sccache storage
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-ubsan-linux-llvm-${{ env.OLO_LINUX_LLVM_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          sccache-ubsan-linux-llvm-${{ env.OLO_LINUX_LLVM_VERSION }}-


    # Third-party deps come from the vcpkg manifest (issue #773). Ports are not
    # sanitizer-instrumented, which is what these jobs want — see the note in the
    # asan-windows job.
    - name: Setup vcpkg
      id: vcpkg
      uses: ./.github/actions/setup-vcpkg
      with:
        triplet: x64-linux

    - name: Configure CMake (UBSan)
      # -fuse-ld=lld: see the ASan + LSan configure step above — BFD ld can
      # OOM the runner during the final OloEngine-Tests link.
      run: >
        cmake -S . -B build
        ${{ steps.vcpkg.outputs.toolchain-args }}
        ${{ steps.linux.outputs.extra-cmake-args }}
        -DPython_EXECUTABLE=${{ steps.linux.outputs.python-exe }}
        -DOLO_VIDEO_FFMPEG=OFF
        -DOLO_WITH_USD=OFF -DOLO_WITH_ALEMBIC=OFF -DOLO_WITH_MATERIALX=OFF
        -DCMAKE_CXX_COMPILER=${{ steps.linux.outputs.cxx }}
        -DCMAKE_C_COMPILER=${{ steps.linux.outputs.cc }}
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
        -DOLO_ENABLE_COMPILER_CACHE=ON
        -DOLO_ENABLE_UBSAN=ON
        -DBUILD_TESTS=ON
        -DOLO_TESTS_CTEST_ARGS=--olo-gl-backend=none

    # The other half of setup-vcpkg's restore/save split (#1009). `if: always()`
    # is the whole point: the combined actions/cache action saves in a POST-JOB
    # step, which a CANCELLED job skips -- and most PR runs here are cancelled.
    # Placed before the build so a cancellation during the long build/test tail
    # still banks the ports this run just spent ~40 minutes installing.
    - name: Save vcpkg binary cache
      if: always()
      # A cache save must never fail the job it is attached to. `if: always()`
      # means this runs on a CANCEL, where the path it is asked to save may not
      # exist yet -- and actions/cache/save treats a missing path as a validation
      # error, not a no-op. Turning a cancelled run into a FAILED one would be a
      # strictly worse outcome than the cold cache this is fixing.
      continue-on-error: true
      uses: ./.github/actions/save-vcpkg-cache
      with:
        key: ${{ steps.vcpkg.outputs.cache-key }}
        path: ${{ steps.vcpkg.outputs.cache-path }}

    - name: Build tests
      # Pinned to --parallel 2: higher concurrency has been observed to
      # exhaust runner memory (clang++ under sanitizer instrumentation uses
      # ~9 GB per translation unit, measured), causing `The hosted runner lost
      # communication with the server` failures.
      run: cmake --build build --target OloEngine-Tests --parallel 2

    # Read the cache hit rate. A cold cache (first run / after a real source
    # change) is mostly misses + writes; a warm cache shows a high hit rate,
    # meaning the build step recompiled almost nothing. The delta between a
    # cold and a warm run is the proof this change works.
    # The number this whole change is judged on. A cache that restores and hits on
    # nothing looks exactly like a working one; the hit rate is the only thing that
    # can tell them apart, so it is printed unconditionally -- see
    # docs/agent-rules/ci-cache-that-looks-alive.md.
    - name: Show compiler cache stats
      if: always()
      shell: bash
      run: |
        if [ "${{ runner.environment }}" = "github-hosted" ]; then
          sccache --show-stats
        else
          ccache --show-stats
        fi

    # THE LOCAL FOOTPRINT, measured off the directory rather than asked of sccache --
    # the step the asan-windows job has had since #1082, here for the same two reasons
    # plus a third. `--show-stats` ROUNDS: it printed "1 GiB" for this job while the
    # sibling arms printed "973 MiB" and "923 MiB", and "1 GiB" covers everything from
    # 1024 to 2047 MiB, which is the difference between a cap that clears the object
    # set and one that does not. It also reports a FRESH server's zeros if the old one
    # exited (run 34048670103). The directory is on disk either way.
    #
    # THIS IS NOT WHAT THE STORE IS CHARGED. `du` measures the UNCOMPRESSED directory;
    # the actions/cache entry is a compressed tarball of it, and on these three arms
    # that measured ~0.74x -- 923 and 994 MiB dirs banked 686 and 727 MiB entries. So
    # read this as the local footprint, and as a CONSERVATIVE upper bound on the entry.
    # What it measures exactly is the object set, which is what SCCACHE_CACHE_SIZE has
    # to clear; for the store bill, see the budget doc's table of measured entry sizes.
    - name: Measure the sccache directory
      if: always() && runner.environment == 'github-hosted'
      shell: bash
      run: |
        du -sm "${SCCACHE_DIR}" 2>/dev/null || echo "SCCACHE_DIR not present"

    # THE NUMBER THIS CHANGE IS JUDGED ON is the "Cache hits rate" line printed
    # immediately above, on the SECOND nightly after this lands -- not on a green
    # check. #1095's whole subject is an entry that restored perfectly, went green
    # every run and returned zero; see docs/agent-rules/ci-cache-that-looks-alive.md.
    #
    # `save-cache-pruned` rather than a bare save: actions/cache/save reports a
    # REFUSED write (the store past its cap goes read-only) as a warning and exits
    # zero, so the step's own status cannot tell you. This one asks the API whether
    # the save landed and, if it did not, deletes this ref's superseded entries under
    # the same prefix and retries.
    #
    # `if: always()` because most PR runs here are cancelled and a post-job step is
    # skipped on a cancel -- though on this gate that mostly matters for the
    # workflow_dispatch A/B, since pull_request runs do not save at all.
    - name: Save sccache storage
      if: always() && runner.environment == 'github-hosted' && github.event_name != 'pull_request'
      uses: ./.github/actions/save-cache-pruned
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-ubsan-linux-llvm-${{ env.OLO_LINUX_LLVM_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create test results directory
      run: mkdir -p "${GITHUB_WORKSPACE}/test_results"

    # ---- sharded plan: measure, stamp and stage, then let the shards run -----
    #
    # All three steps are skipped when `linux-shards == 1` (the self-hosted arm),
    # where this job runs the suite itself exactly as before.

    # The unsharded total the coverage proof checks the shards against. `ctest -N`
    # only LISTS -- discovery already happened at build time -- so this costs
    # seconds and launches no test process. It reads the SAME exclude regex the
    # shards do, from the job-level env var, because a total measured with a
    # different filter than the shards ran with would prove nothing.
    - name: Measure the unsharded case count
      id: ctest-total
      if: needs.detect-changes.outputs.linux-shards != '1'
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      run: |
        set -euo pipefail
        listing=$(ctest -N --exclude-regex "${OLO_UBSAN_LINUX_CTEST_EXCLUDE}")
        total=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p' | tail -1)
        # Digits-only BEFORE the numeric comparison: `[ "$x" -le 0 ]` on a
        # non-numeric $x errors rather than returning false, and a command that
        # errors inside an `if` is exempt from `set -e` -- so anything that is not
        # a number would fall straight through and get published as the total.
        case "${total}" in
          ''|*[!0-9]*)
            echo "::error::ctest -N did not report a numeric total (got '${total:-<empty>}'); discovery is broken."
            exit 1 ;;
        esac
        if [ "${total}" -le 0 ]; then
          echo "::error::ctest -N reported ${total} tests; discovery is broken."
          exit 1
        fi
        echo "total=${total}" >> "$GITHUB_OUTPUT"
        echo "unsharded ctest entries: ${total}"

    # THE EXECUTABLE BIT DOES NOT SURVIVE THE ARTIFACT. actions/upload-artifact
    # stores POSIX modes as 0644, so the downloaded OloEngine-Tests is not
    # executable and every one of ~7600 ctest entries would fail to launch. The
    # Windows shards never hit this because a .exe needs no mode bit; the shard
    # job below restores it explicitly and asserts the binary starts.
    - name: Stamp the build workspace
      if: needs.detect-changes.outputs.linux-shards != '1'
      run: |
        set -euo pipefail
        printf '%s' '${{github.workspace}}' > build/OloEngine/tests/olo-build-workspace.txt
        ls -l build/OloEngine/tests/OloEngine-Tests

    # ONLY WHAT CTEST READS: the generated *_tests.cmake entries, the workspace
    # stamp and the instrumented binary. The Linux sanitizer runtimes are linked
    # statically into the executable, so nothing else has to travel with it.
    - name: Upload the instrumented test tree
      if: needs.detect-changes.outputs.linux-shards != '1'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ubsan-linux-test-tree
        path: |
          build/OloEngine/tests/*.cmake
          build/OloEngine/tests/olo-build-workspace.txt
          build/OloEngine/tests/OloEngine-Tests
        if-no-files-found: error
        retention-days: 1
        compression-level: 1

    - name: Run tests under UBSan
      # SHARDED PLAN RUNS THIS ELSEWHERE. `linux-shards` is 1 only on the
      # self-hosted arm, where one runner cannot absorb a matrix; there this
      # job stays exactly what it was. On the hosted arm the shards below run
      # the suite instead and this step is skipped.
      if: needs.detect-changes.outputs.linux-shards == '1'
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      # WorkerRestartTest.RestartWorkersAndOversubscription joins the
      # exclude list (matching ASan + TSan) — 100 iterations of a full
      # worker-pool teardown/recreate are too slow under any sanitizer.
      #
      # --timeout 600: same rationale as the ASan + LSan step above —
      # ShaderReflectionBinding compiles ~100 shaders × ~3 stages via
      # shaderc, which is 3-5× slower under UBSan instrumentation.
      #
      # --parallel 2: see the ASan + LSan run step above for the full rationale —
      # one ctest entry per gtest case makes serial execution pay engine static-init
      # ~3,600× over; the suite is parallel-safe (PID/case-name temp paths + a mesh-
      # cache RESOURCE_LOCK), and 2 (not Windows' 4) keeps two sanitizer-instrumented
      # processes inside the ~16 GB / 4-vCPU runner. Independent of the build step's
      # compile-time `--parallel 2` — that bounds compiler RSS, this bounds test RSS.
      #
      # ServerAuthoritativeLoopTest joins the three networking suites already
      # excluded here, for the same underlying reason: it drives live
      # GameNetworkingSockets, and GNS is not UBSan-clean under our check set.
      # Specifically, GNS *deliberately* disables the alignment check for its own
      # build — its vendored cmake/FindUBSan.cmake adds `-fno-sanitize=alignment`
      # to the stock arsenm/sanitizers-cmake flags (its FindTSan.cmake is
      # unmodified, so this is a considered change, not boilerplate) — while
      # `alignment` is one of our eight enabled-and-fatal checks.
      #
      # The separate `vptr` false positive that first surfaced this (a virtual call
      # into GNS reported as "does not point to an object of type
      # 'ISteamNetworkingUtils'") is FIXED at the root in cmake/Sanitizers.cmake:
      # UBSan now enables only the curated eight checks rather than the whole
      # `undefined` group, so vptr is no longer asked of `-fno-rtti` vendor code.
      # This exclusion covers the remaining, genuinely-GNS-side gap. See #636.
      run: ctest --parallel 2 --output-on-failure --timeout 600 --exclude-regex "${OLO_UBSAN_LINUX_CTEST_EXCLUDE}"
      env:
        # THE SYMBOLIZER IS NAMED IN *_OPTIONS, NOT ONLY IN ASAN_SYMBOLIZER_PATH.
        #
        # The sanitizer runtime resolves `llvm-symbolizer` from PATH, and the pinned
        # LLVM prefix is deliberately kept OFF the system PATH (see setup-linux-build).
        # Finding nothing, it does NOT print bare hex and move on -- it falls back to
        # binutils `addr2line`, one process per test process, and addr2line reads the
        # ENTIRE DWARF of the binary. For a Debug sanitizer build of OloEngine-Tests
        # that is ~7.5 GB each. MEASURED on run 34160911722 (#1111): two of them at
        # 7.2-8.0 GB with MemAvailable at 41 MiB, then `The runner has received a
        # shutdown signal`. The test processes were at ~0.2 GB. Every hosted TSan run
        # since the pin died this way, at the physics block, because that is where
        # tsan.txt's suppressed Jolt races make TSan symbolize during PASSING tests.
        #
        # ASAN_SYMBOLIZER_PATH alone did not prevent it: the same run had it set to
        # the right path and still spawned addr2line -- the TSan runtime does not read
        # that variable. `external_symbolizer_path` is the common-runtime flag every
        # sanitizer honours, so it goes into each *_OPTIONS; the env var stays for
        # ASan, which does read it.
        #
        # AN EMPTY VALUE DISABLES SYMBOLIZATION rather than falling back to addr2line
        # ("External symbolizer is explicitly disabled"). That is the failure mode
        # wanted here: a job whose toolchain cannot symbolize should print hex, not
        # eat the VM. setup-linux-build already warns when it resolves nothing.
        ASAN_SYMBOLIZER_PATH: ${{ steps.linux.outputs.symbolizer }}
        UBSAN_OPTIONS: external_symbolizer_path=${{ steps.linux.outputs.symbolizer }}:halt_on_error=1:print_stacktrace=1:symbolize=1
        GTEST_OUTPUT: xml:${{github.workspace}}/test_results/

    - name: Test report
      # Fork PRs can't write checks (job-level `checks: write` is downgraded
      # to read for forks). Skip the reporter there; same-repo PRs and
      # push/workflow_dispatch runs retain full permissions.
      if: always() && needs.detect-changes.outputs.linux-shards == '1'
        && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: UBSan (Linux)
        path: test_results/*.xml
        reporter: java-junit
        fail-on-error: false
        list-tests: 'failed'

  tsan-linux:
    name: TSan (Linux/Clang)
    outputs:
      # Read by the shard coverage proof. It comes from THIS job rather than
      # from the artifact the shards were fed: a number that travels with the
      # thing it is meant to check is not a check.
      ctest-total: ${{ steps.ctest-total.outputs.total }}
    needs: detect-changes
    if: ${{ (github.event_name != 'pull_request' || needs.detect-changes.outputs.native == 'true')
        && (github.event.inputs.only == '' || github.event.inputs.only == 'all' || github.event.inputs.only == 'tsan') }}
    # 180, not 120, not 90: the same cold-cache loop, measured twice.
    #
    # A cold sccache restore (concurrent runs evict each other under the 10 GB
    # repo cache cap) makes the instrumented TSan build alone take ~78 minutes,
    # and a cancelled job skips the cache save — so 90 produced a chronic
    # cold → timeout → no-save → cold loop across unrelated branches. 120 did
    # not end it: PR #945 restored a stale key, reported a **2.70% hit rate**
    # (1371 of 1409 TUs compiled from scratch), spent 92 of its 120 minutes in
    # the build, and was cancelled at 6224/6651 tests with every one of them
    # passing and zero ThreadSanitizer reports. Its own `if: always()` save then
    # failed — "Unable to reserve cache with key … another job may be creating
    # this cache" — so the next attempt would have started just as cold.
    #
    # For scale: the same job on master the day before finished in 86 minutes.
    # The warm path has always fit; it is only the cold path that does not, and
    # a timeout on the cold path is what keeps it cold.
    #
    # 180 is also what the sibling jobs effectively get. TSan is the ONLY
    # sanitizer job here with a `timeout-minutes` at all — asan-lsan-linux,
    # ubsan-linux and asan-windows run under the 360-minute default, and UBSan
    # has been observed finishing at 126 minutes, i.e. over this cap. The
    # asymmetry, not the duration, was the bug.
    timeout-minutes: 180
    # Routed exactly like asan-lsan-linux -- the reasoning, the security boundary
    # and the `force_hosted` A/B live on that job. Keep the three expressions
    # byte-identical: a job that drifts onto a label set nobody serves does not
    # fail, it queues for 24 hours.
    runs-on: ${{ vars.OLO_LINUX_SELF_HOSTED == 'true'
                 && github.event.inputs.force_hosted != 'true'
                 && github.event_name != 'schedule'
                 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                 && fromJSON('["self-hosted","linux","x64","olo-ci"]') || 'ubuntu-24.04' }}
    permissions:
      # Job-level permissions replace the workflow-level block entirely,
      # so re-declare contents: read alongside checks: write. Without it
      # actions/checkout@v6 would fail on fork PRs.
      contents: read
      checks: write
      # `actions: write` is BACK (#1095), with the sccache save it belongs to.
      # #1082 removed both when the entries were measured returning 0.00 %; the
      # compiler underneath them is pinned now, so the save is worth having again
      # and `save-cache-pruned` needs the permission to delete the entry it
      # supersedes when the store is full.
      actions: write

    env:
      # ONE definition of the exclusion, read by the unsharded run, by the
      # `ctest -N` total and by every shard's selection. Three literals that
      # must agree is how a shard comes to COUNT one partition and RUN another.
      OLO_TSAN_LINUX_CTEST_EXCLUDE: '^NetworkIntegrationTest\.|^ServerAuthoritativeLoopTest\.|^WorkerRestartTest\.'
      # Keep this byte-identical to asan-lsan-linux's, where the measurement that picks
      # 1300M is written down. Raised from 900M, which measured UNDER all three object
      # sets (945 / 994 / 1084 MiB) and cost 93.88 / 69.89 / 30.62 % hit rates.
      SCCACHE_CACHE_SIZE: "1300M"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Disk reclamation, Python + jinja2, the Vulkan/shader toolchain and the
    # compiler, resolved for whichever runner kind this job landed on. The apt
    # installs only ever run on a GitHub-hosted runner; on the self-hosted box the
    # action VERIFIES a system-wide provisioning instead, because that box has
    # neither passwordless sudo nor apt-get and an unconditional `sudo apt-get`
    # once kept the nightly red for days.
    - name: Setup Linux build environment
      id: linux
      uses: ./.github/actions/setup-linux-build
      with:
        # No LunarG SDK on the hosted arm: these jobs take spirv-cross, glslang and
        # shaderc from apt, and the SDK's PREBUILT spirv-cross SEGVs under sanitizer
        # instrumentation. See the input's own comment for the stack.
        vulkan-sdk: 'false'
        cache-name: tsan

    # Provisions sccache before Configure (see asan-lsan-linux for the version-
    # pin rationale and why no generator switch is needed on Linux).
    # Hosted only. The self-hosted runner uses ccache instead -- see
    # .github/actions/setup-linux-build for why a per-user DAEMON is the wrong
    # shape when two runner instances share one Unix account.
    - name: Setup sccache
      if: runner.environment == 'github-hosted'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.15.0"

    # THE ACTIONS-CACHE ENTRY IS BACK, AND THE REASON IT WAS GONE IS FIXED (#1095).
    #
    # #1082 deleted the restore and the save here after measuring what they returned
    # on nightly 34004436875 -- all three Linux sanitizer jobs, the only runs that read
    # them:
    #
    #     Compile requests   1558      Cache hits          0
    #     Cache misses       1558      Cache hits rate     0.00 %
    #
    # The restore was healthy: 1232 MB at 180 MB/s, "Cache restored from key: ...".
    # It restored perfectly and hit NOTHING, three jobs out of three. THE COMPILER WAS
    # ROLLING UNDERNEATH THE KEY -- sccache hashes the compiler binary into every key
    # and the hosted arm built with apt.llvm.org's SNAPSHOT clang-23, whose build id
    # moves every few days.
    #
    # WHAT CHANGED: setup-linux-build now installs the official LLVM 23.1.0 release
    # tarball at /opt/llvm-23.1.0 on the hosted arm -- the same build, at the same
    # path, as the self-hosted box. Re-adding these steps WITHOUT that would reproduce
    # the 0.00 % exactly, which is why #1082's note said not to.
    #
    # THE LLVM VERSION IS IN THE KEY, on the same rule Windows.yml applies to the
    # runner image: put whatever the key is hashed over into the key, so a bump is a
    # deliberate, reviewable commit and not a silent 0 % run. Bumping it starts a new
    # prefix and orphans the old entry; cache-prune.yml's 30-day unread age-out
    # collects that.
    #
    # HOSTED ONLY. On the self-hosted box this job caches to a persistent local ccache
    # directory with no save step, no ref scoping and no cap -- and a self-hosted
    # runner still talks to the REMOTE Actions cache service, so an actions/cache step
    # there would spend the shared ~9.3 GiB cap for nothing.
    #
    # NOT ON PULL REQUESTS: a PR-run entry is scoped to refs/pull/N/merge, readable by
    # that one PR, and charged to the repository for as long as the PR stays open.
    # These jobs route to the box for same-repo PRs anyway; the writer is the nightly.
    - name: Restore sccache storage
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-tsan-linux-llvm-${{ env.OLO_LINUX_LLVM_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          sccache-tsan-linux-llvm-${{ env.OLO_LINUX_LLVM_VERSION }}-


    # Third-party deps come from the vcpkg manifest (issue #773). Ports are not
    # sanitizer-instrumented, which is what these jobs want — see the note in the
    # asan-windows job.
    - name: Setup vcpkg
      id: vcpkg
      uses: ./.github/actions/setup-vcpkg
      with:
        triplet: x64-linux

    - name: Configure CMake (TSan)
      # -fuse-ld=lld: see the ASan + LSan configure step above — BFD ld can
      # OOM the runner during the final OloEngine-Tests link.
      run: >
        cmake -S . -B build
        ${{ steps.vcpkg.outputs.toolchain-args }}
        ${{ steps.linux.outputs.extra-cmake-args }}
        -DPython_EXECUTABLE=${{ steps.linux.outputs.python-exe }}
        -DOLO_VIDEO_FFMPEG=OFF
        -DOLO_WITH_USD=OFF -DOLO_WITH_ALEMBIC=OFF -DOLO_WITH_MATERIALX=OFF
        -DCMAKE_CXX_COMPILER=${{ steps.linux.outputs.cxx }}
        -DCMAKE_C_COMPILER=${{ steps.linux.outputs.cc }}
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
        -DOLO_ENABLE_COMPILER_CACHE=ON
        -DOLO_ENABLE_TSAN=ON
        -DBUILD_TESTS=ON
        -DOLO_TESTS_CTEST_ARGS=--olo-gl-backend=none

    # The other half of setup-vcpkg's restore/save split (#1009). `if: always()`
    # is the whole point: the combined actions/cache action saves in a POST-JOB
    # step, which a CANCELLED job skips -- and most PR runs here are cancelled.
    # Placed before the build so a cancellation during the long build/test tail
    # still banks the ports this run just spent ~40 minutes installing.
    - name: Save vcpkg binary cache
      if: always()
      # A cache save must never fail the job it is attached to. `if: always()`
      # means this runs on a CANCEL, where the path it is asked to save may not
      # exist yet -- and actions/cache/save treats a missing path as a validation
      # error, not a no-op. Turning a cancelled run into a FAILED one would be a
      # strictly worse outcome than the cold cache this is fixing.
      continue-on-error: true
      uses: ./.github/actions/save-vcpkg-cache
      with:
        key: ${{ steps.vcpkg.outputs.cache-key }}
        path: ${{ steps.vcpkg.outputs.cache-path }}

    - name: Build tests
      # Pinned to --parallel 2: higher concurrency has been observed to
      # exhaust runner memory (clang++ under sanitizer instrumentation uses
      # ~9 GB per translation unit, measured), causing `The hosted runner lost
      # communication with the server` failures.
      run: cmake --build build --target OloEngine-Tests --parallel 2

    # Read the cache hit rate. A cold cache (first run / after a real source
    # change) is mostly misses + writes; a warm cache shows a high hit rate,
    # meaning the build step recompiled almost nothing. The delta between a
    # cold and a warm run is the proof this change works.
    # The number this whole change is judged on. A cache that restores and hits on
    # nothing looks exactly like a working one; the hit rate is the only thing that
    # can tell them apart, so it is printed unconditionally -- see
    # docs/agent-rules/ci-cache-that-looks-alive.md.
    - name: Show compiler cache stats
      if: always()
      shell: bash
      run: |
        if [ "${{ runner.environment }}" = "github-hosted" ]; then
          sccache --show-stats
        else
          ccache --show-stats
        fi

    # THE LOCAL FOOTPRINT, measured off the directory rather than asked of sccache --
    # the step the asan-windows job has had since #1082, here for the same two reasons
    # plus a third. `--show-stats` ROUNDS: it printed "1 GiB" for this job while the
    # sibling arms printed "973 MiB" and "923 MiB", and "1 GiB" covers everything from
    # 1024 to 2047 MiB, which is the difference between a cap that clears the object
    # set and one that does not. It also reports a FRESH server's zeros if the old one
    # exited (run 34048670103). The directory is on disk either way.
    #
    # THIS IS NOT WHAT THE STORE IS CHARGED. `du` measures the UNCOMPRESSED directory;
    # the actions/cache entry is a compressed tarball of it, and on these three arms
    # that measured ~0.74x -- 923 and 994 MiB dirs banked 686 and 727 MiB entries. So
    # read this as the local footprint, and as a CONSERVATIVE upper bound on the entry.
    # What it measures exactly is the object set, which is what SCCACHE_CACHE_SIZE has
    # to clear; for the store bill, see the budget doc's table of measured entry sizes.
    - name: Measure the sccache directory
      if: always() && runner.environment == 'github-hosted'
      shell: bash
      run: |
        du -sm "${SCCACHE_DIR}" 2>/dev/null || echo "SCCACHE_DIR not present"

    # THE NUMBER THIS CHANGE IS JUDGED ON is the "Cache hits rate" line printed
    # immediately above, on the SECOND nightly after this lands -- not on a green
    # check. #1095's whole subject is an entry that restored perfectly, went green
    # every run and returned zero; see docs/agent-rules/ci-cache-that-looks-alive.md.
    #
    # `save-cache-pruned` rather than a bare save: actions/cache/save reports a
    # REFUSED write (the store past its cap goes read-only) as a warning and exits
    # zero, so the step's own status cannot tell you. This one asks the API whether
    # the save landed and, if it did not, deletes this ref's superseded entries under
    # the same prefix and retries.
    #
    # `if: always()` because most PR runs here are cancelled and a post-job step is
    # skipped on a cancel -- though on this gate that mostly matters for the
    # workflow_dispatch A/B, since pull_request runs do not save at all.
    - name: Save sccache storage
      if: always() && runner.environment == 'github-hosted' && github.event_name != 'pull_request'
      uses: ./.github/actions/save-cache-pruned
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: sccache-tsan-linux-llvm-${{ env.OLO_LINUX_LLVM_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create test results directory
      run: mkdir -p "${GITHUB_WORKSPACE}/test_results"

    # ---- sharded plan: measure, stamp and stage, then let the shards run -----
    #
    # All three steps are skipped when `linux-shards == 1` (the self-hosted arm),
    # where this job runs the suite itself exactly as before.

    # The unsharded total the coverage proof checks the shards against. `ctest -N`
    # only LISTS -- discovery already happened at build time -- so this costs
    # seconds and launches no test process. It reads the SAME exclude regex the
    # shards do, from the job-level env var, because a total measured with a
    # different filter than the shards ran with would prove nothing.
    - name: Measure the unsharded case count
      id: ctest-total
      if: needs.detect-changes.outputs.linux-shards != '1'
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      run: |
        set -euo pipefail
        listing=$(ctest -N --exclude-regex "${OLO_TSAN_LINUX_CTEST_EXCLUDE}")
        total=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p' | tail -1)
        # Digits-only BEFORE the numeric comparison: `[ "$x" -le 0 ]` on a
        # non-numeric $x errors rather than returning false, and a command that
        # errors inside an `if` is exempt from `set -e` -- so anything that is not
        # a number would fall straight through and get published as the total.
        case "${total}" in
          ''|*[!0-9]*)
            echo "::error::ctest -N did not report a numeric total (got '${total:-<empty>}'); discovery is broken."
            exit 1 ;;
        esac
        if [ "${total}" -le 0 ]; then
          echo "::error::ctest -N reported ${total} tests; discovery is broken."
          exit 1
        fi
        echo "total=${total}" >> "$GITHUB_OUTPUT"
        echo "unsharded ctest entries: ${total}"

    # THE EXECUTABLE BIT DOES NOT SURVIVE THE ARTIFACT. actions/upload-artifact
    # stores POSIX modes as 0644, so the downloaded OloEngine-Tests is not
    # executable and every one of ~7600 ctest entries would fail to launch. The
    # Windows shards never hit this because a .exe needs no mode bit; the shard
    # job below restores it explicitly and asserts the binary starts.
    - name: Stamp the build workspace
      if: needs.detect-changes.outputs.linux-shards != '1'
      run: |
        set -euo pipefail
        printf '%s' '${{github.workspace}}' > build/OloEngine/tests/olo-build-workspace.txt
        ls -l build/OloEngine/tests/OloEngine-Tests

    # ONLY WHAT CTEST READS: the generated *_tests.cmake entries, the workspace
    # stamp and the instrumented binary. The Linux sanitizer runtimes are linked
    # statically into the executable, so nothing else has to travel with it.
    - name: Upload the instrumented test tree
      if: needs.detect-changes.outputs.linux-shards != '1'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: tsan-linux-test-tree
        path: |
          build/OloEngine/tests/*.cmake
          build/OloEngine/tests/olo-build-workspace.txt
          build/OloEngine/tests/OloEngine-Tests
        if-no-files-found: error
        retention-days: 1
        compression-level: 1

    - name: Run tests under TSan
      # SHARDED PLAN RUNS THIS ELSEWHERE. `linux-shards` is 1 only on the
      # self-hosted arm, where one runner cannot absorb a matrix; there this
      # job stays exactly what it was. On the hosted arm the shards below run
      # the suite instead and this step is skipped.
      if: needs.detect-changes.outputs.linux-shards == '1'
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      # --timeout 600: covers two known-slow buckets under TSan instrumentation:
      #   1. AssetContentValidity.SandboxAssetRegistryDeserialisesAndPathsResolve
      #      and AssetContentValidity.EverySupportedAssetOnDiskIsInTheRegistry
      #      walk the sandbox project's asset tree (≥10× slowdown on per-file
      #      stat / Deserialize) — exceeded the 180 s default historically.
      #   2. ShaderReflectionBinding.AllProductionShaderBindingsMatchCppLayout
      #      compiles ~100 .glsl files × ~3 stages through shaderc and reflects
      #      via spirv-cross. TSan's happens-before tracking makes shaderc
      #      especially heavy — even 300 s wasn't enough in practice.
      # Every other test finishes in single-digit seconds, so the headroom
      # only bites the known-slow cases — not a fig leaf over hangs.
      #
      # --parallel 2: see the ASan + LSan run step above for the full rationale
      # (one ctest entry per case → engine static-init paid ~3,600× serially; the
      # suite is parallel-safe via PID/case-name temp paths + a mesh-cache
      # RESOURCE_LOCK). TSan is the most memory-heavy sanitizer — its happens-before
      # shadow gives each test process the largest resident footprint of the three —
      # so 2 is deliberately conservative. But two TSan test processes still sit well
      # within the ~16 GB / 4-vCPU runner (each runs a single short-lived gtest case,
      # not the whole suite at once), so 2-wide is safe rather than left serial.
      # Independent of the build step's compile-time `--parallel 2`: that bounds
      # peak compiler RSS, this bounds peak instrumented-test RSS.
      #
      # ServerAuthoritativeLoopTest — drives live GameNetworkingSockets, and trips
      # TSan's lock-order-inversion detector inside vendored GNS. The cycle is real
      # as a graph but unreachable as a deadlock, and GNS documents it:
      #   * create  (ConnectByIPAddress -> BInitConnection): ConnectionLock -> TableLock
      #   * destroy (GameNetworkingSockets_Kill -> KillConnections): TableLock -> ConnectionLock
      # Both locks are the same rank (k_nOrder_ObjectOrTable) and BOTH paths hold
      # SteamNetworkingGlobalLock for their whole duration. GNS's own lock checker
      # explicitly permits same-rank object/table locks in either order while the
      # global lock is held (steamnetworkingsockets_lowlevel_misc.cpp, AboutToLock:
      # "If we hold the global lock, it's OK"), and BInitConnection carries a comment
      # spelling out why creation is safe: the connection is not yet in the table, so
      # no other thread can hold its lock. TSan's detector is a pairwise lock-order
      # graph over mutex ADDRESSES — it models neither the dominating global lock nor
      # object reachability, so it cannot see either guarantee. See #636.
      #
      # McpProgressHttpTest used to be excluded here and is not any more (#787).
      # It was never an httplib teardown bug: the vcpkg port propagates
      # CPPHTTPLIB_USE_NON_BLOCKING_GETADDRINFO (upstream's CMake default, and a
      # silent behaviour change from #773 — the pre-vcpkg header drop set no
      # definitions), which on glibc resolves through getaddrinfo_a() on a thread
      # glibc creates inside libc. TSan never sees that thread, so it has no
      # ThreadState and its first intercepted malloc faults inside TSan's own
      # allocator — a bare SIGSEGV with no report. OloEngine/vendor/CMakeLists.txt
      # now filters that definition off the imported target; see the comment there.
      run: ctest --parallel 2 --output-on-failure --timeout 600 --exclude-regex "${OLO_TSAN_LINUX_CTEST_EXCLUDE}"
      env:
        # suppressions: vendored-code races we accept rather than patch — see
        # the rationale comments in tsan.txt (currently: Jolt's assert-build
        # lock-ownership bookkeeping in JPH::Mutex/SharedMutex).
        TSAN_OPTIONS: external_symbolizer_path=${{ steps.linux.outputs.symbolizer }}:suppressions=${{github.workspace}}/.github/sanitizer-suppressions/tsan.txt:halt_on_error=1:second_deadlock_stack=1:symbolize=1
        # See the symbolizer note in the ASan+LSan job. The claim that used to sit
        # here -- that ASAN_SYMBOLIZER_PATH "is read by every sanitizer runtime, TSan
        # included" -- was measured false on run 34160911722: TSan ignored it and
        # spawned addr2line. `external_symbolizer_path` in TSAN_OPTIONS above is
        # what TSan reads; this variable is kept only so the two jobs look alike.
        ASAN_SYMBOLIZER_PATH: ${{ steps.linux.outputs.symbolizer }}
        GTEST_OUTPUT: xml:${{github.workspace}}/test_results/

    - name: Test report
      # Fork PRs can't write checks (job-level `checks: write` is downgraded
      # to read for forks). Skip the reporter there; same-repo PRs and
      # push/workflow_dispatch runs retain full permissions.
      if: always() && needs.detect-changes.outputs.linux-shards == '1'
        && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: TSan (Linux)
        path: test_results/*.xml
        reporter: java-junit
        fail-on-error: false
        list-tests: 'failed'

  # ---------------------------------------------------------------------------
  # ASan + LSan (Linux) test run, spread across runners (#1083, Linux).
  #
  # EXISTS ONLY ON THE HOSTED ARM. `detect-changes` sets `linux-shards` to 1 when
  # the run routes to the self-hosted box, and this whole job is skipped there --
  # the `olo-ci` label is served by at most two runners and three sanitizer jobs
  # already queue against them, so a matrix would serialise rather than parallelise.
  # On the hosted arm the shard count is 4; see the plan step for the measurement.
  #
  # `runs-on` is a plain literal rather than the routing expression the build jobs
  # carry, and that is not a shortcut: this job cannot run at all unless the plan
  # already chose the hosted arm, so any other value would be unreachable.
  # ---------------------------------------------------------------------------
  asan-lsan-linux-tests:
    name: ASan + LSan (Linux) tests ${{ matrix.shard }}/${{ needs.detect-changes.outputs.linux-shards }}
    needs: [detect-changes, asan-lsan-linux]
    if: ${{ !cancelled() && needs.asan-lsan-linux.result == 'success'
        && needs.detect-changes.outputs.linux-shards != '1' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    strategy:
      # A red shard must not cancel its siblings: they are independent partitions
      # and the coverage proof wants every one of their counts.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.detect-changes.outputs.linux-shard-matrix) }}
    env:
      OLO_CTEST_SHARDS: ${{ needs.detect-changes.outputs.linux-shards }}
      # The SAME exclusion the build job measured its total with. Copied from the
      # build job's literal by construction -- see the note on that env var.
      OLO_ASAN_LSAN_LINUX_CTEST_EXCLUDE: '^NetworkIntegrationTest\.|^WorkerRestartTest\.'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The shards need the Vulkan loader the instrumented binary links against and
    # the llvm-symbolizer the sanitizer runtime resolves reports through, and the
    # cheapest way to get exactly the build job's environment is to run the same
    # action. Measured ~4 min, in parallel across shards, against ~36 min saved.
    - name: Setup Linux build environment
      id: linux
      uses: ./.github/actions/setup-linux-build
      with:
        vulkan-sdk: 'false'
        cache-name: asan-lsan-shard

    - name: Download the instrumented test tree
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: asan-lsan-linux-test-tree
        path: build/OloEngine/tests

    # gtest_discover_tests bakes ABSOLUTE paths into the generated *_tests.cmake,
    # so the tree cannot be moved between the build job and this one. If it were,
    # every add_test() would name a binary that is not there and ctest would fail
    # thousands of times with a confusing message instead of once with this one.
    - name: Assert this runner matches the build job's layout
      run: |
        set -euo pipefail
        built_at=$(cat build/OloEngine/tests/olo-build-workspace.txt)
        here='${{github.workspace}}'
        if [ "$built_at" != "$here" ]; then
          echo "::error::This tree was built at '${built_at}' but this runner checked out at '${here}'. gtest_discover_tests bakes absolute paths into the generated test list, so the tree cannot be moved."
          exit 1
        fi
        exe=build/OloEngine/tests/OloEngine-Tests
        test -f "$exe" || { echo "::error::$exe missing from the artifact"; exit 1; }
        # RESTORE THE EXECUTABLE BIT. actions/upload-artifact stores POSIX modes as
        # 0644, so the binary arrives non-executable and all ~7600 ctest entries
        # would fail to launch with a permission error that names no cause.
        chmod +x "$exe"
        # Prove it starts before running a shard against it (#1083). An instrumented
        # binary that cannot load its runtime dies before main(), which would arrive
        # as thousands of identical ctest failures rather than one readable line.
        if ! "$exe" --gtest_list_tests > /dev/null 2>&1; then
          echo "::error::$exe does not start on this runner. Either the artifact is missing something it needs at load time, or the environment does not match the build job."
          "$exe" --gtest_list_tests || true
          exit 1
        fi

    - name: Create test results directory
      run: mkdir -p '${{github.workspace}}/test_results'

    # A SHARD THAT MATCHED NOTHING MUST FAIL. `ctest -I` selects by stride and
    # silently yields an empty set if the stride is wrong, which would otherwise
    # look like a green shard. The count is also written out for the coverage proof.
    - name: Select this shard's cases
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      env:
        OLO_CTEST_SHARD: ${{ matrix.shard }}
      run: |
        set -euo pipefail
        listing=$(ctest -N \
                    -I "${OLO_CTEST_SHARD},,${OLO_CTEST_SHARDS}" \
                    --exclude-regex "${OLO_ASAN_LSAN_LINUX_CTEST_EXCLUDE}")
        count=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p' | tail -1)
        # Digits-only before the numeric test, for the reason the build job's total
        # spells out: a non-numeric value makes `[ -le ]` error, and an erroring
        # command inside an `if` is exempt from `set -e`.
        case "${count}" in
          ''|*[!0-9]*)
            echo "::error::shard ${OLO_CTEST_SHARD}/${OLO_CTEST_SHARDS} got a non-numeric ctest count ('${count:-<empty>}')."
            exit 1 ;;
        esac
        if [ "${count}" -le 0 ]; then
          echo "::error::shard ${OLO_CTEST_SHARD}/${OLO_CTEST_SHARDS} did not match a positive number of ctest entries."
          exit 1
        fi
        echo "shard ${OLO_CTEST_SHARD}/${OLO_CTEST_SHARDS}: ${count} ctest entries"
        mkdir -p '${{github.workspace}}/shard_counts'
        {
          echo "shard=${OLO_CTEST_SHARD}"
          echo "shards=${OLO_CTEST_SHARDS}"
          echo "count=${count}"
        } > '${{github.workspace}}/shard_counts/shard-'"${OLO_CTEST_SHARD}"'.txt'

    - name: Run tests under ASan + LSan
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      run: ctest --parallel 2 --output-on-failure --timeout 600 -I "${{ matrix.shard }},,${OLO_CTEST_SHARDS}" --exclude-regex "${OLO_ASAN_LSAN_LINUX_CTEST_EXCLUDE}"
      env:
        # THE SYMBOLIZER IS NAMED IN *_OPTIONS, NOT ONLY IN ASAN_SYMBOLIZER_PATH.
        #
        # The sanitizer runtime resolves `llvm-symbolizer` from PATH, and the pinned
        # LLVM prefix is deliberately kept OFF the system PATH (see setup-linux-build).
        # Finding nothing, it does NOT print bare hex and move on -- it falls back to
        # binutils `addr2line`, one process per test process, and addr2line reads the
        # ENTIRE DWARF of the binary. For a Debug sanitizer build of OloEngine-Tests
        # that is ~7.5 GB each. MEASURED on run 34160911722 (#1111): two of them at
        # 7.2-8.0 GB with MemAvailable at 41 MiB, then `The runner has received a
        # shutdown signal`. The test processes were at ~0.2 GB. Every hosted TSan run
        # since the pin died this way, at the physics block, because that is where
        # tsan.txt's suppressed Jolt races make TSan symbolize during PASSING tests.
        #
        # ASAN_SYMBOLIZER_PATH alone did not prevent it: the same run had it set to
        # the right path and still spawned addr2line -- the TSan runtime does not read
        # that variable. `external_symbolizer_path` is the common-runtime flag every
        # sanitizer honours, so it goes into each *_OPTIONS; the env var stays for
        # ASan, which does read it.
        #
        # AN EMPTY VALUE DISABLES SYMBOLIZATION rather than falling back to addr2line
        # ("External symbolizer is explicitly disabled"). That is the failure mode
        # wanted here: a job whose toolchain cannot symbolize should print hex, not
        # eat the VM. setup-linux-build already warns when it resolves nothing.
        ASAN_SYMBOLIZER_PATH: ${{ steps.linux.outputs.symbolizer }}
        ASAN_OPTIONS: external_symbolizer_path=${{ steps.linux.outputs.symbolizer }}:halt_on_error=1:detect_leaks=1:symbolize=1
        LSAN_OPTIONS: suppressions=${{github.workspace}}/.github/sanitizer-suppressions/lsan.txt:symbolize=1
        GTEST_OUTPUT: xml:${{github.workspace}}/test_results/

    - name: Upload this shard's test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: asan-lsan-linux-test-results-shard-${{ matrix.shard }}
        path: test_results/*.xml
        if-no-files-found: warn
        retention-days: 1

    - name: Upload this shard's case count
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: asan-lsan-linux-shard-count-${{ matrix.shard }}
        path: shard_counts/shard-${{ matrix.shard }}.txt
        if-no-files-found: warn
        retention-days: 1

  # ---------------------------------------------------------------------------
  # Proof that the shards partitioned the whole suite: every shard reported, all
  # agreeing on N, none empty, and the counts summing to the unsharded total the
  # build job measured. Without it, sharding introduces a way for the suite to
  # shrink silently.
  # ---------------------------------------------------------------------------
  asan-lsan-linux-tests-verify:
    name: ASan + LSan (Linux) shard coverage
    needs: [detect-changes, asan-lsan-linux, asan-lsan-linux-tests]
    # `!cancelled()` rather than `always()`: a cancelled run can leave the build
    # job 'success' while the shards were killed mid-flight, and `always()` would
    # then post a red "a shard did not complete" on a run nobody abandoned for a
    # reason worth reading. Braced because a bare leading `!` is a YAML tag.
    if: ${{ !cancelled() && needs.asan-lsan-linux.result == 'success'
        && needs.detect-changes.outputs.linux-shards != '1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the shard case counts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: asan-lsan-linux-shard-count-*
        path: shard_counts
      # A shard that died before writing its count uploads nothing, and this step
      # would then fail on "no artifacts found" -- a worse message than the
      # script's. Let it through and let the union check name the missing shard.
      continue-on-error: true

    - name: Prove the shards covered the whole suite
      run: >
        python3 scripts/verify_test_shards.py
        --dir shard_counts
        --label "ASan + LSan (Linux)"
        --expected-total ${{ needs.asan-lsan-linux.outputs.ctest-total }}

    # NO `merge-multiple`. GTEST_OUTPUT writes into a directory and gtest names the
    # files itself, so every shard produces the SAME filenames; merging would have
    # them overwrite each other and the report would look complete while missing
    # real failures. One directory per artifact, and a `**` glob below.
    - name: Download the shard test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: asan-lsan-linux-test-results-shard-*
        path: test_results
      continue-on-error: true

    - name: Test report
      # Fork PRs can't write checks (job-level `checks: write` is downgraded to
      # read for forks). Skip the reporter there.
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: ASan + LSan (Linux)
        path: test_results/**/*.xml
        reporter: java-junit
        fail-on-error: false
        list-tests: 'failed'

  # ---------------------------------------------------------------------------
  # UBSan (Linux) test run, spread across runners (#1083, Linux).
  #
  # EXISTS ONLY ON THE HOSTED ARM. `detect-changes` sets `linux-shards` to 1 when
  # the run routes to the self-hosted box, and this whole job is skipped there --
  # the `olo-ci` label is served by at most two runners and three sanitizer jobs
  # already queue against them, so a matrix would serialise rather than parallelise.
  # On the hosted arm the shard count is 4; see the plan step for the measurement.
  #
  # `runs-on` is a plain literal rather than the routing expression the build jobs
  # carry, and that is not a shortcut: this job cannot run at all unless the plan
  # already chose the hosted arm, so any other value would be unreachable.
  # ---------------------------------------------------------------------------
  ubsan-linux-tests:
    name: UBSan (Linux) tests ${{ matrix.shard }}/${{ needs.detect-changes.outputs.linux-shards }}
    needs: [detect-changes, ubsan-linux]
    if: ${{ !cancelled() && needs.ubsan-linux.result == 'success'
        && needs.detect-changes.outputs.linux-shards != '1' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    strategy:
      # A red shard must not cancel its siblings: they are independent partitions
      # and the coverage proof wants every one of their counts.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.detect-changes.outputs.linux-shard-matrix) }}
    env:
      OLO_CTEST_SHARDS: ${{ needs.detect-changes.outputs.linux-shards }}
      # The SAME exclusion the build job measured its total with. Copied from the
      # build job's literal by construction -- see the note on that env var.
      OLO_UBSAN_LINUX_CTEST_EXCLUDE: '^NetworkIntegrationTest\.|^NetworkManagerTest\.|^NetworkThreadDispatchTest\.|^ServerAuthoritativeLoopTest\.|^WorkerRestartTest\.'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The shards need the Vulkan loader the instrumented binary links against and
    # the llvm-symbolizer the sanitizer runtime resolves reports through, and the
    # cheapest way to get exactly the build job's environment is to run the same
    # action. Measured ~4 min, in parallel across shards, against ~36 min saved.
    - name: Setup Linux build environment
      id: linux
      uses: ./.github/actions/setup-linux-build
      with:
        vulkan-sdk: 'false'
        cache-name: ubsan-shard

    - name: Download the instrumented test tree
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ubsan-linux-test-tree
        path: build/OloEngine/tests

    # gtest_discover_tests bakes ABSOLUTE paths into the generated *_tests.cmake,
    # so the tree cannot be moved between the build job and this one. If it were,
    # every add_test() would name a binary that is not there and ctest would fail
    # thousands of times with a confusing message instead of once with this one.
    - name: Assert this runner matches the build job's layout
      run: |
        set -euo pipefail
        built_at=$(cat build/OloEngine/tests/olo-build-workspace.txt)
        here='${{github.workspace}}'
        if [ "$built_at" != "$here" ]; then
          echo "::error::This tree was built at '${built_at}' but this runner checked out at '${here}'. gtest_discover_tests bakes absolute paths into the generated test list, so the tree cannot be moved."
          exit 1
        fi
        exe=build/OloEngine/tests/OloEngine-Tests
        test -f "$exe" || { echo "::error::$exe missing from the artifact"; exit 1; }
        # RESTORE THE EXECUTABLE BIT. actions/upload-artifact stores POSIX modes as
        # 0644, so the binary arrives non-executable and all ~7600 ctest entries
        # would fail to launch with a permission error that names no cause.
        chmod +x "$exe"
        # Prove it starts before running a shard against it (#1083). An instrumented
        # binary that cannot load its runtime dies before main(), which would arrive
        # as thousands of identical ctest failures rather than one readable line.
        if ! "$exe" --gtest_list_tests > /dev/null 2>&1; then
          echo "::error::$exe does not start on this runner. Either the artifact is missing something it needs at load time, or the environment does not match the build job."
          "$exe" --gtest_list_tests || true
          exit 1
        fi

    - name: Create test results directory
      run: mkdir -p '${{github.workspace}}/test_results'

    # A SHARD THAT MATCHED NOTHING MUST FAIL. `ctest -I` selects by stride and
    # silently yields an empty set if the stride is wrong, which would otherwise
    # look like a green shard. The count is also written out for the coverage proof.
    - name: Select this shard's cases
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      env:
        OLO_CTEST_SHARD: ${{ matrix.shard }}
      run: |
        set -euo pipefail
        listing=$(ctest -N \
                    -I "${OLO_CTEST_SHARD},,${OLO_CTEST_SHARDS}" \
                    --exclude-regex "${OLO_UBSAN_LINUX_CTEST_EXCLUDE}")
        count=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p' | tail -1)
        # Digits-only before the numeric test, for the reason the build job's total
        # spells out: a non-numeric value makes `[ -le ]` error, and an erroring
        # command inside an `if` is exempt from `set -e`.
        case "${count}" in
          ''|*[!0-9]*)
            echo "::error::shard ${OLO_CTEST_SHARD}/${OLO_CTEST_SHARDS} got a non-numeric ctest count ('${count:-<empty>}')."
            exit 1 ;;
        esac
        if [ "${count}" -le 0 ]; then
          echo "::error::shard ${OLO_CTEST_SHARD}/${OLO_CTEST_SHARDS} did not match a positive number of ctest entries."
          exit 1
        fi
        echo "shard ${OLO_CTEST_SHARD}/${OLO_CTEST_SHARDS}: ${count} ctest entries"
        mkdir -p '${{github.workspace}}/shard_counts'
        {
          echo "shard=${OLO_CTEST_SHARD}"
          echo "shards=${OLO_CTEST_SHARDS}"
          echo "count=${count}"
        } > '${{github.workspace}}/shard_counts/shard-'"${OLO_CTEST_SHARD}"'.txt'

    - name: Run tests under UBSan
      working-directory: ${{github.workspace}}/build/OloEngine/tests
      run: ctest --parallel 2 --output-on-failure --timeout 600 -I "${{ matrix.shard }},,${OLO_CTEST_SHARDS}" --exclude-regex "${OLO_UBSAN_LINUX_CTEST_EXCLUDE}"
      env:
        # THE SYMBOLIZER IS NAMED IN *_OPTIONS, NOT ONLY IN ASAN_SYMBOLIZER_PATH.
        #
        # The sanitizer runtime resolves `llvm-symbolizer` from PATH, and the pinned
        # LLVM prefix is deliberately kept OFF the system PATH (see setup-linux-build).
        # Finding nothing, it does NOT print bare hex and move on -- it falls back to
        # binutils `addr2line`, one process per test process, and addr2line reads the
        # ENTIRE DWARF of the binary. For a Debug sanitizer build of OloEngine-Tests
        # that is ~7.5 GB each. MEASURED on run 34160911722 (#1111): two of them at
        # 7.2-8.0 GB with MemAvailable at 41 MiB, then `The runner has received a
        # shutdown signal`. The test processes were at ~0.2 GB. Every hosted TSan run
        # since the pin died this way, at the physics block, because that is where
        # tsan.txt's suppressed Jolt races make TSan symbolize during PASSING tests.
        #
        # ASAN_SYMBOLIZER_PATH alone did not prevent it: the same run had it set to
        # the right path and still spawned addr2line -- the TSan runtime does not read
        # that variable. `external_symbolizer_path` is the common-runtime flag every
        # sanitizer honours, so it goes into each *_OPTIONS; the env var stays for
        # ASan, which does read it.
        #
        # AN EMPTY VALUE DISABLES SYMBOLIZATION rather than falling back to addr2line
        # ("External symbolizer is explicitly disabled"). That is the failure mode
        # wanted here: a job whose toolchain cannot symbolize should print hex, not
        # eat the VM. setup-linux-build already warns when it resolves nothing.
        ASAN_SYMBOLIZER_PATH: ${{ steps.linux.outputs.symbolizer }}
        UBSAN_OPTIONS: external_symbolizer_path=${{ steps.linux.outputs.symbolizer }}:halt_on_error=1:print_stacktrace=1:symbolize=1
        GTEST_OUTPUT: xml:${{github.workspace}}/test_results/

    - name: Upload this shard's test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ubsan-linux-test-results-shard-${{ matrix.shard }}
        path: test_results/*.xml
        if-no-files-found: warn
        retention-days: 1

    - name: Upload this shard's case count
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ubsan-linux-shard-count-${{ matrix.shard }}
        path: shard_counts/shard-${{ matrix.shard }}.txt
        if-no-files-found: warn
        retention-days: 1

  # ---------------------------------------------------------------------------
  # Proof that the shards partitioned the whole suite: every shard reported, all
  # agreeing on N, none empty, and the counts summing to the unsharded total the
  # build job measured. Without it, sharding introduces a way for the suite to
  # shrink silently.
  # ---------------------------------------------------------------------------
  ubsan-linux-tests-verify:
    name: UBSan (Linux) shard coverage
    needs: [detect-changes, ubsan-linux, ubsan-linux-tests]
    # `!cancelled()` rather than `always()`: a cancelled run can leave the build
    # job 'success' while the shards were killed mid-flight, and `always()` would
    # then post a red "a shard did not complete" on a run nobody abandoned for a
    # reason worth reading. Braced because a bare leading `!` is a YAML tag.
    if: ${{ !cancelled() && needs.ubsan-linux.result == 'success'
        && needs.detect-changes.outputs.linux-shards != '1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the shard case counts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ubsan-linux-shard-count-*
        path: shard_counts
      # A shard that died before writing its count uploads nothing, and this step
      # would then fail on "no artifacts found" -- a worse message than the
      # script's. Let it through and let the union check name the missing shard.
      continue-on-error: true

    - name: Prove the shards covered the whole suite
      run: >
        python3 scripts/verify_test_shards.py
        --dir shard_counts
        --label "UBSan (Linux)"
        --expected-total ${{ needs.ubsan-linux.outputs.ctest-total }}

    # NO `merge-multiple`. GTEST_OUTPUT writes into a directory and gtest names the
    # files itself, so every shard produces the SAME filenames; merging would have
    # them overwrite each other and the report would look complete while missing
    # real failures. One directory per artifact, and a `**` glob below.
