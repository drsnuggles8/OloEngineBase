name: Vulkan Software Conformance

# Runs the device-backed Vulkan test suites against Mesa's software Vulkan ICD
# (lavapipe) on a GitHub-hosted Windows runner — the Vulkan twin of
# cross-vendor.yml, which does the same for OpenGL with llvmpipe (issue #1301).
#
# WHY IT EXISTS
# -------------
# `VulkanPassSuite` alone is 58 tests that run the render graph on a real Vulkan
# device and assert on read-back pixels, and before this job they executed in NO
# automated job. Hardware Vulkan is unavailable everywhere this repo's CI runs:
# hosted runners have no GPU, and the self-hosted AMD box cannot host the suite
# because RADV does not implement VK_EXT_descriptor_heap, which ADR 0010's
# capability contract requires. So the tests ran only when a developer on a
# Vulkan-capable box chose to run them, and
# `VulkanPassSuite.FoliageInstancePullDrawsThreeTintedCards` carried a stale
# brightness assertion from #1234 for months because of it.
#
# WHAT MAKES IT POSSIBLE, AND WHAT PINS THE MESA VERSION
# ------------------------------------------------------
# lavapipe has to satisfy the same ADR 0010 contract as any other device:
# Vulkan 1.4, VK_KHR_swapchain, VK_EXT_descriptor_heap,
# VK_KHR_shader_untyped_pointers and VK_KHR_device_address_commands, each with
# its feature bit. Mesa 26.1.8's lavapipe is Vulkan 1.4 but exposes NONE of the
# last three; Mesa 26.2.0's exposes all three with every feature bit true. So
# the pin below is a hard floor, not a preference — dropping to any earlier
# release makes the gate refuse and the job fail (by design, see
# `--olo-require-vulkan` below). Measurements and the full extension table:
# docs/agent-rules/vulkan-software-driver-ci.md.
#
# THE SCENE SUITE (#1556)
# -----------------------
# A second process of the same binary, `--olo-rhi=vulkan`, runs the
# RendererAttachedTest scene family on a windowless VulkanContext: the full
# Renderer3D pipeline, frame by frame, with no display. That is the
# cross-path matrix's Vulkan arms and the groom, VSM and shadow evidence,
# which before this ran only in a live editor session. Its own step and its
# own missing-execution gate below; the filter is OloEngine/tests/vulkan_scene_filter.txt.
#
# WHAT IT DOES NOT PROVE
# ----------------------
# Nothing about any hardware driver. lavapipe is a software implementation, not
# a fourth vendor: it catches spec-compliance drift and stale assertions, not
# driver divergence. Hardware-Vulkan coverage remains a developer-box
# capability.

on:
  workflow_dispatch:
    inputs:
      gtest_filter:
        # Diagnostic only (#1358/#1294): lets a dispatch measure a different
        # population. Empty keeps the nightly filter. The ray-query gate after
        # the suites still requires every L7 case, so a filter that drops one
        # fails the job by design; that is the gate's negative control.
        description: 'gtest filter override (empty = the nightly filter)'
        type: string
        default: ''
      scene_gtest_filter:
        # Diagnostic only (#1556), the scene step's twin of gtest_filter. Empty
        # keeps OloEngine/tests/vulkan_scene_filter.txt. The scene gate lists the cases from the
        # SAME filter, so a narrower one is a smaller required set, not a red.
        description: 'scene-suite gtest filter override (empty = the nightly filter)'
        type: string
        default: ''
      ray_query_off:
        # Negative control for the ray-query gate (#1294): sets the engine's
        # OLO_VULKAN_NO_RAY_TRACING lever, so every L7 case skips at its
        # fixture while the Vulkan* suites still run. The job must go red.
        description: 'force ray query off (the gate must then fail the job)'
        type: boolean
        default: false
  schedule:
    # Nightly at 04:23 UTC — after cross-vendor.yml's 03:47 so the two software
    # jobs do not contend for hosted concurrency, and on an odd minute to avoid
    # the on-the-hour surge.
    - cron: '23 4 * * *'
  pull_request:
    # ANTI-ROT ONLY, not per-PR gating. #1301's scope boundary is explicit that
    # the Vulkan suite must not sit on the PR critical path, and this filter
    # keeps it off: an ordinary renderer PR pays nothing. A PR that edits this
    # file, or the capability contract that decides whether lavapipe still
    # qualifies, gets the job — because those are the two changes that can
    # silently turn a green nightly into a job that verifies nothing. Same trade
    # vulkan-off.yml and steam-stub.yml make for their filters.
    paths:
      - '.github/workflows/vulkan-software.yml'
      - 'OloEngine/src/Platform/Vulkan/VulkanCapabilities.*'
      - 'scripts/vulkan_ray_query_coverage.py'
      # The windowless frame bracket and the test process that drives it (#1556).
      - 'OloEngine/src/Platform/Vulkan/VulkanContext.*'
      - 'OloEngine/tests/Rendering/PropertyTests/TestRenderBackend.*'
      - 'OloEngine/tests/vulkan_scene_filter.txt'

# Read-only: this job builds and runs tests, it never comments, labels or
# publishes. Declared explicitly so a future step cannot quietly acquire write
# scopes.
permissions:
  contents: read

# A dispatch is a one-off measurement (a gtest_filter or a negative control),
# so each gets its own group: two dispatched on one branch must not cancel
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # See the header: 26.2.0 is the FIRST Mesa release whose lavapipe satisfies
  # ADR 0010. Bump forward freely; never back.
  MESA_VERSION: '26.2.0'
  # The scene suite the --olo-rhi=vulkan step runs and its gate requires
  # (#1556) is OloEngine/tests/vulkan_scene_filter.txt, which the
  # OloEngine-Tests_VulkanScene ctest entry reads too: the renderer-attached smoke cases (less the GL-state one, which
  # skips on Vulkan by design), the cross-path matrix's native Vulkan arms (less
  # the rows whose estimator a raster arm does not host: ReSTIR needs ray query,
  # SSGI is Deferred-only), and the groom, shadow atlas, VSM and PCSS evidence.
  # A case added to these suites joins the requirement automatically; a NEW
  # suite must be added here. Ported but left to hardware for runtime: the
  # shadow-family evidence (one terrain case ran past 20 min on lavapipe in a
  # Debug build) and the dog showcase (hours on the RTX 4090).
  # FOUR GroomSceneShadow cases are excluded (#1652): with the shadow region
  # forked and split for the groom opaque copies they shade the fur with
  # garbage, every time on lavapipe 26.2.0 and on a loaded hardware GPU, with
  # no validation error. Delete the four exclusions when #1652 closes.
  # The rest of that suite runs one case per process (#1666, see the scene
  # step); return it to the shared process when #1666 closes.

jobs:
  lavapipe:
    name: Windows / Mesa lavapipe (software Vulkan)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore full model and groom assets
        uses: ./.github/actions/restore-lfs-assets

      - name: Install Python 3.10
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install python dependencies
        run: |
          # jinja2 pinned for githubactions:S8544 (lock resolved versions); bump deliberately.
          python -m pip install jinja2==3.1.6

      # Seconds, and ahead of the 2 h build: a broken gate should fail before
      # the job spends the build on it.
      - name: Check the ray-query coverage gate
        run: python -m unittest discover -s scripts -p test_vulkan_ray_query_coverage.py

      - name: Setup Vulkan SDK
        uses: ./.github/actions/setup-vulkan

      # Third-party deps come from the vcpkg manifest (issue #773).
      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows-static-md

      - name: Configure CMake
        # Option set copied from cross-vendor.yml for the same reason: this job
        # tests GPU-backend conformance, not video decode or DCC interchange, so
        # it skips the ~15 min FFmpeg-from-source build and the USD/Alembic/
        # MaterialX ports.
        #
        # NO SCCACHE, and the honest reason is NOT the one cross-vendor.yml
        # gives. That file says its ~25 min wall clock "is dominated by the
        # llvmpipe TEST run, not the build", so caching the build is not worth
        # it. Measured on its 2026-09-19 nightly (run 35419666930), that job is
        # 2 h 45 m: build 2 h 37 m, test run 2 m 24 s. The claim is inverted and
        # the figure is off by more than 6x -- filed as a follow-up rather than
        # fixed here, since it is another job's design.
        #
        # The real reason is mechanical and unchanged: the default Visual Studio
        # (MSBuild) generator IGNORES CMAKE_<LANG>_COMPILER_LAUNCHER, so sccache
        # cannot engage without switching to Ninja (+ ilammy/msvc-dev-cmd,
        # forcing cl.exe, LTO OFF, and Windows.yml's C#-project trade-off). That
        # switch is worth a real look for BOTH software jobs, because the build
        # is in fact the entire cost -- but it is a separate change, not a rider
        # on standing this job up.
        run: cmake -S . -B build -DPython_EXECUTABLE="${{ steps.py.outputs.python-path }}" -DOLO_VIDEO_FFMPEG=OFF -DOLO_WITH_USD=OFF -DOLO_WITH_ALEMBIC=OFF -DOLO_WITH_MATERIALX=OFF ${{ steps.vcpkg.outputs.toolchain-args }}

      # The other half of setup-vcpkg's restore/save split (#1009). `if: always()`
      # is the whole point: the combined actions/cache action saves in a POST-JOB
      # step, which a CANCELLED job skips. Placed before the build so a
      # cancellation during the long build/test tail still banks the ports.
      - name: Save vcpkg binary cache
        if: always()
        # A cache save must never fail the job it is attached to.
        continue-on-error: true
        uses: ./.github/actions/save-vcpkg-cache
        with:
          key: ${{ steps.vcpkg.outputs.cache-key }}
          path: ${{ steps.vcpkg.outputs.cache-path }}

      - name: Build tests
        run: cmake --build build --target OloEngine-Tests --config ${{env.BUILD_TYPE}} --parallel

      - name: Download Mesa3D (lavapipe Vulkan ICD + llvmpipe OpenGL)
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/${{env.MESA_VERSION}}/mesa3d-${{env.MESA_VERSION}}-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa3d.7z
          7z x mesa3d.7z -omesa3d -y | Out-Null

          # The Vulkan half: the loader is pointed at the ICD manifest in place
          # (see VK_DRIVER_FILES below) rather than the DLL being copied next to
          # the binary, because vulkan_lvp.dll is loaded BY the manifest's
          # relative library_path, not by the app's DLL search order. Copying it
          # to the test directory without the manifest would do nothing at all.
          $icd = (Resolve-Path 'mesa3d\x64\lvp_icd.x86_64.json').Path
          if (-not (Test-Path $icd)) { throw "lavapipe ICD manifest missing from the Mesa archive" }
          "OLO_LAVAPIPE_ICD=$icd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # REGISTER THE ICD IN THE REGISTRY, because the env vars are not
          # enough HERE. The Vulkan loader reads VK_DRIVER_FILES /
          # VK_ICD_FILENAMES through its secure-getenv path, which returns
          # nothing for a process running with elevated privileges -- and
          # GitHub's Windows runners run steps as an administrator. The loader
          # then falls back to registry enumeration, finds no driver on a
          # GPU-less runner, and vkCreateInstance returns
          # ERROR_INCOMPATIBLE_DRIVER with "windows_read_data_files_in_registry:
          # Registry lookup failed to get ICD manifest files".
          #
          # This does not reproduce on a developer box, where the shell is not
          # elevated and the env vars work exactly as documented. Registering
          # the manifest is the loader's own discovery mechanism on Windows and
          # works either way, so it is the belt; the env vars below stay as the
          # braces, and they are what keeps a developer's local repro honest.
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Name $icd -PropertyType DWord -Value 0 -Force | Out-Null

          # The OpenGL half, from the same archive. The Vulkan suites run inside
          # the shared test process, which brings up a GL context for the
          # non-Vulkan fixtures and restores it around every
          # ScopedVulkanRenderCommandSelection. A hosted runner has no GL driver
          # at all, so without llvmpipe here the process would be fighting a
          # missing context while trying to prove something about Vulkan.
          $testDir = 'build\OloEngine\tests\${{env.BUILD_TYPE}}'
          Copy-Item -Force mesa3d\x64\opengl32.dll $testDir\
          Copy-Item -Force mesa3d\x64\libgallium_wgl.dll $testDir\ -ErrorAction SilentlyContinue

      - name: Report the lavapipe device the loader will pick
        shell: pwsh
        # Cheap, and it is the first thing anyone reads when this job goes red:
        # it prints the ICD's advertised API version before a single test runs,
        # so "Mesa moved under us" is one line rather than an archaeology
        # session through 58 identical skip messages.
        env:
          VK_DRIVER_FILES: ${{ env.OLO_LAVAPIPE_ICD }}
          VK_ICD_FILENAMES: ${{ env.OLO_LAVAPIPE_ICD }}
        run: |
          Get-Content $env:VK_DRIVER_FILES
          & "$env:VULKAN_SDK\Bin\vulkaninfoSDK.exe" --summary

      - name: Vulkan capability report (lavapipe)
        # Report-only: a failure here must never stop the suite step below.
        continue-on-error: true
        working-directory: OloEditor
        shell: pwsh
        # #1358: the engine's own reader, on this driver, published in the job
        # summary. Report-only; the suite step below is the gate. It is the
        # measured answer to "does this software driver satisfy ADR 0010, and
        # does the real gate enable ray query on it" for docs/agent-rules/
        # vulkan-support-matrix.md, from a log anyone can open.
        env:
          VK_DRIVER_FILES: ${{ env.OLO_LAVAPIPE_ICD }}
          VK_ICD_FILENAMES: ${{ env.OLO_LAVAPIPE_ICD }}
          OLO_RAY_QUERY_OFF: ${{ inputs.ray_query_off }}
        run: |
          if ($env:OLO_RAY_QUERY_OFF -eq 'true') { $env:OLO_VULKAN_NO_RAY_TRACING = '1' }
          New-Item -ItemType Directory -Force ..\test_results | Out-Null
          ..\build\OloEngine\tests\${{env.BUILD_TYPE}}\OloEngine-Tests.exe --olo-vulkan-capability-report=..\test_results\vulkan_capability_report.md
          Get-Content ..\test_results\vulkan_capability_report.md | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Run the Vulkan suites under lavapipe
        working-directory: OloEditor
        # See docs/agent-rules/vulkan-software-driver-ci.md for the measured
        # figure this cap is set against; the llvmpipe GL job is ~25 min for
        # comparison. Capped well under the default 6-hour job timeout so a hung
        # OloEngine-Tests.exe is killed rather than burning runner minutes.
        timeout-minutes: 90
        env:
          # BOTH spellings on purpose: VK_DRIVER_FILES is the current loader
          # variable, VK_ICD_FILENAMES its deprecated predecessor, and which one
          # a given vulkan-1.dll honours depends on the loader the SDK installed.
          # Naming one ICD also makes the run deterministic rather than
          # "whatever the runner image happens to register".
          VK_DRIVER_FILES: ${{ env.OLO_LAVAPIPE_ICD }}
          VK_ICD_FILENAMES: ${{ env.OLO_LAVAPIPE_ICD }}
          # llvmpipe selectors for the GL context the shared test process brings up.
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          # Read as data, never interpolated into the script (see the AMD workflow).
          OLO_GTEST_FILTER: ${{ inputs.gtest_filter }}
          OLO_RAY_QUERY_OFF: ${{ inputs.ray_query_off }}
        # THE FLAG THAT MAKES THIS JOB WORTH HAVING IS `--olo-require-vulkan`
        # (issue #1300). Every device-gated Vulkan test skips cleanly when no
        # usable device is present, so without it this job would report GREEN on
        # zero coverage the first time a Mesa bump, a contract change or a
        # missing ICD made the gate refuse — which #1301 names as worse than
        # having no job at all. With it the gate FAILs the first refused test,
        # and `main` additionally returns 3 when no device-gated test executed
        # at all (the case a `--gtest_filter` typo would otherwise hide).
        #
        # --olo-golden-vendor scopes goldens to
        # OloEditor/assets/tests/golden/lavapipe/, since the committed set is
        # baselined on NVIDIA hardware and a software rasteriser will not match
        # it; maintainers promote a lavapipe set by committing PNGs there.
        # --olo-perf-machine tags perf-history rows so they never clobber a
        # hardware baseline.
        #
        # The filter is the Vulkan-named suites plus the three L7 ray-query
        # suites (#1294), which lavapipe 26.2.0 serves through the real gate
        # (#1358). ReSTIRPTDevice used to time out here: llvmpipe JIT-compiles a
        # fragment shader at its FIRST draw, on the queue thread, so that one
        # fence wait paid a ~40 s LLVM compile. The fixture's fence budget is
        # now derived from the device (DeviceFenceWaitBudgetNs), not shrunk
        # work, and the closure oracles that caught #1288 still go red here
        # under the stale flags lane. A green step alone does not prove the
        # ray-query cases ran; the gate step after this one does.
        #
        # ONE TEST IS EXCLUDED, AND IT IS A DRIVER DEFECT, NOT AN ENGINE ONE.
        # FramebufferBlitPreservesUnrequestedDepthStencilAspects asserts that a
        # single-aspect copy/resolve onto a combined depth/stencil image leaves
        # the OTHER aspect alone. lavapipe 26.2.0 overwrites it — all 8
        # depth-only permutations lose the destination's stencil, and the
        # stencil-only ones symmetrically lose its depth, with the validation
        # layers reporting nothing, so this is legal usage returning the wrong
        # result. The same binary passes all 24 permutations on NVIDIA. The
        # test keeps running on developer hardware, which is where it has
        # always run; excluding it here costs no coverage that existed before
        # this job. Re-test it on the next Mesa bump and delete this exclusion
        # when it passes — docs/agent-rules/vulkan-software-driver-ci.md has
        # the measurement.
        run: |
          if ($env:OLO_RAY_QUERY_OFF -eq 'true') { $env:OLO_VULKAN_NO_RAY_TRACING = '1' }
          $filter = if ($env:OLO_GTEST_FILTER) { $env:OLO_GTEST_FILTER } else { 'Vulkan*:VirtualShadowMapVulkanShaders*:RayTracingDevice.*:GpuPathTracerDevice.*:ReSTIRPTDevice.*-VulkanDrawPath.FramebufferBlitPreservesUnrequestedDepthStencilAspects' }
          ..\build\OloEngine\tests\${{env.BUILD_TYPE}}\OloEngine-Tests.exe "--gtest_filter=$filter" --olo-require-vulkan --olo-golden-vendor=lavapipe --olo-perf-machine=ci-lavapipe-windows --gtest_catch_exceptions=1 --gtest_output=xml:..\test_results\vulkan_software.xml

      # THE MISSING-EXECUTION GATE (#1294). Every ray-query fixture skips
      # cleanly when the device cannot trace rays, and --olo-require-vulkan does
      # not see that: it fails only a refused DEVICE, and the Vulkan* suites
      # keep the run "exercised" either way. So this step requires, from the
      # XML, that every case the three suites define executed. The defined set
      # comes from --gtest_list_tests, not the XML, so a case a filter dropped
      # counts as not run instead of vanishing. The one exemption is the
      # #1240 vegetation experiment, which runs only on --olo-vegetation-
      # experiment. always(): a red suite step must still say what ran.
      - name: Require every L7 ray-query case to execute
        if: always()
        working-directory: OloEditor
        shell: pwsh
        env:
          VK_DRIVER_FILES: ${{ env.OLO_LAVAPIPE_ICD }}
          VK_ICD_FILENAMES: ${{ env.OLO_LAVAPIPE_ICD }}
        run: |
          $suites = 'RayTracingDevice', 'GpuPathTracerDevice', 'ReSTIRPTDevice'
          $listFilter = ($suites | ForEach-Object { $_ + '.*' }) -join ':'
          & "..\build\OloEngine\tests\$env:BUILD_TYPE\OloEngine-Tests.exe" --gtest_list_tests "--gtest_filter=$listFilter" *> ..\test_results\ray_query_cases.txt
          # A failed listing leaves a partial defined set, which would let a dropped case pass.
          if ($LASTEXITCODE -ne 0) { Write-Error "--gtest_list_tests exited $LASTEXITCODE; the required case set is unknown"; exit 1 }
          $suiteArgs = $suites | ForEach-Object { '--suite', $_ }
          python ..\scripts\vulkan_ray_query_coverage.py --require --title 'L7 ray-query suites on lavapipe' `
            --report ..\test_results\vulkan_software.xml --expected-list ..\test_results\ray_query_cases.txt `
            --capability-report ..\test_results\vulkan_capability_report.md `
            --allow-skip RayTracingDevice.VegetationDetailedVersusCardExperiment @suiteArgs
          exit $LASTEXITCODE

      # THE SCENE SUITE ON THE WINDOWLESS VULKAN CONTEXT (#1556). Its own
      # process: one process holds one backend, and --olo-rhi=vulkan selects
      # Vulkan before any test runs, so no GL context is made (the llvmpipe env
      # the step above sets is not needed here). --olo-require-vulkan fails a
      # refused bring-up; each frame also fails on a validation error or an
      # unimplemented-stub hit, the Vulkan counterpart of the GL error drain.
      # !cancelled(): a red L7 step must not hide the scene suite's verdict.
      #
      # THE GROOM SUITE RUNS ONE CASE PER PROCESS (#1666). On lavapipe, once a
      # process has rendered Forward, Forward+ and Deferred in that order --
      # across any cases, ShadowAtlas's included -- the next Forward frame loses
      # the sun's direct light, so whichever groom case follows fails. Every
      # case passes alone, so each gets its own process; the rest of the filter
      # stays one. Each writes its own XML and the gate below reads them all.
      - name: Run the scene suite on the windowless Vulkan context (lavapipe)
        if: ${{ !cancelled() }}
        working-directory: OloEditor
        timeout-minutes: 90
        env:
          VK_DRIVER_FILES: ${{ env.OLO_LAVAPIPE_ICD }}
          VK_ICD_FILENAMES: ${{ env.OLO_LAVAPIPE_ICD }}
          OLO_SCENE_FILTER_OVERRIDE: ${{ inputs.scene_gtest_filter }}
        run: |
          $filter = if ($env:OLO_SCENE_FILTER_OVERRIDE) { $env:OLO_SCENE_FILTER_OVERRIDE } else { (Get-Content ..\OloEngine\tests\vulkan_scene_filter.txt -Raw).Trim() }
          $exe = "..\build\OloEngine\tests\$env:BUILD_TYPE\OloEngine-Tests.exe"
          $common = '--olo-rhi=vulkan', '--olo-require-vulkan', '--olo-golden-vendor=lavapipe', '--olo-perf-machine=ci-lavapipe-windows', '--gtest_catch_exceptions=1'
          $isolated = 'GroomSceneShadowVisualEvidenceTest'
          $positive, $negative = $filter -split '-', 2
          $mainFilter = $positive + '-' + ((@($negative, "$isolated.*") | Where-Object { $_ }) -join ':')
          & $exe @common "--gtest_filter=$mainFilter" --gtest_output=xml:..\test_results\vulkan_scene.xml
          $failed = $LASTEXITCODE -ne 0
          # The isolated cases are the ones the SAME filter selects, so its exclusions apply.
          $listing = & $exe --gtest_list_tests "--gtest_filter=$filter"
          if ($LASTEXITCODE -ne 0) { Write-Error "--gtest_list_tests exited $LASTEXITCODE; the isolated case set is unknown"; exit 1 }
          $suite = $null
          $cases = $listing | ForEach-Object {
            if ($_ -match '^([A-Za-z_][A-Za-z0-9_/]*)\.(\s+#.*)?$') { $suite = $Matches[1] }
            elseif ($suite -eq $isolated -and $_ -match '^  ([A-Za-z_][A-Za-z0-9_/]*)') { "$suite.$($Matches[1])" }
          }
          $index = 0
          foreach ($case in $cases) {
            & $exe @common "--gtest_filter=$case" "--gtest_output=xml:..\test_results\vulkan_scene_isolated_$index.xml"
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::$case failed in its own process"; $failed = $true }
            $index++
          }
          Write-Output "Isolated $isolated cases run: $index"
          if ($failed) { exit 1 }

      # The scene suite's MISSING-EXECUTION GATE, the L7 gate's twin: every case
      # the filter selects must have executed. A case that skipped -- a GL-only
      # read left in a ported test, an arm planned away -- fails the job here
      # rather than passing as green. The required set comes from
      # --gtest_list_tests over the same filter, and every suite it names is
      # accounted for, so a suite added to the filter is required without
      # editing this step.
      - name: Require every scene case to execute on Vulkan
        if: ${{ !cancelled() }}
        working-directory: OloEditor
        shell: pwsh
        env:
          OLO_SCENE_FILTER_OVERRIDE: ${{ inputs.scene_gtest_filter }}
        run: |
          $filter = if ($env:OLO_SCENE_FILTER_OVERRIDE) { $env:OLO_SCENE_FILTER_OVERRIDE } else { (Get-Content ..\OloEngine\tests\vulkan_scene_filter.txt -Raw).Trim() }
          & "..\build\OloEngine\tests\$env:BUILD_TYPE\OloEngine-Tests.exe" --gtest_list_tests "--gtest_filter=$filter" *> ..\test_results\vulkan_scene_cases.txt
          if ($LASTEXITCODE -ne 0) { Write-Error "--gtest_list_tests exited $LASTEXITCODE; the required case set is unknown"; exit 1 }
          $suites = Get-Content ..\test_results\vulkan_scene_cases.txt | Where-Object { $_ -match '^([A-Za-z_][A-Za-z0-9_/]*)\.(\s+#.*)?$' } | ForEach-Object { $Matches[1] } | Select-Object -Unique
          if (-not $suites) { Write-Error "the scene filter selected no suite"; exit 1 }
          $suiteArgs = $suites | ForEach-Object { '--suite', $_ }
          # One report from the shared process and one per isolated groom case.
          $reportArgs = @('..\test_results\vulkan_scene.xml') + @(Get-ChildItem ..\test_results\vulkan_scene_isolated_*.xml | ForEach-Object { $_.FullName }) | ForEach-Object { '--report', $_ }
          python ..\scripts\vulkan_ray_query_coverage.py --require --title 'Scene suite on the windowless Vulkan context (lavapipe)' `
            @reportArgs --expected-list ..\test_results\vulkan_scene_cases.txt `
            --capability-report ..\test_results\vulkan_capability_report.md @suiteArgs
          exit $LASTEXITCODE

      - name: Upload Vulkan software test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulkan_software_results
          path: |
            test_results/vulkan_software.xml
            test_results/ray_query_cases.txt
            test_results/vulkan_scene.xml
            test_results/vulkan_scene_isolated_*.xml
            test_results/vulkan_scene_cases.txt
          if-no-files-found: warn

      - name: Upload golden-image diffs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulkan_software_golden_diffs
          path: |
            OloEditor/assets/tests/golden/*.actual.png
            OloEditor/assets/tests/golden/*.diff.png
            OloEditor/assets/tests/golden/lavapipe/*.actual.png
            OloEditor/assets/tests/golden/lavapipe/*.diff.png
          if-no-files-found: ignore
