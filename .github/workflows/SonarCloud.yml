name: SonarCloud Scan
on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      # Agent tooling and lint/VCS config — none of it is compiled or analysed, so a
      # change here cannot alter the build or the scan. Without these, a docs-only PR
      # that also touches a slash command or a lint config pays the full ~137 min
      # Windows build / ~201 min SonarCloud scan for nothing (PR #788 did exactly that).
      - '.claude/**'
      - '.markdownlint-cli2.jsonc'
      - '.gitignore'

  # NO `pull_request` -- deliberately (#1009 item F). This scan ran on every PR at a
  # ~131 min median and was CANCELLED on 14 of 26 of them, so most of that time
  # produced no analysis at all; a scan that is cancelled two thirds of the time is
  # not a gate, it is a queue. It now runs where its result is durable: on the master
  # push (which it needs anyway -- the scan compares against the master baseline,
  # which is why this workflow KEEPS its push trigger where Windows.yml and asan.yml
  # gave theirs up) plus a nightly.
  #
  # What that gives up, stated plainly: a new SonarQube finding no longer blocks the
  # PR that introduced it. It surfaces on master minutes later instead. No status
  # check was required on master (verified via the branch-protection API), so this
  # changes when a finding is seen, not whether. The `/code-review` skill and
  # docs/agent-rules/sonarqube-review-alignment.md remain the pre-merge path for the
  # rules that matter.
  schedule:
    - cron: '31 2 * * *' # nightly 02:31 UTC — clear of the Windows (01:53) and
                         # Sanitizers (01:23) nightlies and of cross-vendor (03:47).

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel. Every trigger left on this workflow is a default-branch or manual
  # run whose whole value is the completed analysis -- and the scan is the ~201 min
  # long pole, so a cancel throws away more than any other job here. The old
  # expression cancelled `push` runs too, which is how a merge burst could leave
  # master with no fresh analysis at all.
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper output will be placed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          # The scan reads local git blame (no network auth) and pushes nothing,
          # so drop the persisted GITHUB_TOKEN to minimise its exposure. SONAR_TOKEN
          # (the scan's own credential) is passed explicitly to that step below.
          persist-credentials: false

      - name: Install Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          
      - name: Install python dependencies
        run: |
          # jinja2 pinned for githubactions:S8544 (lock resolved versions); bump deliberately.
          python -m pip install jinja2==3.1.6
          python -c "import jinja2; print(f'jinja2 {jinja2.__version__} installed at {jinja2.__file__}')"

      - name: Setup Vulkan SDK
        uses: ./.github/actions/setup-vulkan
      
      # cl.exe + Windows SDK include/lib paths on the job env for the Ninja
      # generator used by the build-wrapper step below. No sccache here (see that
      # step) — this is only to make Ninja + cl.exe work.
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1

      # Third-party deps come from the vcpkg manifest (issue #773). Ports are
      # restored from the Actions-backed binary cache — unlike sccache (disabled
      # below), a vcpkg cache hit does NOT hide compiler invocations from
      # build-wrapper: third-party code is not analysed by this scan anyway
      # (sonar-project.properties excludes it), and every OloEngine TU is still
      # compiled for real.
      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows-static-md

      - name: Run build-wrapper
        # NO sccache here, on purpose (issue #304): sccache is INCOMPATIBLE with
        # SonarQube's build-wrapper. build-wrapper analyses C/C++ by capturing each
        # real compiler invocation; a warm cache serves objects WITHOUT invoking
        # the compiler, so those TUs would silently vanish from the analysis — a
        # worse outcome than a slow build. The cold build is correct for this job.
        #
        # We DO use Ninja + `--parallel` (not the default VS/MSBuild generator):
        # build-wrapper wraps whatever build command it's given, so it captures a
        # Ninja build just fine, and a parallel Ninja clean build is faster than
        # MSBuild here. cl.exe comes from the msvc-dev-cmd step above. (Trade-off,
        # same as Windows.yml: Ninja doesn't build the C# ScriptCore project, but
        # the C-family analyzer doesn't analyse C# anyway.)
        #
        # -DBUILD_TESTS=OFF: the 398 test TUs are ~43% of the build and are
        # declared as test sources (sonar.tests), so production rules don't run on
        # them — building + parsing them was ~40% of this job's cost for near-zero
        # production-analysis value. Dropping them shrinks BOTH the build and the
        # C-family scan. (Test code is no longer analysed; it was already heavily
        # rule-excluded — see sonar-project.properties tst_* ignores.)
        run: |
          New-Item -ItemType directory -Path build
          cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DPython_EXECUTABLE="${{ env.pythonLocation }}/python.exe" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DOLO_VIDEO_FFMPEG=OFF -DOLO_WITH_USD=OFF -DOLO_WITH_ALEMBIC=OFF -DOLO_WITH_MATERIALX=OFF -DBUILD_TESTS=OFF ${{ steps.vcpkg.outputs.toolchain-args }}
          build-wrapper-win-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build build/ --config Release --parallel

      # The other half of setup-vcpkg's restore/save split (#1009). `if: always()`
      # is the whole point: the combined actions/cache action saves in a POST-JOB
      # step, which a CANCELLED job skips -- and most PR runs here are cancelled.
      # Placed before the build so a cancellation during the long build/test tail
      # still banks the ports this run just spent ~40 minutes installing.
      - name: Save vcpkg binary cache
        if: always()
        uses: ./.github/actions/save-vcpkg-cache
        with:
          key: ${{ steps.vcpkg.outputs.cache-key }}
          path: ${{ steps.vcpkg.outputs.cache-path }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Raise the scanner JVM heap. The C-family analysis of this 312k-LOC engine
          # OOMed ("java.lang.OutOfMemoryError: Java heap space") on a *cold* full scan —
          # the scan cache is invalidated whenever the C++ Extended quality profile
          # changes, which forces a from-scratch re-analysis that exceeds the scanner's
          # default heap. windows-2025 has 16 GB; 6 GB leaves ample headroom for the
          # forked analyzer subprocess. SONAR_SCANNER_JAVA_OPTS is the correct knob for
          # sonar-scanner-cli >= 6.0 (older releases used SONAR_SCANNER_OPTS).
          SONAR_SCANNER_JAVA_OPTS: "-Xmx6g"
        with:
          # sonar.cfamily.threads=4: parallelise the C-family analysis across the
          # runner's 4 vCPUs (windows-2025). The analyzer is the ~51-min half of
          # this job; threading it is the biggest single scan-time lever. The
          # -Xmx6g heap above has headroom for the parallel workers.
          #
          # sonar.cfamily.compile-commands (issue #411 item 2): build-wrapper now
          # emits a standard compile_commands.json alongside its legacy dump inside
          # --out-dir; pointing the analyzer at that file uses the supported,
          # non-deprecated ingestion path instead of 'build-wrapper-output'. The
          # build-wrapper install/run steps above are unchanged: build-wrapper still
          # captures every build subprocess (including the OloHeaderTool codegen
          # custom target), it just also produces this file now. Validated via
          # workflow_dispatch run 29009983658 (2026-07-09): the deprecation warning
          # is gone and the analysis is normal-sized (536 CUs, 22433 issues,
          # EXECUTION SUCCESS). Note: the separate build-wrapper/analyzer
          # version-mismatch warning ("...does not match the analyzer version...")
          # is UNRELATED to this property and still fires — it comes from
          # provenance metadata embedded in the file itself by whichever
          # build-wrapper build sonarqube-scan-action's install-build-wrapper step
          # downloads, which doesn't match that same action's bundled analyzer
          # version. Not fixable from this workflow; see
          # docs/analysis/sonarqube-rules.md #411 item B for detail.
          args: >
            --define sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
            --define sonar.cfamily.threads=4
