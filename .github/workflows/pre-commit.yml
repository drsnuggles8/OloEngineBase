name: Pre-commit checks

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `pre-commit run` only reads the working tree locally — no authenticated
          # git writes — so drop the persisted GITHUB_TOKEN to minimise exposure.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      # The vendor-golden-twins hook diffs the PR against its base, which the
      # depth-1 checkout does not contain. Both commits are enough: it diffs
      # two trees and needs no merge-base.
      - name: Fetch the PR base for the vendor-golden-twins hook
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          echo "OLO_GOLDEN_TWIN_BASE=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Test the vendor-golden-twins check
        run: python -m unittest discover -s scripts -p test_vendor_golden_twins.py -v

      - name: Run pre-commit
        run: pre-commit run --all-files
