# Skip vendor, mono, and common IDE/build metadata
# pre-commit paths are matched against repository-relative file paths; the regex below
# excludes common third-party / generated directories we don't want to modify.
# Match either start-of-string or a path separator before the directory name so
# that subdirectories (e.g. `OloEngine/mono/`) are excluded as well.
exclude: '(^|/)(vendor|mono|\.vs|\.vscode|build|bin|\.github/workflows|\.idea)/'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: trailing-whitespace
      # Limit to common source file extensions (C/C++, C#, Lua, shaders, headers)
      files: '\.(c|cc|cpp|cxx|h|hh|hpp|ipp|inl|cs|lua|glsl|vert|frag|shader)$'
    - id: end-of-file-fixer
      files: '\.(c|cc|cpp|cxx|h|hh|hpp|ipp|inl|cs|lua|glsl|vert|frag|shader)$'
    - id: check-yaml

- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v21.1.8
  hooks:
    - id: clang-format
      name: clang-format
      files: '\.(c|cc|cpp|cxx|h|hh|hpp|ipp|inl)$'
      # OloHeaderTool output must NOT be reformatted here. The tool rewrites a
      # generated file whenever its content differs from what is on disk
      # (WriteIfChanged), so formatting those files creates a loop: build emits
      # raw -> clang-format rewrites it -> next build sees a difference and
      # rewrites it raw -> every TU that #includes it recompiles. That made a
      # no-op run rebuild the whole engine, and left the generated .inl showing
      # as modified in git after every build.
      exclude: '^OloEngine/(vendor|mono)/|/Generated/'
      args: ["--style=file"]

- repo: local
  hooks:
    - id: test-catalogue-classified
      name: every test file is classified
      description: >-
        Fails if a test .cpp is classified by neither an in-file
        '// OLO_TEST_LAYER: <id>' marker nor a file_layer_map entry in
        OloEngine/tests/scripts/test_catalogue.json. The rendered catalogue tables
        are generated, git-ignored documents (docs/test-catalogue.*.md) and are NOT
        checked for staleness here. Regenerate them with
        'python OloEngine/tests/scripts/generate_test_catalogue.py'.
      entry: python OloEngine/tests/scripts/generate_test_catalogue.py --check
      language: system
      pass_filenames: false
      files: '(OloEngine/tests/.*\.cpp|OloEngine/tests/scripts/(test_catalogue\.json|generate_test_catalogue\.py))$'

    - id: test-temp-dir-isolated
      name: tests do not name the shared temp root directly
      description: >-
        Fails if a file under OloEngine/tests calls
        std::filesystem::temp_directory_path() instead of going through
        OloEngine::Tests::TempDir() / TempFile() (OloEngine/tests/TestTempDir.h).
        Every gtest case runs in its own process and CI runs them in parallel, so a
        fixed temp path is shared mutable state ACROSS processes — the failure shows
        up as !ofstream.is_open() or empty content, never as anything saying "race"
        (issue #789). A site that genuinely must name the system temp root opts out
        with '// OLO_TEMP_DIR_OK: <reason>'. See
        docs/agent-rules/shared-temp-dir-test-isolation.md.
      entry: python OloEngine/tests/scripts/check_temp_dir_isolation.py
      language: system
      pass_filenames: false
      files: '(OloEngine/tests/.*\.(cpp|h|hpp|inl)|OloEngine/tests/scripts/check_temp_dir_isolation\.py)$'
