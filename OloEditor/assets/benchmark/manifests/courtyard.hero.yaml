# Courtyard — hero capture (issue #974). 4K presentation frame, judged by
# eyes, committed to docs/images/benchmarks/ — never a regression golden.
# Camera convention (EditorCamera): YawDegrees 0 looks -Z, +90 looks +X;
# positive PitchDegrees looks DOWN (negative looks up).
ManifestVersion: 2
Id: courtyard-hero
Product: hero
Scene: Scenes/Benchmark/Courtyard.olo

Backends:
  Supported: [opengl, vulkan]
  Features:
    vulkan:
      UnsupportedAttachments: []

Camera:
  Id: hero-dusk
  # Ground level at the west end, tilted slightly up, staring east straight
  # into the low sun (sun direction travels -X, so its disk side is +X):
  # volumetric shafts rake through the colonnade, long column shadows run at
  # the camera, colored grid lights glow in the vaults, the emissive decal
  # blooms on the floor, and the garden reads through the far opening.
  # Same axis as the golden's swept pose (probe a-atrium-axis), pulled back
  # and slightly tighter for the 4K composition.
  Position: [-9.6, 1.9, 0.0]
  YawDegrees: 90.0
  PitchDegrees: -4.0
  FovDegrees: 55.0
  Near: 0.05
  Far: 2500.0

Output:
  Resolution: [3840, 2160]
  RenderScale: 1.0

# NOTE: TAA is not toggleable here (v1 RendererSettings allowlist) and not
# scene-serialized — see courtyard.golden.yaml.
RendererSettings:
  Path: Deferred
  EnableDDGI: true

Exposure:
  Mode: Manual
  Exposure: 1.0

Determinism:
  Seed: 974
  StartTimeSeconds: 12.0
  FixedDtSeconds: 0.016666666

Warmup:
  Frames: 128
  PerFeature:
    TAA: 8
    SSGI: 16
    SSR: 16
    Fog: 16
    DDGI: 128

Attachments:
  - Name: Beauty
    Source: UIComposite
    Format: png
  - Name: SceneColorHDR
    Source: SceneColor
    Format: hdr

Tolerance:
  # Hero frames are judged by eyes; repeatability documented, not gating.
  RepeatRmse: 0.0

