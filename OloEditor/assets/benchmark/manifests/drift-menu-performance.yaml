# Small/startup workload paired with the dense integrated manifests (#1339).
# A stationary camera permits long tail runs without walking out of the scene.
ManifestVersion: 2
Id: drift-menu-performance
Product: diagnostic
Scene: Scenes/DriftMenu.olo
Backends:
  Supported: [opengl, vulkan]
  Features:
    vulkan:
      UnsupportedAttachments: []
Camera:
  Id: stationary
  Position: [0.0, 0.0, 5.0]
  YawDegrees: 0.0
  PitchDegrees: 0.0
  FovDegrees: 45.0
  Near: 0.01
  Far: 1000.0
Output:
  Resolution: [1920, 1080]
  RenderScale: 1.0
RendererSettings:
  Path: Deferred
  RayTracedShadowsEnabled: false
  EnableDDGI: false
  TAAEnabled: false
  MSAASampleCount: 1
  Upscale: 'Off'
  UpscaleTechnique: Spatial
Exposure:
  Mode: Manual
  Exposure: 1.0
Determinism:
  Seed: 1339
  StartTimeSeconds: 12.0
  FixedDtSeconds: 0.016666666
Warmup:
  Frames: 64
Attachments:
  - Name: Beauty
    Source: UIComposite
    Format: png
Measurement:
  Frames: 1000
  DeadlineMs: 33.333
Presets:
  opengl: gl-deferred-native
  vulkan: vk-deferred-native
Tolerance:
  # Performance-only fixture: exact-repeat image bound is not calibrated here.
  RepeatRmse: 0.0
