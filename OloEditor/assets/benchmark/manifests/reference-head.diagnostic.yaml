# Reference head — diagnostic capture, four sequences (issue #1239).
#
# The four cameras ARE the acceptance criterion: frontal, grazing, backlit and
# moving. Each is a deterministic camera cut re-warmed by its own WarmupFrames;
# the moving one additionally advances its pose every frame (Motion:, new in
# ManifestVersion 2) so the velocity buffer and the temporal-history rejection
# paths see real movement rather than a still frame at a different place.
#
# Camera convention (EditorCamera): YawDegrees 0 looks -Z, +90 looks +X;
# positive PitchDegrees looks DOWN.
ManifestVersion: 2
Id: reference-head
Product: diagnostic
Scene: Scenes/Benchmark/ReferenceHead.olo
Description: >-
  Head-scale subjects under a pinned studio rig. Suzanne measures shape
  response (silhouette, grazing specular, backlit rim) on untextured organic
  geometry; DamagedHelmet measures the same rig against real PBR texture
  detail. Records the pre-skin-shading baseline for epic #1225.

Backends:
  Supported: [opengl, vulkan]
  Features:
    vulkan:
      UnsupportedAttachments: []

Cameras:
  # 1) FRONTAL. Straight on from +Z, eye level with the subjects. The key
  #    light comes from front-right-above, so this is the conventionally lit
  #    reference view — the one a skin shader would be judged against first.
  #    Pays the full warm-up (inherits Warmup.Frames).
  - Id: frontal
    Position: [0.0, 1.08, 3.10]
    YawDegrees: 0.0
    PitchDegrees: 1.0
    FovDegrees: 42.0
    Near: 0.05
    Far: 200.0
  # 2) GRAZING. Off to the +X side and slightly above, so the view direction
  #    runs nearly tangent to Suzanne's cheek. Grazing angles are where the
  #    specular lobe and the normal map do their most visible work, and where
  #    a missing sheen/fuzz term shows up as a too-clean falloff.
  - Id: grazing
    Position: [2.90, 1.25, 1.70]
    YawDegrees: -60.0
    PitchDegrees: 4.0
    FovDegrees: 42.0
    Near: 0.05
    Far: 200.0
    WarmupFrames: 32
  # 3) BACKLIT. From -Z looking back at the pair, so the key light is BEHIND
  #    the subjects. This is the transmission/rim test: with no subsurface
  #    scattering the ears and nose read as opaque silhouette, which is
  #    precisely the limitation this fixture is here to record.
  - Id: backlit
    Position: [0.0, 1.12, -3.35]
    YawDegrees: 180.0
    PitchDegrees: 1.5
    FovDegrees: 42.0
    Near: 0.05
    Far: 200.0
    WarmupFrames: 32
  # 4) MOVING. A left-to-right dolly across the front with a slow counter-yaw,
  #    the standard "turnaround" a character shot gets reviewed on. Over its
  #    32 warm-up frames at the fixed dt (0.533 s) the camera travels +0.64 m
  #    and yaws -3.2 degrees; the capture is taken at the LAST warm-up frame,
  #    so the recorded pose is the integrated one (result.json capturedPose).
  - Id: moving
    Position: [-1.30, 1.08, 3.05]
    YawDegrees: 14.0
    PitchDegrees: 1.0
    FovDegrees: 42.0
    Near: 0.05
    Far: 200.0
    WarmupFrames: 32
    Motion:
      VelocityPerSecond: [1.2, 0.0, 0.0]
      YawRateDegreesPerSecond: -6.0
      PitchRateDegreesPerSecond: 0.0

Output:
  Resolution: [1920, 1080]
  RenderScale: 1.0

RendererSettings:
  Path: Deferred
  EnableDDGI: false
  TAAEnabled: true

Exposure:
  Mode: Manual
  Exposure: 1.0

Determinism:
  Seed: 1239
  StartTimeSeconds: 12.0
  FixedDtSeconds: 0.016666666

Warmup:
  Frames: 64
  PerFeature:
    TAA: 8
    SSAO: 4
    SSR: 16
    Exposure: 30

Attachments:
  - Name: Beauty
    Source: UIComposite
    Format: png
  - Name: SceneColorHDR
    Source: SceneColor
    Format: hdr
  - Name: Albedo
    Source: GBufferAlbedo
    Format: png
  - Name: Normals
    Source: GBufferNormal
    Format: png
    Normalize: none
  - Name: Velocity
    Source: Velocity
    Format: png
    # NORMALIZED, and it has to be. Measured on the reference-head fixture:
    # screen-space velocity at these speeds spans about -0.004..0.001, so an
    # unnormalized PNG quantises the whole field to 0 or 1 of 255 and the
    # moving sequence's headline AOV reads as a black frame. The absolute
    # floats stay in result.json's per-attachment min/max; this image is for
    # SEEING the field. Note the scaling is per camera, so compare velocity
    # magnitudes across cameras via result.json, never by eye across these PNGs.
    Normalize: on
  - Name: AOBuffer
    Source: AOBuffer
    Format: png
  - Name: SceneDepth
    Source: SceneDepth
    Format: png
    Normalize: auto
  - Name: ShadowMapCSMCascade0
    Source: ShadowMapCSMCascade0
    Format: png
    Normalize: auto
  - Name: LinearDepth
    Source: SceneDepth
    Format: hdr
    Derive: linear-depth
  - Name: Roughness
    Source: GBufferNormal
    Format: png
    Derive: channel-b
  - Name: Metallic
    Source: GBufferAlbedo
    Format: png
    Derive: channel-a

Tolerance:
  # MEASURED 2026-09-13 on OLE (RTX 4090, NVIDIA GeForce RTX 4090/PCIe/SSE2,
  # Debug, OpenGL): two fresh capture processes produced 44/44 BYTE-IDENTICAL
  # attachments across all four cameras — the moving camera included, and for
  # the animal fixtures with the skinned Walk clip running.
  #
  # Zero, not a small tolerance, and that is a real result rather than a lucky
  # one: these fixtures run no SSGI/SSR temporal resolve over a clustered light
  # cull, which is the float-accumulation-order noise the Courtyard manifests
  # document a 0.05 bound for. Camera motion does not weaken it because the
  # pose is a closed form of the frame index, not an accumulation.
  #
  # If this ever fails, something became genuinely nondeterministic. Do not
  # widen it to make a run pass.
  RepeatRmse: 0.0

