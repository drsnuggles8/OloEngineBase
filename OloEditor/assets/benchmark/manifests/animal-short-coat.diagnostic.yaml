# Short-coated animal — diagnostic capture, four sequences (issue #1239).
#
# Khronos Fox, Walk clip playing. The animation is driven by the manifest's
# fixed dt through Scene::OnUpdateEditor's edit-mode animation preview, so the
# pose at the capture frame is a function of the frame index alone — a skinned
# subject is as reproducible here as a static one.
#
# The subject is rotated -90 degrees about Y so it faces +X, matching the
# long-coated fixture. The two animal manifests share ground, sky, light rig,
# resolution and warm-up schedule on purpose: the ONLY difference between
# their captures should be the coat.
#
# Camera convention (EditorCamera): YawDegrees 0 looks -Z, +90 looks +X;
# positive PitchDegrees looks DOWN.
ManifestVersion: 2
Id: animal-short-coat
Product: diagnostic
Scene: Scenes/Benchmark/AnimalShortCoat.olo
Description: >-
  Skinned, animated, short-coated quadruped (Khronos Fox) with the coat painted
  into a single albedo texture — how a shipping short-coated character is
  actually authored. The reference against which the long-coat shell and any
  future groom are judged.

Backends:
  Supported: [opengl, vulkan]
  Features:
    vulkan:
      UnsupportedAttachments: []

Cameras:
  # 1) FRONTAL. In front of the head looking back along -X, slightly above eye
  #    height. The sun comes from behind-left, so the face sits in bounce and
  #    fill — the view that shows how much shape survives without direct light.
  - Id: frontal
    Position: [2.00, 0.75, 1.20]
    YawDegrees: -59.0
    PitchDegrees: 7.0
    FovDegrees: 45.0
    Near: 0.05
    Far: 400.0
  # 2) GRAZING. Low and behind the shoulder, looking forward along the flank so
  #    the low sun rakes across it. Short coat reads here as a normal-map
  #    gradient, which is exactly the comparison the long-coat fixture's shell
  #    silhouette is set against.
  - Id: grazing
    Position: [-1.40, 0.22, 1.90]
    YawDegrees: 36.4
    PitchDegrees: -4.0
    FovDegrees: 45.0
    Near: 0.05
    Far: 400.0
    WarmupFrames: 32
  # 3) BACKLIT. Looking INTO the sun (which comes from +X/+Y/+Z), so the
  #    subject is rim-lit against the sky. With no fur shell and no
  #    transmission the coat edge is a hard alpha boundary — the limitation
  #    this fixture records for #1241.
  - Id: backlit
    Position: [-1.90, 0.55, -2.10]
    YawDegrees: 137.9
    PitchDegrees: 2.0
    FovDegrees: 45.0
    Near: 0.05
    Far: 400.0
    WarmupFrames: 32
  # 4) MOVING. A tracking shot drifting past the subject while the Walk clip
  #    plays, so the velocity buffer carries BOTH camera parallax and skinned
  #    deformation — the combination that makes temporal reprojection hard and
  #    that a still capture cannot show at all. Over 32 frames (0.533 s) the
  #    camera travels -0.85 m in X.
  - Id: moving
    Position: [2.20, 0.65, 2.20]
    YawDegrees: -45.0
    PitchDegrees: 6.0
    FovDegrees: 45.0
    Near: 0.05
    Far: 400.0
    WarmupFrames: 32
    Motion:
      VelocityPerSecond: [-1.6, 0.0, 0.0]
      YawRateDegreesPerSecond: 4.0
      PitchRateDegreesPerSecond: 0.0

Output:
  Resolution: [1920, 1080]
  RenderScale: 1.0

RendererSettings:
  Path: Deferred
  EnableDDGI: false
  TAAEnabled: true

Exposure:
  Mode: Manual
  Exposure: 1.0

Determinism:
  Seed: 1239
  StartTimeSeconds: 12.0
  FixedDtSeconds: 0.016666666

Warmup:
  Frames: 64
  PerFeature:
    TAA: 8
    SSAO: 4
    Exposure: 30
    # The Walk clip is ~1.2 s long; 64 frames at the fixed dt lands just past
    # its first second, well inside the loop rather than on the t=0 bind pose.
    Animation: 64

Attachments:
  - Name: Beauty
    Source: UIComposite
    Format: png
  - Name: SceneColorHDR
    Source: SceneColor
    Format: hdr
  - Name: Albedo
    Source: GBufferAlbedo
    Format: png
  - Name: Normals
    Source: GBufferNormal
    Format: png
    Normalize: none
  - Name: Velocity
    Source: Velocity
    Format: png
    # NORMALIZED, and it has to be. Measured on the reference-head fixture:
    # screen-space velocity at these speeds spans about -0.004..0.001, so an
    # unnormalized PNG quantises the whole field to 0 or 1 of 255 and the
    # moving sequence's headline AOV reads as a black frame. The absolute
    # floats stay in result.json's per-attachment min/max; this image is for
    # SEEING the field. Note the scaling is per camera, so compare velocity
    # magnitudes across cameras via result.json, never by eye across these PNGs.
    Normalize: on
  - Name: AOBuffer
    Source: AOBuffer
    Format: png
  - Name: SceneDepth
    Source: SceneDepth
    Format: png
    Normalize: auto
  - Name: ShadowMapCSMCascade0
    Source: ShadowMapCSMCascade0
    Format: png
    Normalize: auto
  - Name: LinearDepth
    Source: SceneDepth
    Format: hdr
    Derive: linear-depth
  - Name: Roughness
    Source: GBufferNormal
    Format: png
    Derive: channel-b

Tolerance:
  # MEASURED 2026-09-13 on OLE (RTX 4090, NVIDIA GeForce RTX 4090/PCIe/SSE2,
  # Debug, OpenGL): two fresh capture processes produced 40/40 BYTE-IDENTICAL
  # attachments across all four cameras — the moving camera included, and for
  # the animal fixtures with the skinned Walk clip running.
  #
  # Zero, not a small tolerance, and that is a real result rather than a lucky
  # one: these fixtures run no SSGI/SSR temporal resolve over a clustered light
  # cull, which is the float-accumulation-order noise the Courtyard manifests
  # document a 0.05 bound for. Camera motion does not weaken it because the
  # pose is a closed form of the frame index, not an accumulation.
  #
  # If this ever fails, something became genuinely nondeterministic. Do not
  # widen it to make a run pass.
  RepeatRmse: 0.0

Assets:
  - Path: assets/models/Fox/Fox.gltf
    Origin: KhronosGroup glTF-Sample-Assets — "Fox" (model PixelMannen, rig/animation @tomkranis, conversion AsoboStudio)
    # Mixed rights, and the split matters: the MESH is CC0 but the RIG AND
    # ANIMATION are CC-BY 4.0, so a capture of this fixture that is published
    # anywhere carries an attribution obligation the mesh alone would not.
    License: CC0-1.0 AND CC-BY-4.0
    Redistribution: committed
    # No licence file sits beside this copy in-repo — the claim comes from the
    # upstream project, and saying so is the point of the field.
    LicenseVerified: upstream-declared
    Version: glTF-Sample-Assets Models/Fox (in-repo copy; upstream revision not recorded)
    Sha256: 681ae12c7eba99a68a1f8071889cadea95d01ade3b62816c3134bd63eead06c3
    # Fox.gltf's position accessor spans ~79 units in Y. The scene applies a
    # 0.01 scale to land a ~0.79 m animal; getting this wrong by 100x would
    # invalidate every screen-coverage number taken from the capture.
    Units: centimetres
    UpAxis: +Y
    ColorSpace: srgb
    Acquisition: https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/Fox
  - Path: assets/models/Fox/Fox.bin
    Origin: KhronosGroup glTF-Sample-Assets — "Fox" geometry + animation buffer
    License: CC0-1.0 AND CC-BY-4.0
    Redistribution: committed
    LicenseVerified: upstream-declared
    Version: glTF-Sample-Assets Models/Fox (in-repo copy)
    Sha256: c7d0d8de28a84d5b25623037f88e063e1502495a2ee6c55f182c61161ad12f80
    Units: centimetres
    UpAxis: +Y
    ColorSpace: n/a
    Acquisition: https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/Fox
  - Path: assets/models/Fox/Texture.png
    Origin: KhronosGroup glTF-Sample-Assets — "Fox" albedo (the coat IS this texture)
    License: CC0-1.0
    Redistribution: committed
    LicenseVerified: upstream-declared
    Version: glTF-Sample-Assets Models/Fox (in-repo copy)
    Sha256: 61c8b109ee7f8bf262791933380fafb1465f7b51cbe6472c2d21eff0b31f83a1
    Units: unitless
    UpAxis: n/a
    ColorSpace: srgb
    Acquisition: https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/Fox
  - Path: assets/textures/hdr/newport_loft.hdr
    Origin: Newport Loft HDR (sIBL Archive / HDR Labs) — in-repo editor asset
    License: unverified (no licence file in-repo; upstream sIBL Archive terms not confirmed)
    Redistribution: committed
    LicenseVerified: unverified
    Version: in-repo copy, upstream revision not recorded
    Sha256: f521688ab09b3e748341921d0c8c114d1256e6ca9e94c6e6783b9952b0042c44
    Units: unitless
    UpAxis: n/a
    ColorSpace: linear
    Acquisition: http://www.hdrlabs.com/sibl/archive.html (upstream archive; the in-repo copy predates this manifest)
