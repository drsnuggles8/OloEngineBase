# Woodland vegetation — diagnostic capture, four sequences (issue #1239).
#
# Dense pine/palm canopy with octahedral impostors plus a grass understory,
# over the same 192 m procedural terrain generator as the meadow (different
# seed and a 9 m height scale). Wind on, mock-clock driven, so the sway at the
# capture frame reproduces.
#
# Every camera is placed so the frame STRADDLES the impostor cross-fade band
# (ImpostorStartDistance 45 m, 18 m transition). The band is NOT mesh-vs-card:
# no foliage layer ever draws mesh geometry — FoliageRenderer::BuildQuadGeometry
# builds a 4-vertex card for every layer, and MeshPath only feeds the impostor
# bake. Near the camera the card reads a single atlas frame like a flat
# billboard; past the band it becomes the full parallax octahedral impostor
# (FoliageImpostorSampling.glsl). That transition is the thing a canopy fixture
# exists to measure. Real plant meshes are issue #1233.
#
# CURRENT LIMITATION THIS FIXTURE RECORDS: the atlas is baked from the two
# low-poly meshes generate_vegetation.py emits — a few dozen triangles each —
# because that is every tree this repository owns. This capture measures canopy
# DENSITY and the impostor transition honestly; it does not measure leaf
# detail, and nobody should read it as if it did.
#
# HISTORY: when this fixture was written (2026-09-13) the impostor canopy
# appeared in Beauty and ShadowMapCSMCascade0 but wrote NEITHER GBufferAlbedo
# NOR GBufferNormal, and on Vulkan it barely rendered at all. Both were fixed by
# PR #1265 (issue #1264) and re-verified on master 5acc47238 for issue #1267:
# the canopy is now in Albedo, Normals and AOBuffer on both backends. This
# manifest runs Deferred with the G-Buffer foliage programs present, so every
# layer routes to ScenePass and FoliagePass receives no commands at all.
# Keep the G-Buffer AOVs below — they are what caught it, and what would catch
# a regression.
#
# Camera convention (EditorCamera): YawDegrees 0 looks -Z, +90 looks +X;
# positive PitchDegrees looks DOWN.
ManifestVersion: 2
Id: woodland
Product: diagnostic
Scene: Scenes/Benchmark/Woodland.olo
Description: >-
  Dense wind-driven pine/palm canopy with octahedral impostors and a grass
  understory. The canopy half of the vegetation baseline for epic #1225;
  Meadow is the open-ground-cover half.

Backends:
  Supported: [opengl, vulkan]
  Features:
    vulkan:
      UnsupportedAttachments: []

Cameras:
  # 1) FRONTAL. Above the terrain's 9 m ceiling looking across the canopy with
  #    the sun behind the camera. Near trees are mesh, the ridge beyond 45 m is
  #    impostor cards. Pays the full warm-up.
  - Id: frontal
    Position: [0.0, 9.00, 20.0]
    YawDegrees: 0.0
    PitchDegrees: 1.0
    FovDegrees: 55.0
    Near: 0.05
    Far: 2000.0
  # 2) GRAZING. Dropped into the understory and levelled off, so the view runs
  #    through trunks rather than over the canopy. Raking sun, heavy
  #    inter-shadowing, and the impostor band sitting right in the middle
  #    distance where it is most visible.
  - Id: grazing
    Position: [0.0, 8.00, 8.0]
    YawDegrees: 0.0
    PitchDegrees: -1.0
    FovDegrees: 55.0
    Near: 0.05
    Far: 2000.0
    WarmupFrames: 32
  # 3) BACKLIT. Looking into the low sun through the canopy. Foliage cards have
  #    no transmission term, so leaves that should glow read as flat masks —
  #    and the impostor atlas, baked from the same opaque shading, cannot
  #    recover it either. Both limitations land in one frame.
  - Id: backlit
    Position: [-22.0, 9.00, -22.0]
    YawDegrees: 135.0
    PitchDegrees: 2.0
    FovDegrees: 55.0
    Near: 0.05
    Far: 2000.0
    WarmupFrames: 32
  # 4) MOVING. Flying forward at 8 m/s with a slow yaw, so trees cross the
  #    impostor threshold DURING the shot — the capture is the last of frames
  #    0..31, so it integrates 31 frames (0.517 s): 4.13 m and 1.55 degrees.
  #    That is the
  #    condition under which an impostor pop is visible at all, and it cannot
  #    be captured from a still camera.
  - Id: moving
    Position: [0.0, 9.00, 30.0]
    YawDegrees: 0.0
    PitchDegrees: 1.0
    FovDegrees: 55.0
    Near: 0.05
    Far: 2000.0
    WarmupFrames: 32
    Motion:
      VelocityPerSecond: [0.0, 0.0, -8.0]
      YawRateDegreesPerSecond: 3.0
      PitchRateDegreesPerSecond: 0.0

Output:
  Resolution: [1920, 1080]
  RenderScale: 1.0

RendererSettings:
  Path: Deferred
  EnableDDGI: false
  TAAEnabled: true

Exposure:
  Mode: Manual
  Exposure: 1.0

Determinism:
  Seed: 1239
  StartTimeSeconds: 12.0
  FixedDtSeconds: 0.016666666

Warmup:
  Frames: 64
  PerFeature:
    TAA: 8
    SSAO: 4
    Fog: 16
    Exposure: 30
    Wind: 64

Attachments:
  - Name: Beauty
    Source: UIComposite
    Format: png
  - Name: SceneColorHDR
    Source: SceneColor
    Format: hdr
  - Name: Albedo
    Source: GBufferAlbedo
    Format: png
  - Name: Normals
    Source: GBufferNormal
    Format: png
    Normalize: none
  - Name: Velocity
    Source: Velocity
    Format: png
    # NORMALIZED, and it has to be. Measured on the reference-head fixture:
    # screen-space velocity at these speeds spans about -0.004..0.001, so an
    # unnormalized PNG quantises the whole field to 0 or 1 of 255 and the
    # moving sequence's headline AOV reads as a black frame. The absolute
    # floats stay in result.json's per-attachment min/max; this image is for
    # SEEING the field. Note the scaling is per camera, so compare velocity
    # magnitudes across cameras via result.json, never by eye across these PNGs.
    Normalize: on
  - Name: AOBuffer
    Source: AOBuffer
    Format: png
  - Name: SceneDepth
    Source: SceneDepth
    Format: png
    Normalize: auto
  - Name: FogColor
    Source: FogColor
    Format: png
  - Name: ShadowMapCSMCascade0
    Source: ShadowMapCSMCascade0
    Format: png
    Normalize: auto
  - Name: LinearDepth
    Source: SceneDepth
    Format: hdr
    Derive: linear-depth
  - Name: Roughness
    Source: GBufferNormal
    Format: png
    Derive: channel-b

Tolerance:
  # MEASURED 2026-09-13 on OLE (RTX 4090, NVIDIA GeForce RTX 4090/PCIe/SSE2,
  # Debug, OpenGL): two fresh capture processes produced 44/44 BYTE-IDENTICAL
  # attachments across all four cameras — the moving camera included, and for
  # the animal fixtures with the skinned Walk clip running.
  #
  # Zero, not a small tolerance, and that is a real result rather than a lucky
  # one: these fixtures run no SSGI/SSR temporal resolve over a clustered light
  # cull, which is the float-accumulation-order noise the Courtyard manifests
  # document a 0.05 bound for. Camera motion does not weaken it because the
  # pose is a closed form of the frame index, not an accumulation.
  #
  # If this ever fails, something became genuinely nondeterministic. Do not
  # widen it to make a run pass.
  RepeatRmse: 0.0

